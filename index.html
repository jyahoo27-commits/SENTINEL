              if(sOdo > car.odo) await this.db.set(S.CARS, { ...car, odo: sOdo });
              if(sCost > 0){
                await this.db.add(S.TX, { amount: sCost, type: 'expense', category: 'Авто', comment: `${car.name}: ${it.label}${sComm ? ' · ' + sComm : ''}`, date: new Date().toISOString() });
                await this.db.adjustAccountBalance('expense', sCost);
              }
              closeModal();
              this._render(true);
            };
          };
        }

        div.querySelector(`[data-ednode="${it.id}"]`).onclick = () => openServiceNodeModal(it);
        wc.appendChild(div);
      });
      c.appendChild(wc);

      const sc = this._card();
      const itemOpts = items.map(it => `<option value="${it.id}">${it.label}</option>`).join('');
      sc.innerHTML = `
        <div class="card-title">📖 Записать ТО или ремонт в сервисную книжку</div>
        <div class="ig"><label class="lbl">Узел / Работа</label><select id="svc-it">${itemOpts}<option value="other">Другое ТО / Ремонт…</option></select></div>
        <div class="g2">
          <div class="ig"><label class="lbl">Пробег (км)</label><input type="text" inputmode="numeric" id="svc-o" value="${odo}"></div>
          <div class="ig"><label class="lbl">Стоимость (₽)</label><input type="text" inputmode="decimal" id="svc-c" placeholder="Необязательно"></div>
        </div>
        <div class="g2">
          <div class="ig"><label class="lbl">Дата</label><input type="date" id="svc-d" value="${today()}"></div>
          <div class="ig"><label class="lbl">Деталь / Бренд / Мастерская</label><input type="text" id="svc-n" placeholder="Артикул или комментарий"></div>
        </div>
        <button class="btn c full" id="svc-add">Записать в сервисную книжку</button>
      `;
      c.appendChild(sc);

      sc.querySelector('#svc-add').onclick = async () => {
        const itemId = sc.querySelector('#svc-it').value;
        const svcOdo = parseMoney(sc.querySelector('#svc-o').value) || odo;
        const cost = parseMoney(sc.querySelector('#svc-c').value);
        const comment = sc.querySelector('#svc-n').value.trim();
        const dt = sc.querySelector('#svc-d').value || today();

        const selItem = itemId !== 'other' ? items.find(it => it.id === parseInt(itemId)) : null;
        const label = selItem ? selItem.label : (comment || 'Другое ТО');

        await this.db.add(S.GARAGE, { car_id: car.id, type: selItem?.key || 'other', label, odometer: svcOdo, cost, comment, date: new Date(dt + 'T12:00:00').toISOString() });
        if (selItem) await this.db.set(S.SVC, { ...selItem, lastServiceOdo: svcOdo, conditionStatus: 'ok' });
        if (svcOdo > car.odo) await this.db.set(S.CARS, { ...car, odo: svcOdo });

        if (cost > 0) {
          await this.db.add(S.TX, { amount: cost, type: 'expense', category: 'Авто', comment: `${car.name}: ${label}` + (comment ? ' · ' + comment : ''), date: new Date(dt + 'T12:00:00').toISOString() });
          await this.db.adjustAccountBalance('expense', cost);
        }
        this._render(true);
      };

      const jc = this._card();
      jc.innerHTML = `
        <div class="card-title">
          <span>📖 Сервисная книжка: История (${logs.length})</span>
          <button class="btn g sm" id="jc-copy-book">📋 Скопировать книжку</button>
        </div>
      `;
      jc.querySelector('#jc-copy-book').onclick = () => this._openServiceBookExportModal(car, items, logs, carParts);
      if (!logs.length) {
        jc.insertAdjacentHTML('beforeend', '<div style="color:var(--muted);text-align:center;padding:16px">Записей пока нет</div>');
      } else {
        logs.forEach(log => {
          const row = document.createElement('div'); row.className = 'log-row';
          const del = document.createElement('button'); del.className = 'del-btn'; del.textContent='×';
          row.innerHTML = `
            <div style="min-width:0;flex:1"><span class="badge">${log.label}</span><div class="log-meta">${dStr(log.date)} · ${fmtI(log.odometer)} км${log.comment ? ' · ' + log.comment : ''}</div></div>
            <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">${log.cost ? `<span style="color:var(--orange);font-size:12px;font-weight:700">−${fmt(log.cost)} ₽</span>` : ''}</div>
          `;
          row.querySelector('div:last-child').appendChild(del);
          del.onclick = () => confirmDel(del, async () => {
            await this.db.del(S.GARAGE, log.id);
            if (log.cost > 0) {
              await this.db.adjustAccountBalance('expense', log.cost, 'card', '', true);
            }
            this._render(true);
          });
          jc.appendChild(row);
        });
      }
      c.appendChild(jc);
    }

    // ─── GARAGE SUB-TAB 2: MY USED PARTS CATALOG (БАЗА МОИХ ЗАПЧАСТЕЙ) ───
    if(this.garageSubTab === 'parts'){
      const pc = this._card();
      const PART_CATS = ['ДВС и фильтры','Тормозная система','Подвеска и рулевое','ГРМ и ремни','Масла и жидкости','Электрика и свет','Кузов и салон','Другое'];
      pc.innerHTML = `
        <div class="card-title">
          <span>🔩 База используемых запчастей (${carParts.length})</span>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.45">
          Сохраняй сюда проверенные запчасти, бренды и артикулы, которые подходят на твой автомобиль, чтобы при следующем ТО скопировать артикул в 1 тап:
        </div>
        <div class="g2">
          <div class="ig"><label class="lbl">Название детали</label><input id="pt-name" placeholder="Напр: Фильтр масляный"></div>
          <div class="ig"><label class="lbl">Категория</label><select id="pt-cat">${PART_CATS.map(x=>`<option value="${x}">${x}</option>`).join('')}</select></div>
        </div>
        <div class="g3">
          <div class="ig"><label class="lbl">Бренд / Фирма</label><input id="pt-brand" placeholder="Mann / NGK / TRW"></div>
          <div class="ig"><label class="lbl">Артикул (Партномер)</label><input id="pt-num" placeholder="W 712/83" style="font-weight:800;color:var(--cyan)"></div>
          <div class="ig"><label class="lbl">Цена (₽)</label><input type="text" inputmode="decimal" id="pt-price" placeholder="Необяз."></div>
        </div>
        <div class="ig"><label class="lbl">Отзыв / Заметка (подошло, ресурс, нюансы)</label><input id="pt-note" placeholder="Например: Отличный фильтр, клапан держит"></div>
        <button class="btn c full" id="pt-add">+ Сохранить деталь в каталог авто</button>

        <div class="search-row" style="margin-top:14px;margin-bottom:8px">
          <input type="text" id="pt-search" placeholder="🔍 Поиск по названию, бренду или артикулу...">
        </div>
        <div id="pt-list"></div>
      `;
      c.appendChild(pc);

      pc.querySelector('#pt-add').onclick = async () => {
        const name = pc.querySelector('#pt-name').value.trim();
        if(!name) return;
        const cat = pc.querySelector('#pt-cat').value;
        const brand = pc.querySelector('#pt-brand').value.trim();
        const partNo = pc.querySelector('#pt-num').value.trim();
        const price = parseMoney(pc.querySelector('#pt-price').value);
        const note = pc.querySelector('#pt-note').value.trim();
        await this.db.add(S.CPARTS, { car_id: car.id, name, cat, brand, partNo, price, note });
        this._render(true);
      };

      const renderPartsList = () => {
        const q = (pc.querySelector('#pt-search').value || '').toLowerCase();
        const listEl = pc.querySelector('#pt-list');
        listEl.innerHTML = '';
        const fil = carParts.filter(p => !q || (p.name||'').toLowerCase().includes(q) || (p.brand||'').toLowerCase().includes(q) || (p.partNo||'').toLowerCase().includes(q) || (p.cat||'').toLowerCase().includes(q));
        if(!fil.length){
          listEl.innerHTML = `<div style="color:var(--muted);text-align:center;padding:14px;font-size:12px">В каталоге пока нет сохранённых запчастей</div>`;
          return;
        }
        fil.forEach(p => {
          const item = document.createElement('div');
          item.className = 'spool-card';
          item.innerHTML = `
            <div style="min-width:0;flex:1">
              <div style="font-size:13px;font-weight:800;color:var(--text)">
                ${p.name} <span class="badge" style="margin-left:5px">${p.cat||'Авто'}</span>
              </div>
              <div style="font-size:11px;color:var(--muted);margin-top:4px">
                ${p.brand ? `Бренд: <b style="color:var(--text)">${p.brand}</b> · ` : ''}
                ${p.partNo ? `Артикул: <b style="color:var(--cyan)">${p.partNo}</b>` : 'Без артикула'}
                ${p.price > 0 ? ` · ~<b>${fmtI(p.price)} ₽</b>` : ''}
              </div>
              ${p.note ? `<div style="font-size:10.5px;color:#8ab0c8;margin-top:3px">💬 ${p.note}</div>` : ''}
            </div>
            <div style="display:flex;gap:6px;align-items:center">
              ${p.partNo ? `<button class="btn c sm" data-copypn="${p.partNo}" title="Скопировать артикул">📋 Артикул</button>` : ''}
              <button class="del-btn" data-delpt="${p.id}">×</button>
            </div>
          `;
          const copyBtn = item.querySelector(`[data-copypn]`);
          if(copyBtn){
            copyBtn.onclick = async () => {
              try {
                await navigator.clipboard.writeText(p.partNo);
                copyBtn.textContent = '✓ Скопировано';
                setTimeout(() => { copyBtn.textContent = '📋 Артикул'; }, 1500);
              } catch (_) {}
            };
          }
          const delBtn = item.querySelector(`[data-delpt="${p.id}"]`);
          delBtn.onclick = () => confirmDel(delBtn, async () => {
            await this.db.del(S.CPARTS, p.id);
            this._render(true);
          });
          listEl.appendChild(item);
        });
      };
      renderPartsList();
      pc.querySelector('#pt-search').oninput = renderPartsList;
    }

    // ─── GARAGE SUB-TAB 3: PLANNED REPAIRS & PARTS WISHLIST ───
    if(this.garageSubTab === 'tasks'){
      const pending = carTasks.filter(t => !t.done);
      const completed = carTasks.filter(t => t.done);
      const totalPlannedCost = pending.reduce((s, t) => s + (Number(t.price) || 0), 0);

      const tc = this._card();
      tc.innerHTML = `
        <div class="card-title">
          <span>📋 План работ и список покупок на авто</span>
          <span style="color:var(--orange)">Бюджет: ${fmtI(totalPlannedCost)} ₽</span>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:10px">
          Записывай сюда запчасти, которые нужно купить, или предстоящий ремонт, чтобы ничего не забыть:
        </div>
        <div class="g2">
          <div class="ig"><label class="lbl">Что купить / сделать</label><input id="ct-title" placeholder="Напр: Стойки стабилизатора"></div>
          <div class="ig"><label class="lbl">Примерная цена (₽)</label><input type="text" inputmode="decimal" id="ct-price" placeholder="Необязательно"></div>
        </div>
        <div class="g2">
          <div class="ig"><label class="lbl">Артикул / Заметка</label><input id="ct-part" placeholder="Артикул для заказа на Autodoc"></div>
          <div class="ig"><label class="lbl">Приоритет</label>
            <select id="ct-prio">
              <option value="high">🔴 Срочно</option>
              <option value="med" selected>🟠 В планах</option>
              <option value="low">🔵 На будущее / Тюнинг</option>
            </select>
          </div>
        </div>
        <button class="btn c full" id="ct-add">+ Добавить в список покупок авто</button>
        <div id="ct-list" style="margin-top:14px"></div>
      `;
      c.appendChild(tc);

      tc.querySelector('#ct-add').onclick = async () => {
        const title = tc.querySelector('#ct-title').value.trim();
        if(!title) return;
        const price = parseMoney(tc.querySelector('#ct-price').value);
        const partNo = tc.querySelector('#ct-part').value.trim();
        const prio = tc.querySelector('#ct-prio').value;
        await this.db.add(S.CTASK, { car_id: car.id, title, price, partNo, prio, done: false, createdAt: new Date().toISOString() });
        this._render(true);
      };

      const listEl = tc.querySelector('#ct-list');
      if(!pending.length && !completed.length){
        listEl.innerHTML = `<div style="color:var(--muted);text-align:center;padding:14px;font-size:12px">Список запланированных покупок и работ пока пуст</div>`;
      } else {
        const prioOrder = { high:1, med:2, low:3 };
        [...pending].sort((a,b)=>(prioOrder[a.prio]||2)-(prioOrder[b.prio]||2)).forEach(t => {
          const pBadge = t.prio==='high' ? '<span class="pill crit">СРОЧНО</span>' : t.prio==='low' ? '<span class="pill info">ПЛАН</span>' : '<span class="pill warn">ВАЖНО</span>';
          const row = document.createElement('div');
          row.className = 'log-row';
          row.innerHTML = `
            <div style="min-width:0;flex:1">
              <div style="font-size:12.5px;font-weight:700">${pBadge}${t.title}</div>
              <div class="log-meta">${t.partNo ? 'Артикул: <b>' + t.partNo + '</b> · ' : ''}${t.price > 0 ? `~${fmtI(t.price)} ₽` : 'без цены'}</div>
            </div>
            <div style="display:flex;gap:6px;align-items:center">
              <button class="btn g sm" data-ctdone="${t.id}" title="Выполнено / Куплено">✓ Купил</button>
              <button class="del-btn" data-ctdel="${t.id}">×</button>
            </div>
          `;
          row.querySelector(`[data-ctdone="${t.id}"]`).onclick = async () => {
            if(t.price > 0){
              customConfirm('Списать сумму из баланса?', `Записать покупку «<b>${t.title}</b>» (${fmtI(t.price)} ₽) в расходы категории «Авто»?`, async () => {
                await this.db.add(S.TX, { amount: t.price, type: 'expense', category: 'Авто', comment: `${t.title}${t.partNo ? ' (' + t.partNo + ')' : ''}`, date: new Date().toISOString() });
                await this.db.adjustAccountBalance('expense', t.price);
                await this.db.set(S.CTASK, { ...t, done: true });
                this._render(true);
              });
            } else {
              await this.db.set(S.CTASK, { ...t, done: true });
              this._render(true);
            }
          };
          const delBtn = row.querySelector(`[data-ctdel="${t.id}"]`);
          delBtn.onclick = () => confirmDel(delBtn, async () => {
            await this.db.del(S.CTASK, t.id);
            this._render(true);
          });
          listEl.appendChild(row);
        });

        if(completed.length){
          const det = document.createElement('details');
          det.innerHTML = `<summary>✅ Уже куплено / выполнено (${completed.length})</summary>`;
          completed.forEach(t => {
            const r = document.createElement('div');
            r.className = 'log-row';
            r.innerHTML = `<span style="text-decoration:line-through;color:var(--muted);font-size:11px">${t.title}${t.price?` (${fmtI(t.price)} ₽)`:''}</span><button class="del-btn" data-ctdel2="${t.id}">×</button>`;
            r.querySelector(`[data-ctdel2="${t.id}"]`).onclick = async () => {
              await this.db.del(S.CTASK, t.id);
              this._render(true);
            };
            det.appendChild(r);
          });
          listEl.appendChild(det);
        }
      }
    }

    // ─── GARAGE SUB-TAB 4: FUEL & AUTO EXPENSES ANALYTICS + CALCULATOR ───
    if(this.garageSubTab === 'fuel'){
      const now = new Date();
      const mStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const fuelTxs = allTxs.filter(t => t.type==='expense' && (t.category==='Бензин' || /бенз|азс|rnazk|лукойл|роснефть/i.test(t.comment||'')));
      const autoTxs = allTxs.filter(t => t.type==='expense' && t.category==='Авто');

      const fuelMonth = fuelTxs.filter(t=>new Date(t.date)>=mStart).reduce((s,t)=>s+t.amount,0);
      const autoMonth = autoTxs.filter(t=>new Date(t.date)>=mStart).reduce((s,t)=>s+t.amount,0);
      const fuelTotal = fuelTxs.reduce((s,t)=>s+t.amount,0);
      const autoTotal = autoTxs.reduce((s,t)=>s+t.amount,0);

      const fc = this._card();
      fc.innerHTML = `
        <div class="card-title">⛽ Расходы на автомобиль и топливо</div>
        <div class="g2" style="margin-bottom:10px">
          <div class="stat"><div class="v" style="color:var(--orange)">${fmtI(fuelMonth)} ₽</div><div class="l">Бензин за этот месяц</div></div>
          <div class="stat"><div class="v" style="color:var(--cyan)">${fmtI(autoMonth)} ₽</div><div class="l">Запчасти/Мойка за месяц</div></div>
          <div class="stat"><div class="v" style="color:var(--orange)">${fmtI(fuelTotal)} ₽</div><div class="l">Бензин за всё время</div></div>
          <div class="stat"><div class="v" style="color:var(--cyan)">${fmtI(autoTotal)} ₽</div><div class="l">Запчасти/Авто за всё время</div></div>
        </div>

        <div class="card-title" style="margin-top:14px">🧮 Калькулятор расхода топлива и поездки</div>
        <div class="g3">
          <div class="ig"><label class="lbl">Расход (л/100км)</label><input type="text" inputmode="decimal" id="fc-rate" placeholder="8.5" value="${car.fuelRate||8.5}"></div>
          <div class="ig"><label class="lbl">Цена 1 л (₽)</label><input type="text" inputmode="decimal" id="fc-price" placeholder="58.5" value="${car.fuelPrice||58.5}"></div>
          <div class="ig"><label class="lbl">Дистанция (км)</label><input type="text" inputmode="decimal" id="fc-dist" placeholder="100" value="100"></div>
        </div>
        <div id="fc-out" class="calc-result" style="margin-top:6px"></div>
      `;
      c.appendChild(fc);

      const updateFuelCalc = async () => {
        const rate = parseMoney(fc.querySelector('#fc-rate').value) || 8.5;
        const price = parseMoney(fc.querySelector('#fc-price').value) || 58.5;
        const dist = parseMoney(fc.querySelector('#fc-dist').value) || 100;
        const litersNeeded = (dist / 100) * rate;
        const tripCost = litersNeeded * price;
        const costPerKm = (rate / 100) * price;
        fc.querySelector('#fc-out').innerHTML = `
          <div class="b-row"><span class="b-key">Стоимость 1 км пробега по топливу:</span><span class="b-val" style="color:var(--cyan)">${fmt(costPerKm)} ₽/км</span></div>
          <div class="b-row"><span class="b-key">Потребуется топлива на ${fmtI(dist)} км:</span><span class="b-val">${litersNeeded.toFixed(1)} л</span></div>
          <div class="b-row"><span class="b-key">Стоимость поездки (${fmtI(dist)} км):</span><span class="b-val" style="color:var(--green);font-size:15px">${fmtI(tripCost)} ₽</span></div>
        `;
      };
      updateFuelCalc();
      ['#fc-rate','#fc-price','#fc-dist'].forEach(sel => {
        fc.querySelector(sel).oninput = updateFuelCalc;
      });
    }

    // ─── GARAGE SUB-TAB 5: CAR PASSPORT (VIN, OSAGO, TIRES, FLUIDS, NOTES) ───
    if(this.garageSubTab === 'info'){
      const ic = this._card();
      ic.innerHTML = `
        <div class="card-title">
          <span>🪪 Паспорт автомобиля и тех. шпаргалка</span>
          <button class="btn r sm" id="del-car-btn">Удалить авто</button>
        </div>
        <div class="g2">
          <div class="ig"><label class="lbl">Марка и модель</label><input id="cp-name" value="${car.name||''}"></div>
          <div class="ig"><label class="lbl">Госномер</label><input id="cp-plate" placeholder="А000АА 68" value="${car.plate||''}"></div>
          <div class="ig"><label class="lbl">VIN-номер (для подбора запчастей)</label><input id="cp-vin" placeholder="XTA..." value="${car.vin||''}"></div>
          <div class="ig"><label class="lbl">Страховка ОСАГО действует до</label><input type="date" id="cp-osago" value="${car.osagoDate||''}"></div>
          <div class="ig"><label class="lbl">Размер шин / Давление</label><input id="cp-tires" placeholder="185/60 R14 · 2.2 атм" value="${car.tires||''}"></div>
          <div class="ig"><label class="lbl">Залитое масло и объём</label><input id="cp-oil" placeholder="5W-30 · 3.2 л" value="${car.oilSpec||''}"></div>
        </div>
        <div class="ig">
          <label class="lbl">Общие заметки по автомобилю</label>
          <textarea id="cp-notes" placeholder="Дополнительные заметки, моменты затяжки, коды краски..." style="min-height:100px">${car.partsNotes||''}</textarea>
        </div>
        <div class="btn-row">
          <button class="btn c" id="cp-save" style="flex:1">💾 Сохранить паспорт авто</button>
          <button class="btn g" id="cp-export-book" style="flex:1">📋 Скопировать сервисную книжку</button>
        </div>
      `;
      c.appendChild(ic);

      ic.querySelector('#cp-export-book').onclick = () => this._openServiceBookExportModal(car, items, logs, carParts);
      ic.querySelector('#cp-save').onclick = async () => {
        const updatedCar = {
          ...car,
          name: ic.querySelector('#cp-name').value.trim() || car.name,
          plate: ic.querySelector('#cp-plate').value.trim(),
          vin: ic.querySelector('#cp-vin').value.trim(),
          osagoDate: ic.querySelector('#cp-osago').value,
          tires: ic.querySelector('#cp-tires').value.trim(),
          oilSpec: ic.querySelector('#cp-oil').value.trim(),
          partsNotes: ic.querySelector('#cp-notes').value
        };
        await this.db.set(S.CARS, updatedCar);
        showInlineMsg(ic, '✓ Паспорт автомобиля сохранён!', 'var(--green)');
        setTimeout(() => this._render(true), 600);
      };

      ic.querySelector('#del-car-btn').onclick = () => {
        customConfirm('Удалить автомобиль?', `Вы уверены, что хотите удалить <b>${car.name}</b>?`, async () => {
          await this.db.del(S.CARS, car.id);
          const sv = await this.db.all(S.SVC); for(const i of sv){if(i.car_id===car.id) await this.db.del(S.SVC, i.id);}
          const od = await this.db.all(S.ODO); for(const i of od){if(i.car_id===car.id) await this.db.del(S.ODO, i.id);}
          const lg = await this.db.all(S.GARAGE); for(const i of lg){if(i.car_id===car.id) await this.db.del(S.GARAGE, i.id);}
          this.activeCarId = null;
          this._render(true);
        });
      };
    }
  }

  /* ═══════ INTERACTIVE SMS PARSER TRAINER MODAL ═══════ */
  async _openSmsTrainerModal(sampleSms = '') {
    const rules = await this.db.all(S.RULES);
    const expCats = await this.db.getCats('expense');
    const incCats = await this.db.getCats('income');
    const m = document.getElementById('global-modal');
    const mc = document.getElementById('global-modal-content');

    mc.innerHTML = `
      <div class="card-title">
        <span>🤖 Обучение парсера СМС (Конструктор правил)</span>
        <button class="del-btn" id="st-close">✕</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.45">
        Вставь любое сообщение из банка, <b>нажми на ключевое слово</b> из текста (например, название магазина или отправителя) и укажи, к какой категории его всегда относить:
      </div>
      <div class="ig">
        <label class="lbl">1. Вставь пример текста СМС или уведомления</label>
        <textarea id="st-sample" placeholder="Например: MIR-8609 14:20 Покупка 450р SHAVERMA_24 Баланс: 1200р" style="min-height:56px;font-size:12px">${sampleSms}</textarea>
      </div>
      <div id="st-tokens-wrap" style="margin-bottom:10px;display:none">
        <label class="lbl">Нажми на слово из СМС, чтобы сделать его ключевым:</label>
        <div id="st-tokens"></div>
      </div>
      <div class="g2">
        <div class="ig">
          <label class="lbl">2. Ключевое слово / фраза из СМС</label>
          <input id="st-kw" placeholder="Напр: SHAVERMA_24" style="font-weight:800;color:var(--cyan)">
        </div>
        <div class="ig">
          <label class="lbl">Тип операции</label>
          <select id="st-type">
            <option value="expense">➖ Расход</option>
            <option value="income">➕ Доход</option>
          </select>
        </div>
      </div>
      <div class="g2">
        <div class="ig">
          <label class="lbl">3. Назначить категорию</label>
          <select id="st-cat"></select>
        </div>
        <div class="ig">
          <label class="lbl">Авто-комментарий (красивое имя)</label>
          <input id="st-comm" placeholder="Напр: Шаверма 24">
        </div>
      </div>
      <label class="mandatory-row" id="st-mand-row" style="margin-top:2px;margin-bottom:10px">
        <div class="mandatory-toggle"><input type="checkbox" id="st-mand"><span class="mandatory-knob"></span></div>
        <div class="mandatory-lbl">Считать обязательным платежом</div>
      </label>
      <button class="btn c full" id="st-save">💾 Сохранить правило распознавания</button>

      <div style="margin-top:14px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px">
        <div style="font-size:10px;font-weight:800;color:var(--cyan);text-transform:uppercase;margin-bottom:6px">
          📚 Мои правила распознавания СМС (${rules.length})
        </div>
        <div id="st-rules-list" class="hist-list" style="max-height:180px"></div>
      </div>
    `;
    m.classList.add('show');
    mc.querySelector('#st-close').onclick = closeModal;

    const sampleInp = mc.querySelector('#st-sample');
    const tokensWrap = mc.querySelector('#st-tokens-wrap');
    const tokensEl = mc.querySelector('#st-tokens');
    const kwInp = mc.querySelector('#st-kw');
    const typeSel = mc.querySelector('#st-type');
    const catSel = mc.querySelector('#st-cat');
    const commInp = mc.querySelector('#st-comm');
    const mandCb = mc.querySelector('#st-mand');
    const mandRow = mc.querySelector('#st-mand-row');

    const updateCatOpts = () => {
      const list = typeSel.value === 'income' ? incCats : expCats;
      catSel.innerHTML = list.map(x => `<option value="${x}">${x}</option>`).join('');
      mandRow.style.display = typeSel.value === 'expense' ? 'flex' : 'none';
    };
    updateCatOpts();
    typeSel.onchange = updateCatOpts;
    mandCb.onchange = () => mandRow.classList.toggle('on', mandCb.checked);

    const tokenizeSample = () => {
      const txt = sampleInp.value.trim();
      if (!txt) { tokensWrap.style.display = 'none'; return; }
      tokensWrap.style.display = 'block';
      // Extract meaningful words (ignore pure timestamps/card masks)
      const rawTokens = txt.split(/[\s,;:"'()\[\]]+/).map(t => t.replace(/^[.*•\-]+|[.,:;!]+$/g, '')).filter(t => t.length >= 2 && !/^\d+([.,]\d+)?(р|руб|₽)?$/i.test(t) && !/^\d{2}:\d{2}$/.test(t));
      const uniq = [...new Set(rawTokens)];
      tokensEl.innerHTML = uniq.map(tok => `<span class="sms-token" data-tok="${tok}">${tok}</span>`).join('');
      tokensEl.querySelectorAll('.sms-token').forEach(el => {
        el.onclick = () => {
          tokensEl.querySelectorAll('.sms-token').forEach(x => x.classList.remove('sel'));
          el.classList.add('sel');
          kwInp.value = el.dataset.tok;
          if (!commInp.value) commInp.value = el.dataset.tok;
        };
      });
    };
    tokenizeSample();
    sampleInp.oninput = tokenizeSample;

    const renderRulesList = async () => {
      const allR = await this.db.all(S.RULES);
      const listEl = mc.querySelector('#st-rules-list');
      if (!allR.length) {
        listEl.innerHTML = `<div style="color:var(--muted);font-size:11px;padding:8px 0">Пока нет пользовательских правил. Создай первое правило выше!</div>`;
        return;
      }
      listEl.innerHTML = '';
      allR.forEach(r => {
        const row = document.createElement('div');
        row.className = 'log-row';
        row.innerHTML = `
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:800;color:var(--cyan)">«${r.keyword}» → <span class="badge">${r.category}</span></div>
            <div class="log-meta">${r.type==='income'?'➕ Доход':'➖ Расход'}${r.comment ? ' · Комм: ' + r.comment : ''}${r.isMandatory ? ' · ★ Обяз.' : ''}</div>
          </div>
          <button class="del-btn" data-delrule="${r.id}">×</button>
        `;
        row.querySelector(`[data-delrule="${r.id}"]`).onclick = async () => {
          await this.db.del(S.RULES, r.id);
          renderRulesList();
          this._render(true);
        };
        listEl.appendChild(row);
      });
    };
    renderRulesList();

    mc.querySelector('#st-save').onclick = async () => {
      const keyword = kwInp.value.trim();
      if (!keyword) { showInlineMsg(mc, '⚠ Выбери или впиши ключевое слово из СМС', 'var(--red)'); return; }
      await this.db.add(S.RULES, {
        keyword,
        type: typeSel.value,
        category: catSel.value,
        comment: commInp.value.trim() || keyword,
        isMandatory: typeSel.value === 'expense' && mandCb.checked
      });
      kwInp.value = '';
      commInp.value = '';
      showInlineMsg(mc, `✓ Правило для «${keyword}» сохранено!`);
      renderRulesList();
      this._render(true);
    };
  }

  /* ═══════ HUB (WITH AI ADVISOR, SMS TRAINER & CUSTOM RECIPES MANAGER) ═══════ */
  async _hub(c){
    const txs=await this.db.all(S.TX);
    const goals=(await this.db.all(S.GOALS)).filter(g=>g.active);
    const recipes=await this.db.all(S.REC);
    const smsRules=await this.db.all(S.RULES);
    const now=new Date();
    const payday=calcNextPayday(txs);

    const lastExp=txs.filter(t=>t.type==='expense').sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
    const daysSince=lastExp?Math.floor((now-new Date(lastExp.date))/86400000):999;

    const remCard=this._card(' glow');
    remCard.innerHTML=`
      <div class="card-title">
        <span>⚡ Центр управления и ИИ-инструменты</span>
      </div>
      <div class="btn-row" style="margin-top:0;margin-bottom:10px">
        <button class="btn c" id="hub-open-ai" style="flex:1">🧠 AI-Советник и Аудит</button>
        <button class="btn v" id="hub-open-sms" style="flex:1">🤖 Обучить СМС (${smsRules.length})</button>
      </div>
      <div class="btn-row" style="margin-top:0;margin-bottom:8px">
        <button class="btn g sm" id="hub-open-cats" style="flex:1">⚙️ Категории и плашки</button>
        <button class="btn o sm" id="hub-open-loans" style="flex:1">🏦 Калькулятор кредитов</button>
      </div>
    `;
    let any=false;
    if(daysSince>=2){
      any=true;
      remCard.insertAdjacentHTML('beforeend',`<div class="reminder">📝 Последний расход записан ${daysSince} дн. назад. Нажми <b>«⚖️ Сверка»</b> сверху, чтобы быстро выровнять баланс!</div>`);
    }
    goals.forEach(goal=>{
      const saved=txs.filter(t=>t.type==='expense'&&t.category==='Цель'&&t.comment===goal.name).reduce((s,t)=>s+t.amount,0);
      const dl=new Date(goal.deadline);
      const dL=Math.ceil((dl-now)/86400000);
      if(dL>0&&dL<14&&saved<goal.targetAmount){any=true;remCard.insertAdjacentHTML('beforeend',`<div class="reminder red">🎯 "${goal.name}" — ${dL} дн. до дедлайна! Накоплено ${fmtI(saved)} из ${fmtI(goal.targetAmount)} ₽</div>`);}
    });
    if(!any) remCard.insertAdjacentHTML('beforeend','<div style="color:var(--green);font-size:12px;padding:4px 0">✅ Все финансовые показатели актуальны!</div>');
    c.appendChild(remCard);

    remCard.querySelector('#hub-open-ai').onclick = () => this._openAiAdvisorModal();
    remCard.querySelector('#hub-open-sms').onclick = () => this._openSmsTrainerModal('');
    remCard.querySelector('#hub-open-cats').onclick = () => this._openCategoryManagerModal('exp');
    remCard.querySelector('#hub-open-loans').onclick = () => {
      this.tab = 'loans';
      this._syncNavUI();
      this._render(false);
    };

    // Quick SMS Trainer Card right in Hub
    const smsCard = this._card();
    smsCard.innerHTML = `
      <div class="card-title">
        <span>🤖 Умный анализатор СМС (Мои правила: ${smsRules.length})</span>
        <button class="btn c sm" id="sms-add-rule-btn">+ Создать правило</button>
      </div>
      <div style="font-size:11px;color:var(--muted);line-height:1.45;margin-bottom:8px">
        Вставь любое нестандартное СМС от банка, выдели в нём ключевое слово (название сервиса, магазина или перевода) — и система навсегда запомнит, к какой категории его относить!
      </div>
      ${smsRules.length ? `
        <div class="chips-scroll">
          ${smsRules.map(r => `<div class="q-chip">${r.keyword} → <b>${r.category}</b></div>`).join('')}
        </div>
      ` : ''}
    `;
    c.appendChild(smsCard);
    smsCard.querySelector('#sms-add-rule-btn').onclick = () => this._openSmsTrainerModal('');

    const sc=this._card();
    sc.innerHTML=`<div class="card-title">Календарь ближайших выплат</div>
      ${(payday.allUpcoming||[]).map(p=>`
        <div class="b-row">
          <span class="b-key">${p.label}</span>
          <span class="b-val" style="color:var(--cyan)">${dStr(p.date)} <span style="font-size:10px;color:var(--muted)">(${Math.max(0,Math.ceil((p.date-now)/86400000))} дн.)</span></span>
        </div>
      `).join('')}
    `;
    c.appendChild(sc);

    const prCard=this._card();
    const sb=now.getDate()+now.getMonth()*31;
    prCard.innerHTML=`<div class="card-title">🖨 База знаний 3D-печати</div>
      <div class="tip">${PRINT_TIPS[sb%PRINT_TIPS.length]}</div>
      <div class="tip">${PRINT_TIPS[(sb+3)%PRINT_TIPS.length]}</div>`;
    c.appendChild(prCard);

    const openRecipeModal = (recToEdit = null) => {
      const m = document.getElementById('global-modal');
      const mc = document.getElementById('global-modal-content');
      const isEdit = Boolean(recToEdit);
      mc.innerHTML = `
        <div class="card-title">
          <span>${isEdit ? '✏️ Редактировать рецепт' : '🍳 Добавить свой рецепт'}</span>
          <button class="del-btn" id="rm-x">✕</button>
        </div>
        <div class="ig">
          <label class="lbl">Название блюда</label>
          <input id="rm-name" placeholder="Например: Шаурма домашняя / Овсяноблин" value="${recToEdit?.name||''}">
        </div>
        <div class="g3">
          <div class="ig">
            <label class="lbl">Категория</label>
            <select id="rm-cat">
              ${['Завтрак','Обед','Ужин','Перекус','Выпечка','Другое'].map(k=>`<option value="${k}" ${recToEdit?.cat===k?'selected':''}>${k}</option>`).join('')}
            </select>
          </div>
          <div class="ig">
            <label class="lbl">Время</label>
            <input id="rm-time" placeholder="20 мин" value="${recToEdit?.time||''}">
          </div>
          <div class="ig">
            <label class="lbl">Ккал / Выход</label>
            <input id="rm-cal" placeholder="~450 ккал" value="${recToEdit?.cal||''}">
          </div>
        </div>
        <div class="ig">
          <label class="lbl">Ингредиенты (каждый с новой строки)</label>
          <textarea id="rm-ingr" placeholder="Куриное филе — 300г&#10;Лаваш — 2 шт&#10;Сыр — 100г" style="min-height:80px">${(recToEdit?.ingr||[]).join('\n')}</textarea>
        </div>
        <div class="ig">
          <label class="lbl">Шаги приготовления (каждый шаг с новой строки)</label>
          <textarea id="rm-steps" placeholder="Нарезать курицу и обжарить&#10;Завернуть в лаваш с соусом&#10;Поджарить на сухой сковороде" style="min-height:90px">${(recToEdit?.steps||[]).join('\n')}</textarea>
        </div>
        <button class="btn c full" id="rm-save">${isEdit ? '💾 Сохранить рецепт' : '➕ Добавить в книгу рецептов'}</button>
      `;
      m.classList.add('show');
      mc.querySelector('#rm-x').onclick = closeModal;
      mc.querySelector('#rm-save').onclick = async () => {
        const name = mc.querySelector('#rm-name').value.trim();
        if(!name) return;
        const cat = mc.querySelector('#rm-cat').value;
        const time = mc.querySelector('#rm-time').value.trim() || '15 мин';
        const cal = mc.querySelector('#rm-cal').value.trim() || 'По вкусу';
        const ingr = mc.querySelector('#rm-ingr').value.split('\n').map(x=>x.trim()).filter(Boolean);
        const steps = mc.querySelector('#rm-steps').value.split('\n').map(x=>x.trim()).filter(Boolean);
        const payload = {
          name, cat, time, cal,
          ingr: ingr.length ? ingr : ['По вкусу'],
          steps: steps.length ? steps : ['Приготовить и подавать']
        };
        if(isEdit) await this.db.set(S.REC, { ...recToEdit, ...payload });
        else await this.db.add(S.REC, payload);
        closeModal();
        this._render(true);
      };
    };

    const recCard=this._card();
    recCard.innerHTML=`
      <div class="card-title">
        <span>🍳 Моя книга рецептов (${recipes.length})</span>
        <button class="btn c sm" id="add-rec-btn">+ Свой рецепт</button>
      </div>
      <div class="search-row">
        <select id="rec-cat">
          <option value="">Все категории</option>
          <option value="Завтрак">Завтрак</option>
          <option value="Обед">Обед</option>
          <option value="Ужин">Ужин</option>
          <option value="Перекус">Перекус</option>
          <option value="Выпечка">Выпечка</option>
          <option value="Другое">Другое</option>
        </select>
        <input type="text" id="rec-q" placeholder="Поиск по названию или продукту...">
      </div>
      <div id="rec-list"></div>`;
    c.appendChild(recCard);

    recCard.querySelector('#add-rec-btn').onclick = () => openRecipeModal(null);

    const renderRec=()=>{
      const cat=recCard.querySelector('#rec-cat').value;
      const q=recCard.querySelector('#rec-q').value.toLowerCase();
      let fil=[...recipes];
      if(cat) fil=fil.filter(r=>r.cat===cat);
      if(q) fil=fil.filter(r=>r.name.toLowerCase().includes(q) || (r.ingr||[]).some(i=>i.toLowerCase().includes(q)));
      const list=recCard.querySelector('#rec-list'); list.innerHTML='';
      if(!fil.length){
        list.innerHTML = `<div style="color:var(--muted);text-align:center;padding:14px;font-size:12px">Рецепты не найдены. Нажми «+ Свой рецепт», чтобы добавить!</div>`;
        return;
      }
      fil.forEach((rec,idx)=>{
        const rd=document.createElement('div'); rd.className='recipe';
        rd.innerHTML=`<div class="recipe-hd">
            <div style="min-width:0;flex:1">
              <div class="recipe-name">${rec.name} <span class="badge" style="margin-left:4px">${rec.cat}</span></div>
              <div class="recipe-meta">⏱ ${rec.time||'—'} · 🔥 ${rec.cal||'—'}</div>
            </div>
            <div style="display:flex;gap:6px;align-items:center">
              <button class="btn c sm" data-edrec="${rec.id}" style="padding:4px 8px">✏️</button>
              <button class="del-btn" data-delrec="${rec.id}">×</button>
            </div>
          </div>
          <div class="recipe-body" id="rb-${idx}">
            <div class="rsec">Ингредиенты</div><ul>${(rec.ingr||[]).map(i=>`<li>${i}</li>`).join('')}</ul>
            <div class="rsec">Приготовление</div>
            <ol>${(rec.steps||[]).map(s=>`<li>${s}</li>`).join('')}</ol>
          </div>`;
        const body=rd.querySelector(`#rb-${idx}`);
        rd.onclick=(e)=>{
          if(e.target.closest('button')) return;
          body.classList.toggle('open');
        };
        rd.querySelector(`[data-edrec="${rec.id}"]`).onclick = (e) => {
          e.stopPropagation();
          openRecipeModal(rec);
        };
        const delBtn = rd.querySelector(`[data-delrec="${rec.id}"]`);
        delBtn.onclick = (e) => {
          e.stopPropagation();
          confirmDel(delBtn, async () => {
            await this.db.del(S.REC, rec.id);
            this._render(true);
          });
        };
        list.appendChild(rd);
      });
    };
    renderRec();
    recCard.querySelector('#rec-cat').onchange=renderRec;
    recCard.querySelector('#rec-q').oninput=renderRec;
  }

  /* ═══════ EXPORT / IMPORT (UNIFIED v9 WITH ALL STORES) ═══════ */
  async _export(){
    const data={
      version:9,
      exportedAt:new Date().toISOString(),
      transactions:await this.db.all(S.TX),
      garage_logs:await this.db.all(S.GARAGE),
      odo_history:await this.db.all(S.ODO),
      service_items:await this.db.all(S.SVC),
      goals:await this.db.all(S.GOALS),
      settings:await this.db.all(S.CFG),
      cars:await this.db.all(S.CARS),
      filaments:await this.db.all(S.FIL),
      quick_templates:await this.db.all(S.TPL),
      recipes:await this.db.all(S.REC),
      car_tasks:await this.db.all(S.CTASK),
      car_parts:await this.db.all(S.CPARTS),
      loans:await this.db.all(S.LOANS),
      sms_rules:await this.db.all(S.RULES)
    };
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`sentinel-backup-${today()}.json`;
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  }

  async _import(file){
    if(!file) return;
    const text=await file.text();
    let data;
    try { data=JSON.parse(text); }
    catch {
      customConfirm('Ошибка файла', 'Не удалось прочитать JSON-файл резервной копии.', ()=>{});
      return;
    }

    customConfirm('Восстановить резервную копию?', `Загрузить копию от ${data.exportedAt ? dStr(data.exportedAt) : '?'}? Все данные будут обновлены.`, async () => {
      const map={
        transactions:S.TX, garage_logs:S.GARAGE, odo_history:S.ODO,
        service_items:S.SVC, goals:S.GOALS, settings:S.CFG,
        cars:S.CARS, filaments:S.FIL, quick_templates:S.TPL,
        recipes:S.REC, car_tasks:S.CTASK, car_parts:S.CPARTS,
        loans:S.LOANS, sms_rules:S.RULES
      };
      for(const [key,sn] of Object.entries(map)){
        if(!data[key]) continue;
        const ex=await this.db.all(sn);
        for(const r of ex) await this.db.del(sn,r.id||r.key);
        for(const r of data[key]){
          if(key==='transactions' && r.type==='transfer') continue;
          await this.db.set(sn,r);
        }
      }
      this._render(false);
    });
  }
}

new App();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
