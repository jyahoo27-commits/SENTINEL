        <button class="btn v sm" id="qm" style="flex:1">Месяц</button>
        <button class="btn v sm" id="qy" style="flex:1">Год</button>
        <button class="btn v sm" id="qa" style="flex:1">Всё время</button>
      </div>
      <details>
        <summary>📅 Выбрать точные даты периода</summary>
        <div class="g2" style="margin-top:8px">
          <div class="ig"><label class="lbl">От</label><input type="date" id="as" value="${this.statsStart}"></div>
          <div class="ig"><label class="lbl">До</label><input type="date" id="ae" value="${this.statsEnd}"></div>
        </div>
        <button class="btn c full sm" id="ap">Применить даты</button>
      </details>
    `;
    c.appendChild(pCard);

    // Quick view tabs so user never has to scroll past blocks they don't need
    const segBar = document.createElement('div');
    segBar.className = 'seg-bar';
    segBar.innerHTML = `
      <div class="seg-btn ${this.statsView==='all'?'active':''}" data-sv="all">Все блоки</div>
      <div class="seg-btn ${this.statsView==='charts'?'active':''}" data-sv="charts">🍩 Диаграммы</div>
      <div class="seg-btn ${this.statsView==='monthly'?'active':''}" data-sv="monthly">📊 По месяцам</div>
      <div class="seg-btn ${this.statsView==='trends'?'active':''}" data-sv="trends">📈 Динамика</div>
    `;
    c.appendChild(segBar);
    segBar.querySelectorAll('.seg-btn').forEach(b=>{
      b.onclick = () => { this.statsView = b.dataset.sv; this._render(); };
    });

    const upd=(s,e)=>{this.statsStart=s;this.statsEnd=e;this._render();};
    pCard.querySelector('#ap').onclick=()=>{const s=pCard.querySelector('#as').value,e=pCard.querySelector('#ae').value;if(s&&e&&s<=e)upd(s,e);};
    pCard.querySelector('#qt').onclick=()=>{const t=today();upd(t,t);};
    pCard.querySelector('#qm').onclick=()=>upd(new Date(now.getFullYear(),now.getMonth(),1).toISOString().split('T')[0],new Date(now.getFullYear(),now.getMonth()+1,0).toISOString().split('T')[0]);
    pCard.querySelector('#qy').onclick=()=>upd(`${now.getFullYear()}-01-01`,`${now.getFullYear()}-12-31`);
    pCard.querySelector('#qa').onclick=()=>{
      if(!txs.length){upd(today(),today());return;}
      const sorted=[...txs].sort((a,b)=>new Date(a.date)-new Date(b.date));
      upd(sorted[0].date.split('T')[0], today());
    };

    const s0=new Date(this.statsStart+'T00:00:00'), e0=new Date(this.statsEnd+'T23:59:59');
    const pTxs=txs.filter(t=>{const d=new Date(t.date);return d>=s0&&d<=e0;});
    const totalInc=pTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const totalExp=pTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const saldo=totalInc-totalExp;
    const saveRate = totalInc > 0 ? Math.round(((totalInc - totalExp) / totalInc) * 100) : 0;

    // Summary KPIs
    const sumCard=this._card();
    sumCard.innerHTML=`
      <div class="g3">
        <div class="stat"><div class="v" style="color:var(--green)">+${fmtI(totalInc)}</div><div class="l">Доходы ₽</div></div>
        <div class="stat"><div class="v" style="color:var(--red)">−${fmtI(totalExp)}</div><div class="l">Расходы ₽</div></div>
        <div class="stat"><div class="v" style="color:${saldo>=0?'var(--green)':'var(--red)'}">${saldo>=0?'+':''}${fmtI(saldo)}</div><div class="l">Сальдо (${saveRate}%)</div></div>
      </div>`;
    c.appendChild(sumCard);

    // 1. DONUT CHARTS FIRST (SO YOU NEVER HAVE TO SCROLL PAST MONTHS LIST TO SEE THEM!)
    if(this.statsView === 'all' || this.statsView === 'charts') {
      const expByCat={};
      pTxs.filter(t=>t.type==='expense').forEach(t=>{expByCat[t.category]=(expByCat[t.category]||0)+t.amount;});
      const cats=Object.keys(expByCat).sort((a,b)=>expByCat[b]-expByCat[a]);
      const vals=cats.map(k=>expByCat[k]);
      const totalE=vals.reduce((s,v)=>s+v,0)||1;
      const COLORS=['#00f0ff','#9b4dff','#00ff95','#ff4d5e','#ffa040','#38c8f0','#f06dff','#ffeb40','#ff9b4d'];

      const pieCard=this._card();
      pieCard.innerHTML='<div class="card-title">🍩 Расходы по категориям</div>';
      if(!cats.length){
        pieCard.insertAdjacentHTML('beforeend','<div style="color:var(--muted);text-align:center;padding:16px">Нет расходов за выбранный период</div>');
      } else {
        const wrap=document.createElement('div'); wrap.className='canvas-wrap';
        const canvas=document.createElement('canvas'); canvas.width=420; canvas.height=210;
        wrap.appendChild(canvas); pieCard.appendChild(wrap);
        const leg=document.createElement('div'); leg.className='chart-legend';
        cats.forEach((cat,i)=>{
          leg.insertAdjacentHTML('beforeend',`<span><span class="ld" style="background:${COLORS[i%COLORS.length]}"></span>${cat}: <b>${fmtI(vals[i])} ₽</b> (${((vals[i]/totalE)*100).toFixed(0)}%)</span>`);
        });
        pieCard.appendChild(leg);
        requestAnimationFrame(()=>{
          const ctx=canvas.getContext('2d');
          const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,R=Math.min(cx,cy)-10;
          let a=-Math.PI/2; ctx.clearRect(0,0,W,H);
          vals.forEach((v,i)=>{
            const sw=(v/totalE)*2*Math.PI;
            ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a,a+sw);ctx.closePath();
            ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();
            ctx.strokeStyle='#05060a';ctx.lineWidth=2;ctx.stroke();
            a+=sw;
          });
          ctx.beginPath();ctx.arc(cx,cy,R*.48,0,2*Math.PI);
          ctx.fillStyle='#090b12';ctx.fill();
          ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillStyle='#00f0ff';ctx.font='bold 14px Segoe UI,sans-serif';
          ctx.fillText(fmtI(totalE)+' ₽',cx,cy-7);
          ctx.fillStyle='#6c8296';ctx.font='10px Segoe UI,sans-serif';
          ctx.fillText('расходы',cx,cy+9);
        });
      }
      c.appendChild(pieCard);

      // Incomes Donut
      const incByCat={};
      pTxs.filter(t=>t.type==='income').forEach(t=>{incByCat[t.category]=(incByCat[t.category]||0)+t.amount;});
      const incCats=Object.keys(incByCat).sort((a,b)=>incByCat[b]-incByCat[a]);
      if(incCats.length){
        const incCard=this._card();
        incCard.innerHTML='<div class="card-title">💰 Доходы по источникам</div>';
        const wrap2=document.createElement('div'); wrap2.className='canvas-wrap';
        const cv2=document.createElement('canvas'); cv2.width=420; cv2.height=190;
        wrap2.appendChild(cv2); incCard.appendChild(wrap2);
        const leg2=document.createElement('div'); leg2.className='chart-legend';
        const totalI=incCats.reduce((s,k)=>s+incByCat[k],0)||1;
        const ICOLORS=['#00ff95','#00f0ff','#9b4dff','#38f8b0','#ffeb40'];
        incCats.forEach((cat,i)=>{leg2.insertAdjacentHTML('beforeend',`<span><span class="ld" style="background:${ICOLORS[i%ICOLORS.length]}"></span>${cat}: <b>${fmtI(incByCat[cat])} ₽</b> (${((incByCat[cat]/totalI)*100).toFixed(0)}%)</span>`);});
        incCard.appendChild(leg2);
        requestAnimationFrame(()=>{
          const ctx=cv2.getContext('2d');
          const W=cv2.width,H=cv2.height,cx=W/2,cy=H/2,R=Math.min(cx,cy)-10;
          let a=-Math.PI/2; ctx.clearRect(0,0,W,H);
          incCats.forEach((cat,i)=>{
            const sw=(incByCat[cat]/totalI)*2*Math.PI;
            ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a,a+sw);ctx.closePath();
            ctx.fillStyle=ICOLORS[i%ICOLORS.length];ctx.fill();
            ctx.strokeStyle='#05060a';ctx.lineWidth=2;ctx.stroke();
            a+=sw;
          });
          ctx.beginPath();ctx.arc(cx,cy,R*.48,0,2*Math.PI);ctx.fillStyle='#090b12';ctx.fill();
          ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillStyle='#00ff95';ctx.font='bold 14px Segoe UI,sans-serif';
          ctx.fillText(fmtI(totalI)+' ₽',cx,cy-7);
          ctx.fillStyle='#6c8296';ctx.font='10px Segoe UI,sans-serif';
          ctx.fillText('доходы',cx,cy+9);
        });
        c.appendChild(incCard);
      }
    }

    // 2. COMPACT HORIZONTAL MONTHLY COMPARISON (NO MORE VERTICAL LIST BLOAT!)
    if(this.statsView === 'all' || this.statsView === 'monthly') {
      const monthlyData={};
      txs.forEach(t=>{
        const d=new Date(t.date);
        const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        if(!monthlyData[key]) monthlyData[key]={inc:0,exp:0};
        if(t.type==='income') monthlyData[key].inc+=t.amount;
        else monthlyData[key].exp+=t.amount;
      });
      const allMonths = Object.keys(monthlyData).sort();
      const months = allMonths.slice(-this.statsMonthRange);

      if(months.length > 0){
        const barCard = this._card();
        barCard.innerHTML = `
          <div class="card-title">
            <span>📊 Доходы vs Расходы по месяцам</span>
            <div style="display:flex;gap:4px">
              <button class="btn sm ${this.statsMonthRange===6?'c':'v'}" id="m-rng-6" style="padding:3px 8px">6 мес</button>
              <button class="btn sm ${this.statsMonthRange===12?'c':'v'}" id="m-rng-12" style="padding:3px 8px">12 мес</button>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:6px">
            <span><b style="color:var(--green)">▮</b> Доходы &nbsp; <b style="color:var(--red)">▮</b> Расходы</span>
            <span>Нажми на столбец для деталей</span>
          </div>
        `;

        const maxVal = Math.max(...months.map(m=>Math.max(monthlyData[m].inc, monthlyData[m].exp)), 1);
        let colsHtml = `<div class="h-chart-wrap">`;
        months.forEach(m=>{
          const d = monthlyData[m];
          const ih = Math.max(4, Math.round((d.inc / maxVal) * 95));
          const eh = Math.max(4, Math.round((d.exp / maxVal) * 95));
          const net = d.inc - d.exp;
          const lbl = m.substring(5) + '.' + m.substring(2,4);
          colsHtml += `
            <div class="h-col" data-mkey="${m}">
              <div class="h-net" style="color:${net>=0?'var(--green)':'var(--red)'}">${net>=0?'+':''}${Math.round(net/1000)}к</div>
              <div class="h-bars">
                <div class="h-bar inc" style="height:${ih}px" title="Доход: ${fmtI(d.inc)} ₽"></div>
                <div class="h-bar exp" style="height:${eh}px" title="Расход: ${fmtI(d.exp)} ₽"></div>
              </div>
              <div class="h-lbl">${lbl}</div>
            </div>
          `;
        });
        colsHtml += `</div><div id="m-detail-line" style="font-size:11px;text-align:center;color:var(--cyan);margin-top:8px;min-height:16px"></div>`;

        // Optional compact spoiler for full archive table
        colsHtml += `
          <details style="margin-top:6px">
            <summary>📋 Показать таблицей (${allMonths.length} мес.)</summary>
            <div class="hist-list" style="margin-top:6px">
              ${[...allMonths].reverse().map(m=>{
                const d = monthlyData[m];
                const net = d.inc - d.exp;
                return `<div class="b-row" style="font-size:11px">
                  <span style="font-weight:700">${m}</span>
                  <span><span style="color:var(--green)">+${fmtI(d.inc)}</span> / <span style="color:var(--red)">−${fmtI(d.exp)}</span></span>
                  <span style="font-weight:700;color:${net>=0?'var(--cyan)':'var(--orange)'}">${net>=0?'+':''}${fmtI(net)} ₽</span>
                </div>`;
              }).join('')}
            </div>
          </details>
        `;

        barCard.insertAdjacentHTML('beforeend', colsHtml);
        c.appendChild(barCard);

        barCard.querySelector('#m-rng-6').onclick = () => { this.statsMonthRange = 6; this._render(); };
        barCard.querySelector('#m-rng-12').onclick = () => { this.statsMonthRange = 12; this._render(); };
        barCard.querySelectorAll('.h-col').forEach(col=>{
          col.onclick = () => {
            const mk = col.dataset.mkey;
            const d = monthlyData[mk];
            const net = d.inc - d.exp;
            barCard.querySelector('#m-detail-line').innerHTML =
              `<b>${mk}</b>: Доход <span style="color:var(--green)">+${fmtI(d.inc)} ₽</span> · Расход <span style="color:var(--red)">−${fmtI(d.exp)} ₽</span> · Итог: <b>${net>=0?'+':''}${fmtI(net)} ₽</b>`;
          };
        });
      }
    }

    // 3. TRENDS & BALANCE LINE
    if(this.statsView === 'all' || this.statsView === 'trends') {
      const sorted=[...pTxs].sort((a,b)=>new Date(a.date)-new Date(b.date));
      const pts=[]; let run=0;
      sorted.forEach(t=>{run=t.type==='income'?run+t.amount:run-t.amount;pts.push(run);});
      if(pts.length>=2){
        const lineCard=this._card();
        lineCard.innerHTML='<div class="card-title">📈 Динамика денежного потока за период</div>';
        const lw=document.createElement('div'); lw.className='canvas-wrap';
        const lc=document.createElement('canvas'); lc.width=420; lc.height=135;
        lw.appendChild(lc); lineCard.appendChild(lw);
        c.appendChild(lineCard);
        requestAnimationFrame(()=>{
          const ctx=lc.getContext('2d'),W=lc.width,H=lc.height,n=pts.length;
          const minY=Math.min(...pts),maxY=Math.max(...pts),rng=maxY-minY||1;
          const px=14,py=18;
          const toX=i=>px+(i/(n-1))*(W-px*2);
          const toY=v=>H-py-((v-minY)/rng)*(H-py*2);
          ctx.clearRect(0,0,W,H);
          const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'rgba(0,240,255,.2)');gr.addColorStop(1,'rgba(0,240,255,0)');
          ctx.beginPath();ctx.moveTo(toX(0),toY(pts[0]));pts.forEach((v,i)=>ctx.lineTo(toX(i),toY(v)));
          ctx.lineTo(toX(n-1),H);ctx.lineTo(toX(0),H);ctx.closePath();ctx.fillStyle=gr;ctx.fill();
          ctx.beginPath();ctx.strokeStyle='#00f0ff';ctx.lineWidth=2.2;ctx.lineJoin='round';
          pts.forEach((v,i)=>i===0?ctx.moveTo(toX(i),toY(v)):ctx.lineTo(toX(i),toY(v)));ctx.stroke();
          ctx.fillStyle='#a0b8c8';ctx.font='10px Segoe UI,sans-serif';
          ctx.textBaseline='top'; ctx.fillText('Макс: '+fmtI(maxY)+' ₽', 6, 3);
          ctx.textBaseline='bottom'; ctx.fillText('Мин: '+fmtI(minY)+' ₽', 6, H-3);
        });
      }
    }
  }

  /* ═══════ GOALS ═══════ */
  async _goals(c){
    const txs=await this.db.all(S.TX);
    const goals=await this.db.all(S.GOALS);
    const now=new Date();
    const balance=await this.db.cfg('balance');

    if(!document.getElementById('goal-styles2')){
      const gs=document.createElement('style');gs.id='goal-styles2';
      gs.textContent=`
        .g-pace{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;margin-bottom:14px;font-size:12px;font-weight:700}
        .g-pace.ok {background:rgba(0,255,149,.08);border:1px solid rgba(0,255,149,.25);color:var(--green)}
        .g-pace.warn{background:rgba(255,160,64,.08);border:1px solid rgba(255,160,64,.25);color:var(--orange)}
        .g-pace.bad {background:rgba(255,77,94,.08);border:1px solid rgba(255,77,94,.25);color:var(--red)}
        .g-pace-ico{font-size:18px;flex-shrink:0}
        .g-pace-txt{font-size:11px;font-weight:400;line-height:1.5}
        .g-scenarios{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:12px;margin-bottom:12px}
        .g-scen-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11px}
        .g-scen-row:last-child{border-bottom:none}
        .g-scen-label{color:#7a9aaa}
        .g-scen-val{font-weight:700}
        .g-calc-wrap{background:rgba(0,0,0,.3);border:1px solid rgba(0,240,255,.12);border-radius:12px;padding:12px;margin-top:12px}
        .g-calc-title{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(0,240,255,.6);margin-bottom:10px}
        .g-calc-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
        .g-calc-row input{flex:1;padding:8px 10px;font-size:13px}
        .g-calc-out{font-size:11px;color:#a0b8c8;line-height:1.65;min-height:20px}
        .g-timeline{position:relative;height:7px;background:rgba(255,255,255,.07);border-radius:6px;margin:10px 0 4px;overflow:visible}
        .g-tl-fill{height:100%;border-radius:6px;transition:width .5s}
        .g-tl-labels{display:flex;justify-content:space-between;font-size:9px;color:#5a7080;margin-top:2px}
      `;
      document.head.appendChild(gs);
    }

    for(const goal of goals){
      const goalTxs=txs.filter(t=>t.type==='expense'&&((t.category==='Цель'&&t.comment===goal.name)||(t.category==='Цель/Долг'&&t.comment===goal.name)));
      const saved=goalTxs.reduce((s,t)=>s+t.amount,0);
      const left=Math.max(0,goal.targetAmount-saved);
      const pct=Math.min(100,(saved/goal.targetAmount)*100);
      const dl=new Date(goal.deadline);
      const dLeft=Math.ceil((dl-now)/86400000);
      const mLeft=Math.max(0.5,dLeft/30);
      const col=goal.color||'#00f0ff';

      const monthlyHist=[];
      for(let i=5;i>=0;i--){
        const ms=new Date(now.getFullYear(),now.getMonth()-i,1);
        const me=new Date(now.getFullYear(),now.getMonth()-i+1,1);
        const sum=goalTxs.filter(t=>{const d=new Date(t.date);return d>=ms&&d<me;}).reduce((s,t)=>s+t.amount,0);
        const lbl=ms.toLocaleString('ru-RU',{month:'short'});
        monthlyHist.push({lbl,sum});
      }
      const recentMonths=monthlyHist.slice(-3);
      const avgMonthly=recentMonths.length?recentMonths.reduce((s,m)=>s+m.sum,0)/recentMonths.length:0;

      const reqMonthly=mLeft>0?left/mLeft:left;
      const userAlloc=goal.monthlyAllocation||0;
      const effectiveRate=Math.max(userAlloc,avgMonthly,1);
      const etaMonths=effectiveRate>0?left/effectiveRate:999;
      const etaDate=new Date(now.getFullYear(),now.getMonth()+Math.ceil(etaMonths),now.getDate());
      const onTrack=effectiveRate>=reqMonthly*0.9;
      const paceGap=reqMonthly-effectiveRate;

      let paceClass='ok', paceIco='✅', paceTxt='';
      if(dLeft<0){
        paceClass='bad'; paceIco='⏰'; paceTxt=`Дедлайн прошёл ${Math.abs(dLeft)} дн. назад. Осталось ${fmt(left)} ₽.`;
      } else if(!onTrack && paceGap>500){
        paceClass=paceGap>reqMonthly*0.5?'bad':'warn';
        paceIco=paceClass==='bad'?'🔴':'⚠️';
        paceTxt=`Отставание от графика ~${fmt(paceGap)} ₽/мес. При текущем темпе закроешь ~${dStr(etaDate)}.`;
      } else {
        paceTxt=`Отличный темп! При откладывании ${fmtI(effectiveRate)} ₽/мес закроешь ${etaMonths<=mLeft?'к дедлайну 🎉':'~'+dStr(etaDate)}.`;
      }

      const gc=this._card();
      gc.innerHTML=`
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
          <div>
            <div style="font-size:15px;font-weight:800;color:${col}">${goal.name}</div>
            <div style="font-size:10px;color:var(--muted);margin-top:2px">
              ${'★'.repeat(goal.priority||1)}${'☆'.repeat(3-(goal.priority||1))} · дедлайн: ${dStr(goal.deadline)}
              ${dLeft>0?` · осталось <b style="color:${dLeft<30?'var(--red)':'var(--orange)'}">${dLeft} дн.</b>`:''}
            </div>
          </div>
          <button class="del-btn" data-gid="${goal.id}">×</button>
        </div>

        <div class="g-pace ${paceClass}">
          <span class="g-pace-ico">${paceIco}</span>
          <span class="g-pace-txt">${paceTxt}</span>
        </div>

        <div class="g3" style="margin-bottom:12px">
          <div class="stat"><div class="v" style="color:${col}">${fmtI(saved)} ₽</div><div class="l">Накоплено</div></div>
          <div class="stat"><div class="v" style="color:var(--orange)">${fmtI(left)} ₽</div><div class="l">Осталось</div></div>
          <div class="stat"><div class="v" style="color:${onTrack?'var(--green)':'var(--red)'}">${fmtI(reqMonthly)} ₽</div><div class="l">Нужно/мес</div></div>
        </div>

        <div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px">
            <span>Прогресс к цели</span><span style="color:${col};font-weight:700">${pct.toFixed(1)}%</span>
          </div>
          <div class="g-timeline">
            <div class="g-tl-fill" style="width:${pct}%;background:linear-gradient(90deg,${col},${col}88)"></div>
          </div>
          <div class="g-tl-labels"><span>0</span><span>${fmtI(goal.targetAmount/2)} ₽</span><span>${fmtI(goal.targetAmount)} ₽</span></div>
        </div>

        <div class="g-calc-wrap">
          <div class="g-calc-title">🔢 Калькулятор — когда закрою?</div>
          <div class="g-calc-row">
            <span style="font-size:11px;color:var(--muted);white-space:nowrap">₽/мес</span>
            <input type="number" id="gcalc-${goal.id}" placeholder="${Math.round(reqMonthly)}" value="${userAlloc||''}">
          </div>
          <div class="g-calc-out" id="gcalc-out-${goal.id}">
            ${userAlloc>0?`При ${fmtI(userAlloc)} ₽/мес → закроешь ${dStr(new Date(now.getFullYear(),now.getMonth()+Math.ceil(left/userAlloc),now.getDate()))}`:'Введи сумму, чтобы увидеть дату закрытия'}
          </div>
        </div>

        <div style="margin-top:12px">
          <div style="display:flex;gap:8px">
            <input type="text" inputmode="decimal" id="gp-${goal.id}" placeholder="Сумма пополнения ₽" style="flex:1">
            <button class="btn g" id="ga-${goal.id}">+ Внести</button>
          </div>
        </div>

        <details style="margin-top:10px">
          <summary>✏ Редактировать или посмотреть историю (${goalTxs.length})</summary>
          <div style="margin-top:10px" class="g2">
            <div class="ig"><label class="lbl">Название</label><input id="ge-n-${goal.id}" value="${goal.name}"></div>
            <div class="ig"><label class="lbl">Сумма цели (₽)</label><input type="number" id="ge-t-${goal.id}" value="${goal.targetAmount}"></div>
            <div class="ig"><label class="lbl">Дедлайн</label><input type="date" id="ge-d-${goal.id}" value="${goal.deadline}"></div>
            <div class="ig"><label class="lbl">План ₽/мес</label><input type="number" id="ge-a-${goal.id}" value="${goal.monthlyAllocation||0}"></div>
          </div>
          <button class="btn c full sm" id="ge-s-${goal.id}">Сохранить изменения</button>
        </details>
      `;
      c.appendChild(gc);

      gc.querySelector(`#gcalc-${goal.id}`).oninput=e=>{
        const rate=parseFloat(e.target.value)||0;
        const out=gc.querySelector(`#gcalc-out-${goal.id}`);
        if(!rate||rate<=0){out.textContent='Введи сумму чтобы увидеть прогноз';return;}
        const m=left/rate;
        const cd=new Date(now.getFullYear(),now.getMonth()+Math.ceil(m),now.getDate());
        const ok=cd<=dl;
        out.innerHTML=`При <b>${fmtI(rate)} ₽/мес</b> → <b style="color:${ok?'var(--green)':'var(--orange)'}">${dStr(cd)}</b> ${ok?'✓ Успеваешь!':'⚠ Позже дедлайна'}`;
      };

      gc.querySelector(`[data-gid="${goal.id}"]`).onclick=()=>confirmDel(gc.querySelector(`[data-gid="${goal.id}"]`),async()=>{await this.db.del(S.GOALS,goal.id);this._render();});

      gc.querySelector(`#ge-s-${goal.id}`).onclick=async()=>{
        const updated={...goal,
          name:gc.querySelector(`#ge-n-${goal.id}`).value.trim()||goal.name,
          targetAmount:parseFloat(gc.querySelector(`#ge-t-${goal.id}`).value)||goal.targetAmount,
          deadline:gc.querySelector(`#ge-d-${goal.id}`).value||goal.deadline,
          monthlyAllocation:parseFloat(gc.querySelector(`#ge-a-${goal.id}`).value)||0,
        };
        await this.db.set(S.GOALS,updated);this._render();
      };

      gc.querySelector(`#ga-${goal.id}`).onclick=async()=>{
        const amt=parseMoney(gc.querySelector(`#gp-${goal.id}`).value);
        if(!amt||amt<=0) return;
        await this.db.add(S.TX,{amount:amt,type:'expense',category:'Цель',comment:goal.name,date:new Date().toISOString()});
        const bal=await this.db.cfg('balance');
        await this.db.setCfg('balance',bal-amt);
        this._render();
      };
    }

    const nc=this._card();
    let newColor=GOAL_COLORS[0];
    nc.innerHTML=`<div class="card-title">Добавить новую цель</div>
      <div class="ig" id="ng-wrap-n"><label class="lbl">Название</label><input id="ng-n" placeholder="Квартира, 3D-принтер, Отпуск…"></div>
      <div class="g2">
        <div class="ig"><label class="lbl">Сумма (₽)</label><input type="number" id="ng-t" placeholder="100000"></div>
        <div class="ig"><label class="lbl">Дедлайн</label><input type="date" id="ng-d" value="2026-12-31"></div>
        <div class="ig"><label class="lbl">План ₽/мес</label><input type="number" id="ng-a" placeholder="10000"></div>
        <div class="ig"><label class="lbl">Приоритет</label><select id="ng-p"><option value="1">1 — Высокий</option><option value="2" selected>2 — Средний</option><option value="3">3 — Низкий</option></select></div>
      </div>
      <div class="ig"><label class="lbl">Цвет</label><div id="ng-cols" style="display:flex;gap:7px;flex-wrap:wrap;margin-top:5px">${GOAL_COLORS.map((cl,i)=>`<div class="color-dot${i===0?' selected':''}" data-col="${cl}" style="background:${cl}"></div>`).join('')}</div></div>
      <button class="btn v full" id="ng-add">Создать цель</button>`;
    c.appendChild(nc);
    nc.querySelectorAll('#ng-cols .color-dot').forEach(el=>{el.onclick=()=>{nc.querySelectorAll('#ng-cols .color-dot').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');newColor=el.dataset.col;};});
    nc.querySelector('#ng-add').onclick=async()=>{
      const name=nc.querySelector('#ng-n').value.trim();
      const target=parseMoney(nc.querySelector('#ng-t').value);
      if(!name||!target){
        showInlineMsg(nc.querySelector('#ng-wrap-n'), 'Введите название и сумму', 'var(--red)');
        return;
      }
      await this.db.add(S.GOALS,{name,targetAmount:target,deadline:nc.querySelector('#ng-d').value,priority:parseInt(nc.querySelector('#ng-p').value)||2,monthlyAllocation:parseMoney(nc.querySelector('#ng-a').value)||0,color:newColor,active:true});
      this._render();
    };
  }

  /* ═══════ GARAGE ═══════ */
  async _garage(c){
    if(this.activeCarId === null) await this._renderCarsList(c);
    else await this._renderCarDetail(c);
  }

  async _renderCarsList(c) {
    const cars = await this.db.all(S.CARS);
    const hd = this._card();
    hd.innerHTML = `<div class="card-title">
        <span>Ваши автомобили</span>
        <button class="hdr-btn" id="add-car-btn">+ Добавить авто</button>
    </div>`;

    if(cars.length === 0) {
      hd.insertAdjacentHTML('beforeend', `<div style="color:var(--muted);text-align:center;padding:15px;font-size:12px;">У вас пока нет добавленных автомобилей.</div>`);
    } else {
      cars.forEach(car => {
        const el = document.createElement('div');
        el.className = 'car-card';
        el.innerHTML = `
          <div>
            <div class="car-card-name">🚗 ${car.name}</div>
            <div class="car-card-odo">Пробег: ${fmtI(car.odo)} км</div>
          </div>
          <div style="color:var(--cyan);font-size:20px;">›</div>
        `;
        el.onclick = () => { this.activeCarId = car.id; this._render(); };
        hd.appendChild(el);
      });
    }

    const addForm = document.createElement('div');
    addForm.style.cssText = 'display:none;margin-top:15px;padding-top:15px;border-top:1px solid rgba(0,240,255,0.1)';
    addForm.innerHTML = `
      <div class="ig"><label class="lbl">Название (Марка, Модель)</label><input type="text" id="new-car-name" placeholder="Например, Peugeot 206"></div>
      <div class="ig"><label class="lbl">Текущий пробег (км)</label><input type="number" id="new-car-odo" placeholder="185000"></div>
      <button class="btn c full" id="save-new-car">Сохранить</button>
    `;
    hd.appendChild(addForm);
    c.appendChild(hd);

    hd.querySelector('#add-car-btn').onclick = () => {
      addForm.style.display = addForm.style.display === 'none' ? 'block' : 'none';
    };

    hd.querySelector('#save-new-car').onclick = async () => {
      const name = hd.querySelector('#new-car-name').value.trim();
      const odo = parseFloat(hd.querySelector('#new-car-odo').value) || 0;
      if(!name) { showInlineMsg(hd, 'Введите название автомобиля', 'var(--red)'); return; }
      const carId = await this.db.add(S.CARS, { name, odo });
      for (const it of GENERIC_SVC_ITEMS) {
        await this.db.add(S.SVC, {...it, lastServiceOdo: odo, conditionStatus:'ok', enabled:true, car_id: carId});
      }
      this._render();
    };
  }

  async _renderCarDetail(c) {
    const car = await this.db.get(S.CARS, this.activeCarId);
    if(!car) { this.activeCarId = null; this._render(); return; }

    const odo = car.odo;
    const hist = (await this.db.all(S.ODO)).filter(o => o.car_id === car.id);
    const items = (await this.db.all(S.SVC)).filter(it => it.car_id === car.id && it.enabled !== false).sort((a,b)=>a.id-b.id);
    const partsNotes = car.partsNotes || '';

    let avgDay = 25;
    if(hist.length >= 2){
      const s = [...hist].sort((a,b)=>new Date(a.date)-new Date(b.date));
      const span = (new Date(s[s.length-1].date)-new Date(s[0].date))/86400000;
      const delta = s[s.length-1].odometer - s[0].odometer;
      if(span>0 && delta>0) avgDay = delta/span;
    }

    const oc = this._card();
    oc.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <button class="hdr-btn" id="back-btn" style="border-color:rgba(255,255,255,0.2);color:var(--muted)">‹ Все авто</button>
        <button class="hdr-btn" id="del-car-btn" style="border-color:rgba(255,77,94,.3);color:var(--red);">Удалить авто</button>
      </div>
      <div class="card-title">${car.name}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div class="big">${fmtI(odo)} <span style="font-size:16px;color:rgba(0,240,255,.4)">км</span></div>
        <button class="btn c sm" id="odo-btn">Обновить пробег</button>
      </div>
      <div class="sub">~${Math.round(avgDay*7)} км/нед · ~${Math.round(avgDay)} км/день</div>
      <div id="odo-ed"></div>`;
    c.appendChild(oc);

    oc.querySelector('#back-btn').onclick = () => { this.activeCarId = null; this._render(); };
    oc.querySelector('#del-car-btn').onclick = () => {
      customConfirm('Удалить автомобиль?', `Вы уверены, что хотите удалить <b>${car.name}</b>?`, async () => {
        await this.db.del(S.CARS, car.id);
        const sv = await this.db.all(S.SVC); for(const i of sv){if(i.car_id===car.id) await this.db.del(S.SVC, i.id);}
        const od = await this.db.all(S.ODO); for(const i of od){if(i.car_id===car.id) await this.db.del(S.ODO, i.id);}
        const lg = await this.db.all(S.GARAGE); for(const i of lg){if(i.car_id===car.id) await this.db.del(S.GARAGE, i.id);}
        this.activeCarId = null;
        this._render();
      });
    };

    oc.querySelector('#odo-btn').onclick=()=>{
      const ed=oc.querySelector('#odo-ed');
      if(ed.innerHTML){ed.innerHTML='';return;}
      ed.innerHTML=`<div class="g2" style="margin-top:12px"><div class="ig"><label class="lbl">Новый пробег (км)</label><input type="number" id="oi" value="${odo}"></div><div class="ig"><label class="lbl">Дата</label><input type="date" id="od" value="${today()}"></div></div><button class="btn c full" id="os">Сохранить пробег</button>`;
      ed.querySelector('#os').onclick=async()=>{
        const v=parseFloat(ed.querySelector('#oi').value);
        const dt=ed.querySelector('#od').value||today();
        if(isNaN(v)||v<0) return;
        await this.db.set(S.CARS, { ...car, odo: v });
        await this.db.add(S.ODO, { car_id: car.id, odometer: v, date: new Date(dt+'T12:00:00').toISOString() });
        this._render();
      };
    };

    const wc = this._card();
    wc.innerHTML = '<div class="card-title">Регламент и износ узлов</div>';
    items.forEach(it => {
      const div = document.createElement('div'); div.className = 'wear-row';
      const critClass = (it.crit || it.criticality) === 'critical' ? 'crit' : (it.crit || it.criticality) === 'warning' ? 'warn' : 'info';
      const critLbl = { critical:'КРИТ', warning:'ВНМ', info:'ОК' }[it.crit || it.criticality] || 'ОК';
      const condOnly = isCondOnly(it);
      if (condOnly) {
        const cs = it.conditionStatus || 'ok';
        const pctMap = { ok:0, watch:35, replace:70, critical:100 };
        div.innerHTML = `
          <div class="wear-lbl">
            <span><span class="pill ${critClass}">${critLbl}</span>${it.label}</span>
            <select class="cond-sel" style="background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);border-radius:7px;color:${cCol(cs)};font-size:10px;padding:3px 7px;width:auto">
              <option value="ok" ${cs === 'ok' ? 'selected' : ''}>Норма</option>
              <option value="watch" ${cs === 'watch' ? 'selected' : ''}>Наблюдение</option>
              <option value="replace" ${cs === 'replace' ? 'selected' : ''}>Заменить</option>
              <option value="critical" ${cs === 'critical' ? 'selected' : ''}>Критично!</option>
            </select>
          </div>
          <div class="wear-bar"><div class="wear-fill" style="width:${pctMap[cs] || 0}%;background:${cCol(cs)}"></div></div>
        `;
        div.querySelector('.cond-sel').onchange = async e => {
          await this.db.set(S.SVC, { ...it, conditionStatus: e.target.value });
          e.target.style.color = cCol(e.target.value);
        };
      } else {
        const done = Math.max(0, odo - (it.lastServiceOdo || 0));
        const pct = it.km > 0 ? Math.min(100, (done / it.km) * 100) : 0;
        const rem = Math.max(0, it.km - done);
        const col = wCol(pct);
        const eta = avgDay > 0 && rem > 0 ? dStr(new Date(Date.now() + (rem / avgDay) * 86400000)) : '—';
        div.innerHTML = `
          <div class="wear-lbl"><span><span class="pill ${critClass}">${critLbl}</span>${it.label}</span><span style="color:${col};font-weight:700">${pct.toFixed(0)}%</span></div>
          <div class="wear-bar"><div class="wear-fill" style="width:${pct}%;background:${col}"></div></div>
          <div style="font-size:10px;color:var(--muted);margin-top:3px">интервал ${fmtI(it.km)} км · ост. ${fmtI(rem)} км (~${eta})${it.lastServiceOdo ? ' · менялось на ' + fmtI(it.lastServiceOdo) + ' км' : ''}</div>
        `;
      }
      wc.appendChild(div);
    });
    c.appendChild(wc);

    // Record Maintenance
    const sc = this._card();
    const itemOpts = items.filter(it => !isCondOnly(it)).map(it => `<option value="${it.id}">${it.label}</option>`).join('');
    sc.innerHTML = `
      <div class="card-title">Записать ТО / Замену детали</div>
      <div class="ig"><label class="lbl">Узел / Работа</label><select id="svc-it">${itemOpts}<option value="other">Другое…</option></select></div>
      <div class="g2">
        <div class="ig"><label class="lbl">Пробег (км)</label><input type="number" id="svc-o" value="${odo}"></div>
        <div class="ig"><label class="lbl">Стоимость (₽)</label><input type="text" inputmode="decimal" id="svc-c" placeholder="0"></div>
      </div>
      <div class="g2">
        <div class="ig"><label class="lbl">Дата</label><input type="date" id="svc-d" value="${today()}"></div>
        <div class="ig"><label class="lbl">Комментарий / Бренд</label><input type="text" id="svc-n" placeholder="Артикул или бренд"></div>
      </div>
      <button class="btn c full" id="svc-add">Записать в сервисную книжку</button>
    `;
    c.appendChild(sc);

    sc.querySelector('#svc-add').onclick = async () => {
      const itemId = sc.querySelector('#svc-it').value;
      const svcOdo = parseFloat(sc.querySelector('#svc-o').value);
      const cost = parseMoney(sc.querySelector('#svc-c').value);
      const comment = sc.querySelector('#svc-n').value.trim();
      const dt = sc.querySelector('#svc-d').value || today();
      if (isNaN(svcOdo)) return;

      const selItem = itemId !== 'other' ? items.find(it => it.id === parseInt(itemId)) : null;
      const label = selItem ? selItem.label : 'Другое ТО';

      await this.db.add(S.GARAGE, { car_id: car.id, type: selItem?.key || 'other', label, odometer: svcOdo, cost, comment, date: new Date(dt + 'T12:00:00').toISOString() });
      if (selItem) await this.db.set(S.SVC, { ...selItem, lastServiceOdo: svcOdo, conditionStatus: 'ok' });
      if (svcOdo > car.odo) await this.db.set(S.CARS, { ...car, odo: svcOdo });

      if (cost > 0) {
        const bal = await this.db.cfg('balance');
        await this.db.setCfg('balance', bal - cost);
        await this.db.add(S.TX, { amount: cost, type: 'expense', category: 'Авто', comment: `${car.name}: ${label}` + (comment ? ' · ' + comment : ''), date: new Date(dt + 'T12:00:00').toISOString() });
      }
      this._render();
    };

    const logs = (await this.db.all(S.GARAGE)).filter(lg => lg.car_id === car.id).sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 15);
    const jc = this._card();
    jc.innerHTML = '<div class="card-title">История обслуживания</div>';
    if (!logs.length) {
      jc.insertAdjacentHTML('beforeend', '<div style="color:var(--muted);text-align:center;padding:16px">Записей пока нет</div>');
    } else {
      logs.forEach(log => {
        const row = document.createElement('div'); row.className = 'log-row';
        const del = document.createElement('button'); del.className = 'del-btn'; del.textContent='×';
        row.innerHTML = `
          <div style="min-width:0;flex:1"><span class="badge">${log.label}</span><div class="log-meta">${dStr(log.date)} · ${fmtI(log.odometer)} км${log.comment ? ' · ' + log.comment : ''}</div></div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">${log.cost ? `<span style="color:var(--orange);font-size:12px;font-weight:700">−${fmt(log.cost)} ₽</span>` : ''}</div>
        `;
        row.querySelector('div:last-child').appendChild(del);
        del.onclick = () => confirmDel(del, async () => {
          await this.db.del(S.GARAGE, log.id);
          if (log.cost > 0) {
            const bal = await this.db.cfg('balance');
            await this.db.setCfg('balance', bal + log.cost);
          }
          this._render();
        });
        jc.appendChild(row);
      });
    }
    c.appendChild(jc);

    const ac = this._card();
    ac.innerHTML = `
      <div class="card-title">Артикулы запчастей и заметки</div>
      <textarea id="parts-n" placeholder="Масляный фильтр: ...&#10;Свечи: ...&#10;Прокладка: ...">${partsNotes}</textarea>
      <button class="btn c full" id="parts-s">Сохранить заметки</button>
    `;
    c.appendChild(ac);
    ac.querySelector('#parts-s').onclick = async () => {
      await this.db.set(S.CARS, { ...car, partsNotes: ac.querySelector('#parts-n').value });
      showInlineMsg(ac, '✓ Заметки сохранены', 'var(--green)');
    };
  }

  /* ═══════ HUB ═══════ */
  async _hub(c){
    const txs=await this.db.all(S.TX);
    const goals=(await this.db.all(S.GOALS)).filter(g=>g.active);
    const balance=await this.db.cfg('balance');
    const budgetCap=await this.db.cfg('monthlyBudgetCap');
    const now=new Date();
    const mStart=new Date(now.getFullYear(),now.getMonth(),1);

    const isGoal=t=>t.type==='expense'&&(t.category==='Цель'||(t.category==='Цель/Долг'&&goals.some(g=>g.name===t.comment)));
    const spentMonth=txs.filter(t=>t.type==='expense'&&new Date(t.date)>=mStart&&!isGoal(t)).reduce((s,t)=>s+t.amount,0);
    const payday=calcNextPayday(txs);

    const lastExp=txs.filter(t=>t.type==='expense').sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
    const daysSince=lastExp?Math.floor((now-new Date(lastExp.date))/86400000):999;

    const remCard=this._card();
    remCard.innerHTML='<div class="card-title">Центр мониторинга</div>';
    let any=false;
    if(daysSince>=2){
      any=true;
      remCard.insertAdjacentHTML('beforeend',`<div class="reminder">📝 Последний расход записан ${daysSince} дн. назад. Нажми <b>«⚖️ Сверка»</b> сверху, чтобы за 5 секунд синхронизировать баланс со Сбером!</div>`);
    }
    goals.forEach(goal=>{
      const saved=txs.filter(t=>t.type==='expense'&&t.category==='Цель'&&t.comment===goal.name).reduce((s,t)=>s+t.amount,0);
      const dl=new Date(goal.deadline);
      const dL=Math.ceil((dl-now)/86400000);
      if(dL>0&&dL<14&&saved<goal.targetAmount){any=true;remCard.insertAdjacentHTML('beforeend',`<div class="reminder red">🎯 "${goal.name}" — ${dL} дн. до дедлайна! Накоплено ${fmtI(saved)} из ${fmtI(goal.targetAmount)} ₽</div>`);}
    });
    if(!any) remCard.insertAdjacentHTML('beforeend','<div style="color:var(--green);font-size:12px;padding:6px 0">✅ Все показатели в норме!</div>');
    c.appendChild(remCard);

    const sc=this._card();
    sc.innerHTML=`<div class="card-title">Календарь ближайших выплат</div>
      ${(payday.allUpcoming||[]).map(p=>`
        <div class="b-row">
          <span class="b-key">${p.label}</span>
          <span class="b-val" style="color:var(--cyan)">${dStr(p.date)} <span style="font-size:10px;color:var(--muted)">(${Math.max(0,Math.ceil((p.date-now)/86400000))} дн.)</span></span>
        </div>
      `).join('')}
    `;
    c.appendChild(sc);

    const prCard=this._card();
    const sb=now.getDate()+now.getMonth()*31;
    prCard.innerHTML=`<div class="card-title">🖨 База знаний 3D-печати</div>
      <div class="tip">${PRINT_TIPS[sb%PRINT_TIPS.length]}</div>
      <div class="tip">${PRINT_TIPS[(sb+3)%PRINT_TIPS.length]}</div>`;
    c.appendChild(prCard);

    const recCard=this._card();
    recCard.innerHTML=`<div class="card-title">🍳 Домашние рецепты</div>
      <div class="search-row">
        <select id="rec-cat"><option value="">Все</option><option value="Завтрак">Завтрак</option><option value="Обед">Обед</option><option value="Ужин">Ужин</option></select>
        <input type="text" id="rec-q" placeholder="Поиск рецепта...">
      </div>
      <div id="rec-list"></div>`;
    c.appendChild(recCard);

    const renderRec=()=>{
      const cat=recCard.querySelector('#rec-cat').value;
      const q=recCard.querySelector('#rec-q').value.toLowerCase();
      let fil=RECIPES;
      if(cat) fil=fil.filter(r=>r.cat===cat);
      if(q) fil=fil.filter(r=>r.name.toLowerCase().includes(q));
      const list=recCard.querySelector('#rec-list'); list.innerHTML='';
      fil.forEach((rec,idx)=>{
        const rd=document.createElement('div'); rd.className='recipe';
        rd.innerHTML=`<div class="recipe-hd">
            <div><div class="recipe-name">${rec.name} <span class="badge" style="margin-left:4px">${rec.cat}</span></div><div class="recipe-meta">⏱ ${rec.time} · 🔥 ${rec.cal}</div></div>
            <span style="color:var(--violet);font-size:20px;line-height:1">›</span>
          </div>
          <div class="recipe-body" id="rb-${idx}">
            <div class="rsec">Ингредиенты</div><ul>${rec.ingr.map(i=>`<li>${i}</li>`).join('')}</ul>
            <div class="rsec">Приготовление</div>
            <ol>${rec.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
          </div>`;
        const body=rd.querySelector(`#rb-${idx}`);
        rd.onclick=()=>body.classList.toggle('open');
        list.appendChild(rd);
      });
    };
    renderRec();
    recCard.querySelector('#rec-cat').onchange=renderRec;
    recCard.querySelector('#rec-q').oninput=renderRec;
  }

  /* ═══════ EXPORT / IMPORT (100% BACKWARD COMPATIBLE WITH v5) ═══════ */
  async _export(){
    const data={
      version:6,
      exportedAt:new Date().toISOString(),
      transactions:await this.db.all(S.TX),
      garage_logs:await this.db.all(S.GARAGE),
      odo_history:await this.db.all(S.ODO),
      service_items:await this.db.all(S.SVC),
      goals:await this.db.all(S.GOALS),
      settings:await this.db.all(S.CFG),
      cars:await this.db.all(S.CARS),
      filaments:await this.db.all(S.FIL),
      quick_templates:await this.db.all(S.TPL)
    };
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`sentinel-backup-${today()}.json`;
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  }

  async _import(file){
    if(!file) return;
    const text=await file.text();
    let data;
    try { data=JSON.parse(text); }
    catch {
      alert('Ошибка чтения JSON файла');
      return;
    }

    customConfirm('Восстановить резервную копию?', `Загрузить копию от ${data.exportedAt ? dStr(data.exportedAt) : '?'}? Все данные будут обновлены.`, async () => {
      const map={
        transactions:S.TX, garage_logs:S.GARAGE, odo_history:S.ODO,
        service_items:S.SVC, goals:S.GOALS, settings:S.CFG,
        cars:S.CARS, filaments:S.FIL, quick_templates:S.TPL
      };
      for(const [key,sn] of Object.entries(map)){
        if(!data[key]) continue;
        const ex=await this.db.all(sn);
        for(const r of ex) await this.db.del(sn,r.id||r.key);
        for(const r of data[key]) await this.db.set(sn,r);
      }
      this._render();
    });
  }
}

new App();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
