  /* ═══════ STATS (IGNORES INTERNAL TRANSFERS SO ANALYTICS ARE 100% ACCURATE) ═══════ */
  async _stats(c){
    const rawTxs = await this.db.all(S.TX);
    const txs = rawTxs.filter(t => t.type === 'expense' || t.type === 'income');
    const now=new Date();
    if(!this.statsStart){
      const s=new Date(now.getFullYear(),now.getMonth(),1);
      this.statsStart=`${s.getFullYear()}-${String(s.getMonth()+1).padStart(2,'0')}-01`;
      this.statsEnd=today();
    }

    const pCard=this._card();
    pCard.innerHTML=`
      <div class="card-title">
        <span>Аналитика и диаграммы</span>
        <span style="font-size:9.5px;color:var(--muted);text-transform:none">${this.statsStart} — ${this.statsEnd}</span>
      </div>
      <div class="btn-row" style="margin-top:0;margin-bottom:10px">
        <button class="btn v sm" id="qt" style="flex:1">Сегодня</button>
        <button class="btn v sm" id="qm" style="flex:1">Месяц</button>
        <button class="btn v sm" id="qy" style="flex:1">Год</button>
        <button class="btn v sm" id="qa" style="flex:1">Всё время</button>
      </div>
      <details>
        <summary>📅 Выбрать точные даты периода</summary>
        <div class="g2" style="margin-top:8px">
          <div class="ig"><label class="lbl">От</label><input type="date" id="as" value="${this.statsStart}"></div>
          <div class="ig"><label class="lbl">До</label><input type="date" id="ae" value="${this.statsEnd}"></div>
        </div>
        <button class="btn c full sm" id="ap">Применить даты</button>
      </details>
    `;
    c.appendChild(pCard);

    const segBar = document.createElement('div');
    segBar.className = 'seg-bar';
    segBar.innerHTML = `
      <div class="seg-btn ${this.statsView==='all'?'active':''}" data-sv="all">Все блоки</div>
      <div class="seg-btn ${this.statsView==='charts'?'active':''}" data-sv="charts">🍩 Диаграммы</div>
      <div class="seg-btn ${this.statsView==='monthly'?'active':''}" data-sv="monthly">📊 По месяцам</div>
      <div class="seg-btn ${this.statsView==='trends'?'active':''}" data-sv="trends">📈 Динамика</div>
    `;
    c.appendChild(segBar);
    segBar.querySelectorAll('.seg-btn').forEach(b=>{
      b.onclick = () => { this.statsView = b.dataset.sv; this._render(true); };
    });

    const upd=(s,e)=>{this.statsStart=s;this.statsEnd=e;this._render(true);};
    pCard.querySelector('#ap').onclick=()=>{const s=pCard.querySelector('#as').value,e=pCard.querySelector('#ae').value;if(s&&e&&s<=e)upd(s,e);};
    pCard.querySelector('#qt').onclick=()=>{const t=today();upd(t,t);};
    pCard.querySelector('#qm').onclick=()=>upd(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`, today());
    pCard.querySelector('#qy').onclick=()=>upd(`${now.getFullYear()}-01-01`,`${now.getFullYear()}-12-31`);
    pCard.querySelector('#qa').onclick=()=>{
      if(!txs.length){upd(today(),today());return;}
      const sorted=[...txs].sort((a,b)=>new Date(a.date)-new Date(b.date));
      upd(sorted[0].date.split('T')[0], today());
    };

    const s0=new Date(this.statsStart+'T00:00:00'), e0=new Date(this.statsEnd+'T23:59:59');
    const pTxs=txs.filter(t=>{const d=new Date(t.date);return d>=s0&&d<=e0;});
    const totalInc=pTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const totalExp=pTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const saldo=totalInc-totalExp;
    const saveRate = totalInc > 0 ? Math.round(((totalInc - totalExp) / totalInc) * 100) : 0;

    const sumCard=this._card();
    sumCard.innerHTML=`
      <div class="g3">
        <div class="stat"><div class="v" style="color:var(--green)">+${fmtI(totalInc)}</div><div class="l">Доходы ₽</div></div>
        <div class="stat"><div class="v" style="color:var(--red)">−${fmtI(totalExp)}</div><div class="l">Расходы ₽</div></div>
        <div class="stat"><div class="v" style="color:${saldo>=0?'var(--green)':'var(--red)'}">${saldo>=0?'+':''}${fmtI(saldo)}</div><div class="l">Сальдо (${saveRate}%)</div></div>
      </div>`;
    c.appendChild(sumCard);

    if(this.statsView === 'all' || this.statsView === 'charts') {
      const expByCat={};
      pTxs.filter(t=>t.type==='expense').forEach(t=>{expByCat[t.category]=(expByCat[t.category]||0)+t.amount;});
      const cats=Object.keys(expByCat).sort((a,b)=>expByCat[b]-expByCat[a]);
      const vals=cats.map(k=>expByCat[k]);
      const totalE=vals.reduce((s,v)=>s+v,0)||1;
      const COLORS=['#00f0ff','#9b4dff','#00ff95','#ff4d5e','#ffa040','#38c8f0','#f06dff','#ffeb40','#ff9b4d'];

      const pieCard=this._card();
      pieCard.innerHTML='<div class="card-title">🍩 Расходы по категориям</div>';
      if(!cats.length){
        pieCard.insertAdjacentHTML('beforeend','<div style="color:var(--muted);text-align:center;padding:16px">Нет расходов за выбранный период</div>');
      } else {
        const wrap=document.createElement('div'); wrap.className='canvas-wrap';
        const canvas=document.createElement('canvas'); canvas.width=420; canvas.height=210;
        wrap.appendChild(canvas); pieCard.appendChild(wrap);
        const leg=document.createElement('div'); leg.className='chart-legend';
        cats.forEach((cat,i)=>{
          leg.insertAdjacentHTML('beforeend',`<span><span class="ld" style="background:${COLORS[i%COLORS.length]}"></span>${cat}: <b>${fmtI(vals[i])} ₽</b> (${((vals[i]/totalE)*100).toFixed(0)}%)</span>`);
        });
        pieCard.appendChild(leg);
        requestAnimationFrame(()=>{
          const ctx=canvas.getContext('2d');
          const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,R=Math.min(cx,cy)-10;
          let a=-Math.PI/2; ctx.clearRect(0,0,W,H);
          vals.forEach((v,i)=>{
            const sw=(v/totalE)*2*Math.PI;
            ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a,a+sw);ctx.closePath();
            ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();
            ctx.strokeStyle='#000000';ctx.lineWidth=2;ctx.stroke();
            a+=sw;
          });
          ctx.beginPath();ctx.arc(cx,cy,R*.48,0,2*Math.PI);
          ctx.fillStyle='#05070e';ctx.fill();
          ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillStyle='#00f0ff';ctx.font='bold 14px Segoe UI,sans-serif';
          ctx.fillText(fmtI(totalE)+' ₽',cx,cy-7);
          ctx.fillStyle='#7890a5';ctx.font='10px Segoe UI,sans-serif';
          ctx.fillText('расходы',cx,cy+9);
        });
      }
      c.appendChild(pieCard);

      const incByCat={};
      pTxs.filter(t=>t.type==='income').forEach(t=>{incByCat[t.category]=(incByCat[t.category]||0)+t.amount;});
      const incCats=Object.keys(incByCat).sort((a,b)=>incByCat[b]-incByCat[a]);
      if(incCats.length){
        const incCard=this._card();
        incCard.innerHTML='<div class="card-title">💰 Доходы по источникам</div>';
        const wrap2=document.createElement('div'); wrap2.className='canvas-wrap';
        const cv2=document.createElement('canvas'); cv2.width=420; cv2.height=190;
        wrap2.appendChild(cv2); incCard.appendChild(wrap2);
        const leg2=document.createElement('div'); leg2.className='chart-legend';
        const totalI=incCats.reduce((s,k)=>s+incByCat[k],0)||1;
        const ICOLORS=['#00ff95','#00f0ff','#9b4dff','#38f8b0','#ffeb40'];
        incCats.forEach((cat,i)=>{leg2.insertAdjacentHTML('beforeend',`<span><span class="ld" style="background:${ICOLORS[i%ICOLORS.length]}"></span>${cat}: <b>${fmtI(incByCat[cat])} ₽</b> (${((incByCat[cat]/totalI)*100).toFixed(0)}%)</span>`);});
        incCard.appendChild(leg2);
        requestAnimationFrame(()=>{
          const ctx=cv2.getContext('2d');
          const W=cv2.width,H=cv2.height,cx=W/2,cy=H/2,R=Math.min(cx,cy)-10;
          let a=-Math.PI/2; ctx.clearRect(0,0,W,H);
          incCats.forEach((cat,i)=>{
            const sw=(incByCat[cat]/totalI)*2*Math.PI;
            ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a,a+sw);ctx.closePath();
            ctx.fillStyle=ICOLORS[i%ICOLORS.length];ctx.fill();
            ctx.strokeStyle='#000000';ctx.lineWidth=2;ctx.stroke();
            a+=sw;
          });
          ctx.beginPath();ctx.arc(cx,cy,R*.48,0,2*Math.PI);ctx.fillStyle='#05070e';ctx.fill();
          ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillStyle='#00ff95';ctx.font='bold 14px Segoe UI,sans-serif';
          ctx.fillText(fmtI(totalI)+' ₽',cx,cy-7);
          ctx.fillStyle='#7890a5';ctx.font='10px Segoe UI,sans-serif';
          ctx.fillText('доходы',cx,cy+9);
        });
        c.appendChild(incCard);
      }
    }

    if(this.statsView === 'all' || this.statsView === 'monthly') {
      const monthlyData={};
      txs.forEach(t=>{
        const d=new Date(t.date);
        const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        if(!monthlyData[key]) monthlyData[key]={inc:0,exp:0};
        if(t.type==='income') monthlyData[key].inc+=t.amount;
        else if(t.type==='expense') monthlyData[key].exp+=t.amount;
      });
      const allMonths = Object.keys(monthlyData).sort();
      const months = allMonths.slice(-this.statsMonthRange);

      if(months.length > 0){
        const barCard = this._card();
        barCard.innerHTML = `
          <div class="card-title">
            <span>📊 Доходы vs Расходы по месяцам</span>
            <div style="display:flex;gap:4px">
              <button class="btn sm ${this.statsMonthRange===6?'c':'v'}" id="m-rng-6" style="padding:3px 8px">6 мес</button>
              <button class="btn sm ${this.statsMonthRange===12?'c':'v'}" id="m-rng-12" style="padding:3px 8px">12 мес</button>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:6px">
            <span><b style="color:var(--green)">▮</b> Доходы &nbsp; <b style="color:var(--red)">▮</b> Расходы</span>
            <span>Нажми на столбец для деталей</span>
          </div>
        `;

        const maxVal = Math.max(...months.map(m=>Math.max(monthlyData[m].inc, monthlyData[m].exp)), 1);
        let colsHtml = `<div class="h-chart-wrap">`;
        months.forEach(m=>{
          const d = monthlyData[m];
          const ih = Math.max(4, Math.round((d.inc / maxVal) * 95));
          const eh = Math.max(4, Math.round((d.exp / maxVal) * 95));
          const net = d.inc - d.exp;
          const lbl = m.substring(5) + '.' + m.substring(2,4);
          colsHtml += `
            <div class="h-col" data-mkey="${m}">
              <div class="h-net" style="color:${net>=0?'var(--green)':'var(--red)'}">${net>=0?'+':''}${Math.round(net/1000)}к</div>
              <div class="h-bars">
                <div class="h-bar inc" style="height:${ih}px"></div>
                <div class="h-bar exp" style="height:${eh}px"></div>
              </div>
              <div class="h-lbl">${lbl}</div>
            </div>
          `;
        });
        colsHtml += `</div><div id="m-detail-line" style="font-size:11px;text-align:center;color:var(--cyan);margin-top:8px;min-height:16px"></div>`;

        colsHtml += `
          <details style="margin-top:6px">
            <summary>📋 Показать таблицей (${allMonths.length} мес.)</summary>
            <div class="hist-list" style="margin-top:6px">
              ${[...allMonths].reverse().map(m=>{
                const d = monthlyData[m];
                const net = d.inc - d.exp;
                return `<div class="b-row" style="font-size:11px">
                  <span style="font-weight:700">${m}</span>
                  <span><span style="color:var(--green)">+${fmtI(d.inc)}</span> / <span style="color:var(--red)">−${fmtI(d.exp)}</span></span>
                  <span style="font-weight:700;color:${net>=0?'var(--cyan)':'var(--orange)'}">${net>=0?'+':''}${fmtI(net)} ₽</span>
                </div>`;
              }).join('')}
            </div>
          </details>
        `;

        barCard.insertAdjacentHTML('beforeend', colsHtml);
        c.appendChild(barCard);

        barCard.querySelector('#m-rng-6').onclick = () => { this.statsMonthRange = 6; this._render(true); };
        barCard.querySelector('#m-rng-12').onclick = () => { this.statsMonthRange = 12; this._render(true); };
        barCard.querySelectorAll('.h-col').forEach(col=>{
          col.onclick = () => {
            const mk = col.dataset.mkey;
            const d = monthlyData[mk];
            const net = d.inc - d.exp;
            barCard.querySelector('#m-detail-line').innerHTML =
              `<b>${mk}</b>: Доход <span style="color:var(--green)">+${fmtI(d.inc)} ₽</span> · Расход <span style="color:var(--red)">−${fmtI(d.exp)} ₽</span> · Итог: <b>${net>=0?'+':''}${fmtI(net)} ₽</b>`;
          };
        });
      }
    }

    if(this.statsView === 'all' || this.statsView === 'trends') {
      const sorted=[...pTxs].sort((a,b)=>new Date(a.date)-new Date(b.date));
      const pts=[]; let run=0;
      sorted.forEach(t=>{run=t.type==='income'?run+t.amount:run-t.amount;pts.push(run);});
      if(pts.length>=2){
        const lineCard=this._card();
        lineCard.innerHTML='<div class="card-title">📈 Динамика денежного потока за период</div>';
        const lw=document.createElement('div'); lw.className='canvas-wrap';
        const lc=document.createElement('canvas'); lc.width=420; lc.height=135;
        lw.appendChild(lc); lineCard.appendChild(lw);
        c.appendChild(lineCard);
        requestAnimationFrame(()=>{
          const ctx=lc.getContext('2d'),W=lc.width,H=lc.height,n=pts.length;
          const minY=Math.min(...pts),maxY=Math.max(...pts),rng=maxY-minY||1;
          const px=14,py=18;
          const toX=i=>px+(i/(n-1))*(W-px*2);
          const toY=v=>H-py-((v-minY)/rng)*(H-py*2);
          ctx.clearRect(0,0,W,H);
          const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'rgba(0,240,255,.2)');gr.addColorStop(1,'rgba(0,240,255,0)');
          ctx.beginPath();ctx.moveTo(toX(0),toY(pts[0]));pts.forEach((v,i)=>ctx.lineTo(toX(i),toY(v)));
          ctx.lineTo(toX(n-1),H);ctx.lineTo(toX(0),H);ctx.closePath();ctx.fillStyle=gr;ctx.fill();
          ctx.beginPath();ctx.strokeStyle='#00f0ff';ctx.lineWidth=2.2;ctx.lineJoin='round';
          pts.forEach((v,i)=>i===0?ctx.moveTo(toX(i),toY(v)):ctx.lineTo(toX(i),toY(v)));ctx.stroke();
          ctx.fillStyle='#a0b8c8';ctx.font='10px Segoe UI,sans-serif';
          ctx.textBaseline='top'; ctx.fillText('Макс: '+fmtI(maxY)+' ₽', 6, 3);
          ctx.textBaseline='bottom'; ctx.fillText('Мин: '+fmtI(minY)+' ₽', 6, H-3);
        });
      }
    }
  }

  /* ═══════ GOALS ═══════ */
  async _goals(c){
    const txs=await this.db.all(S.TX);
    const goals=await this.db.all(S.GOALS);
    const now=new Date();

    if(!document.getElementById('goal-styles2')){
      const gs=document.createElement('style');gs.id='goal-styles2';
      gs.textContent=`
        .g-pace{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;margin-bottom:14px;font-size:12px;font-weight:700}
        .g-pace.ok {background:rgba(0,255,149,.08);border:1px solid rgba(0,255,149,.25);color:var(--green)}
        .g-pace.warn{background:rgba(255,160,64,.08);border:1px solid rgba(255,160,64,.25);color:var(--orange)}
        .g-pace.bad {background:rgba(255,77,94,.08);border:1px solid rgba(255,77,94,.25);color:var(--red)}
        .g-pace-ico{font-size:18px;flex-shrink:0}
        .g-pace-txt{font-size:11px;font-weight:400;line-height:1.5}
        .g-calc-wrap{background:rgba(255,255,255,.03);border:1px solid rgba(0,240,255,.14);border-radius:12px;padding:12px;margin-top:12px}
        .g-calc-title{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--cyan);margin-bottom:10px}
        .g-calc-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
        .g-calc-row input{flex:1;padding:8px 10px;font-size:13px}
        .g-calc-out{font-size:11px;color:#a0b8c8;line-height:1.65;min-height:20px}
        .g-timeline{position:relative;height:7px;background:rgba(255,255,255,.08);border-radius:6px;margin:10px 0 4px;overflow:hidden}
        .g-tl-fill{height:100%;border-radius:6px;transition:width .5s}
        .g-tl-labels{display:flex;justify-content:space-between;font-size:9px;color:#5a7080;margin-top:2px}
      `;
      document.head.appendChild(gs);
    }

    for(const goal of goals){
      const goalTxs=txs.filter(t=>t.type==='expense'&&((t.category==='Цель'&&t.comment===goal.name)||(t.category==='Цель/Долг'&&t.comment===goal.name)));
      const saved=goalTxs.reduce((s,t)=>s+t.amount,0);
      const left=Math.max(0,goal.targetAmount-saved);
      const pct=Math.min(100,(saved/goal.targetAmount)*100);
      const dl=new Date(goal.deadline);
      const dLeft=Math.ceil((dl-now)/86400000);
      const mLeft=Math.max(0.5,dLeft/30);
      const col=goal.color||'#00f0ff';

      const reqMonthly=mLeft>0?left/mLeft:left;
      const userAlloc=goal.monthlyAllocation||0;
      const effectiveRate=Math.max(userAlloc,1);
      const etaMonths=effectiveRate>0?left/effectiveRate:999;
      const etaDate=new Date(now.getFullYear(),now.getMonth()+Math.ceil(etaMonths),now.getDate());
      const onTrack=effectiveRate>=reqMonthly*0.9;
      const paceGap=reqMonthly-effectiveRate;

      let paceClass='ok', paceIco='✅', paceTxt='';
      if(dLeft<0){
        paceClass='bad'; paceIco='⏰'; paceTxt=`Дедлайн прошёл ${Math.abs(dLeft)} дн. назад. Осталось ${fmt(left)} ₽.`;
      } else if(!onTrack && paceGap>500){
        paceClass=paceGap>reqMonthly*0.5?'bad':'warn';
        paceIco=paceClass==='bad'?'🔴':'⚠️';
        paceTxt=`Отставание от графика ~${fmt(paceGap)} ₽/мес. При текущем темпе закроешь ~${dStr(etaDate)}.`;
      } else {
        paceTxt=`Отличный темп! При откладывании ${fmtI(effectiveRate)} ₽/мес закроешь ${etaMonths<=mLeft?'к дедлайну 🎉':'~'+dStr(etaDate)}.`;
      }

      const gc=this._card();
      gc.innerHTML=`
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
          <div>
            <div style="font-size:15px;font-weight:800;color:${col}">${goal.name}</div>
            <div style="font-size:10px;color:var(--muted);margin-top:2px">
              ${'★'.repeat(goal.priority||1)}${'☆'.repeat(3-(goal.priority||1))} · дедлайн: ${dStr(goal.deadline)}
              ${dLeft>0?` · осталось <b style="color:${dLeft<30?'var(--red)':'var(--orange)'}">${dLeft} дн.</b>`:''}
            </div>
          </div>
          <button class="del-btn" data-gid="${goal.id}">×</button>
        </div>

        <div class="g-pace ${paceClass}">
          <span class="g-pace-ico">${paceIco}</span>
          <span class="g-pace-txt">${paceTxt}</span>
        </div>

        <div class="g3" style="margin-bottom:12px">
          <div class="stat"><div class="v" style="color:${col}">${fmtI(saved)} ₽</div><div class="l">Накоплено</div></div>
          <div class="stat"><div class="v" style="color:var(--orange)">${fmtI(left)} ₽</div><div class="l">Осталось</div></div>
          <div class="stat"><div class="v" style="color:${onTrack?'var(--green)':'var(--red)'}">${fmtI(reqMonthly)} ₽</div><div class="l">Нужно/мес</div></div>
        </div>

        <div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px">
            <span>Прогресс к цели</span><span style="color:${col};font-weight:700">${pct.toFixed(1)}%</span>
          </div>
          <div class="g-timeline">
            <div class="g-tl-fill" style="width:${pct}%;background:linear-gradient(90deg,${col},${col}88)"></div>
          </div>
          <div class="g-tl-labels"><span>0</span><span>${fmtI(goal.targetAmount/2)} ₽</span><span>${fmtI(goal.targetAmount)} ₽</span></div>
        </div>

        <div class="g-calc-wrap">
          <div class="g-calc-title">🔢 Калькулятор — когда закрою?</div>
          <div class="g-calc-row">
            <span style="font-size:11px;color:var(--muted);white-space:nowrap">₽/мес</span>
            <input type="text" inputmode="decimal" id="gcalc-${goal.id}" placeholder="${Math.round(reqMonthly)}" value="${userAlloc||''}">
          </div>
          <div class="g-calc-out" id="gcalc-out-${goal.id}">
            ${userAlloc>0?`При ${fmtI(userAlloc)} ₽/мес → закроешь ${dStr(new Date(now.getFullYear(),now.getMonth()+Math.ceil(left/userAlloc),now.getDate()))}`:'Введи сумму, чтобы увидеть дату закрытия'}
          </div>
        </div>

        <div style="margin-top:12px">
          <div style="display:flex;gap:8px">
            <input type="text" inputmode="decimal" id="gp-${goal.id}" placeholder="Сумма пополнения ₽" style="flex:1">
            <button class="btn g" id="ga-${goal.id}">+ Внести</button>
          </div>
        </div>

        <details style="margin-top:10px">
          <summary>✏ Редактировать цель</summary>
          <div style="margin-top:10px" class="g2">
            <div class="ig"><label class="lbl">Название</label><input id="ge-n-${goal.id}" value="${goal.name}"></div>
            <div class="ig"><label class="lbl">Сумма цели (₽)</label><input type="text" inputmode="decimal" id="ge-t-${goal.id}" value="${goal.targetAmount}"></div>
            <div class="ig"><label class="lbl">Дедлайн</label><input type="date" id="ge-d-${goal.id}" value="${goal.deadline}"></div>
            <div class="ig"><label class="lbl">План ₽/мес</label><input type="text" inputmode="decimal" id="ge-a-${goal.id}" value="${goal.monthlyAllocation||0}"></div>
          </div>
          <button class="btn c full sm" id="ge-s-${goal.id}">Сохранить изменения</button>
        </details>
      `;
      c.appendChild(gc);

      gc.querySelector(`#gcalc-${goal.id}`).oninput=e=>{
        const rate=parseMoney(e.target.value);
        const out=gc.querySelector(`#gcalc-out-${goal.id}`);
        if(!rate||rate<=0){out.textContent='Введи сумму чтобы увидеть прогноз';return;}
        const m=left/rate;
        const cd=new Date(now.getFullYear(),now.getMonth()+Math.ceil(m),now.getDate());
        const ok=cd<=dl;
        out.innerHTML=`При <b>${fmtI(rate)} ₽/мес</b> → <b style="color:${ok?'var(--green)':'var(--orange)'}">${dStr(cd)}</b> ${ok?'✓ Успеваешь!':'⚠ Позже дедлайна'}`;
      };

      gc.querySelector(`[data-gid="${goal.id}"]`).onclick=()=>confirmDel(gc.querySelector(`[data-gid="${goal.id}"]`),async()=>{await this.db.del(S.GOALS,goal.id);this._render(true);});

      gc.querySelector(`#ge-s-${goal.id}`).onclick=async()=>{
        const updated={...goal,
          name:gc.querySelector(`#ge-n-${goal.id}`).value.trim()||goal.name,
          targetAmount:parseMoney(gc.querySelector(`#ge-t-${goal.id}`).value)||goal.targetAmount,
          deadline:gc.querySelector(`#ge-d-${goal.id}`).value||goal.deadline,
          monthlyAllocation:parseMoney(gc.querySelector(`#ge-a-${goal.id}`).value)||0,
        };
        await this.db.set(S.GOALS,updated);this._render(true);
      };

      gc.querySelector(`#ga-${goal.id}`).onclick=async()=>{
        const amt=parseMoney(gc.querySelector(`#gp-${goal.id}`).value);
        if(!amt||amt<=0) return;
        await this.db.add(S.TX,{amount:amt,type:'expense',category:'Цель',comment:goal.name,date:new Date().toISOString(),account:'savings'});
        await this.db.adjustAccountBalance('expense',amt,'savings','',false);
        this._render(true);
      };
    }

    const nc=this._card();
    let newColor=GOAL_COLORS[0];
    nc.innerHTML=`<div class="card-title">Добавить новую цель</div>
      <div class="ig" id="ng-wrap-n"><label class="lbl">Название</label><input id="ng-n" placeholder="Квартира, 3D-принтер, Отпуск…"></div>
      <div class="g2">
        <div class="ig"><label class="lbl">Сумма (₽)</label><input type="text" inputmode="decimal" id="ng-t" placeholder="100000"></div>
        <div class="ig"><label class="lbl">Дедлайн</label><input type="date" id="ng-d" value="2026-12-31"></div>
        <div class="ig"><label class="lbl">План ₽/мес</label><input type="text" inputmode="decimal" id="ng-a" placeholder="10000"></div>
        <div class="ig"><label class="lbl">Приоритет</label><select id="ng-p"><option value="1">1 — Высокий</option><option value="2" selected>2 — Средний</option><option value="3">3 — Низкий</option></select></div>
      </div>
      <div class="ig"><label class="lbl">Цвет</label><div id="ng-cols" style="display:flex;gap:7px;flex-wrap:wrap;margin-top:5px">${GOAL_COLORS.map((cl,i)=>`<div class="color-dot${i===0?' selected':''}" data-col="${cl}" style="background:${cl}"></div>`).join('')}</div></div>
      <button class="btn v full" id="ng-add">Создать цель</button>`;
    c.appendChild(nc);
    nc.querySelectorAll('#ng-cols .color-dot').forEach(el=>{el.onclick=()=>{nc.querySelectorAll('#ng-cols .color-dot').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');newColor=el.dataset.col;};});
    nc.querySelector('#ng-add').onclick=async()=>{
      const name=nc.querySelector('#ng-n').value.trim();
      const target=parseMoney(nc.querySelector('#ng-t').value);
      if(!name||!target){
        showInlineMsg(nc.querySelector('#ng-wrap-n'), 'Введите название и сумму', 'var(--red)');
        return;
      }
      await this.db.add(S.GOALS,{name,targetAmount:target,deadline:nc.querySelector('#ng-d').value,priority:parseInt(nc.querySelector('#ng-p').value)||2,monthlyAllocation:parseMoney(nc.querySelector('#ng-a').value)||0,color:newColor,active:true});
      this._render(true);
    };
  }

  /* ═══════ GARAGE (FIXED 'ALL CARS' BUTTON + PARTS CATALOG + SERVICE BOOK EXPORT) ═══════ */
  async _garage(c){
    const cars = await this.db.all(S.CARS);
    if(!this._carAutoSelected && this.activeCarId === null && cars.length === 1){
      this._carAutoSelected = true;
      this.activeCarId = cars[0].id;
    }
    if(this.activeCarId === null) await this._renderCarsList(c);
    else await this._renderCarDetail(c);
  }

  async _renderCarsList(c) {
    const cars = await this.db.all(S.CARS);
    const hd = this._card(' glow');
    hd.innerHTML = `<div class="card-title">
        <span>🚗 Ваши автомобили (${cars.length})</span>
        <button class="hdr-btn" id="add-car-btn">+ Добавить авто</button>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">
      Выбери автомобиль для просмотра сервисной книжки, базы запчастей и регламента ТО, или добавь новый:
    </div>`;

    if(cars.length === 0) {
      hd.insertAdjacentHTML('beforeend', `<div style="color:var(--muted);text-align:center;padding:15px;font-size:12px;">У вас пока нет добавленных автомобилей. Нажми «+ Добавить авто» выше!</div>`);
    } else {
      cars.forEach(car => {
        const el = document.createElement('div');
        el.className = 'car-card';

      <div class="card-title">➕ Новый автомобиль</div>
      <div class="g2">
        <div class="ig"><label class="lbl">Марка и Модель</label><input type="text" id="new-car-name" placeholder="Напр: Лада Гранта / Peugeot 206"></div>
        <div class="ig"><label class="lbl">Текущий пробег (км)</label><input type="text" inputmode="numeric" id="new-car-odo" placeholder="125000"></div>
      </div>
      <div class="g2">
        <div class="ig"><label class="lbl">Госномер (необязательно)</label><input type="text" id="new-car-plate" placeholder="А000АА 68"></div>
        <div class="ig"><label class="lbl">VIN (необязательно)</label><input type="text" id="new-car-vin" placeholder="XTA..."></div>
      </div>
      <button class="btn c full" id="save-new-car">💾 Создать автомобиль и сервисную книжку</button>
    `;
    hd.appendChild(addForm);
    c.appendChild(hd);

    hd.querySelector('#add-car-btn').onclick = () => {
      addForm.style.display = addForm.style.display === 'none' ? 'block' : 'none';
    };

    hd.querySelector('#save-new-car').onclick = async () => {
      const name = hd.querySelector('#new-car-name').value.trim();
      const odo = parseMoney(hd.querySelector('#new-car-odo').value) || 0;
      const plate = hd.querySelector('#new-car-plate').value.trim();
      const vin = hd.querySelector('#new-car-vin').value.trim();
      if(!name) { showInlineMsg(hd, 'Введите название автомобиля', 'var(--red)'); return; }
      const carId = await this.db.add(S.CARS, { name, odo, plate, vin });
      for (const it of GENERIC_SVC_ITEMS) {
        await this.db.add(S.SVC, {...it, lastServiceOdo: odo, conditionStatus:'ok', enabled:true, car_id: carId});
      }
      this.activeCarId = carId;
      this._render(true);
    };
  }

  async _openServiceBookExportModal(car, items, logs, parts) {
    const m = document.getElementById('global-modal');
    const mc = document.getElementById('global-modal-content');

    const lines = [];
    lines.push(`🚗 СЕРВИСНАЯ КНИЖКА: ${car.name.toUpperCase()}`);
    lines.push(`📍 Текущий пробег: ${fmtI(car.odo)} км (на ${dStr(new Date())})`);
    if (car.vin) lines.push(`🔢 VIN: ${car.vin}`);
    if (car.plate) lines.push(`🪪 Госномер: ${car.plate}`);
    if (car.oilSpec) lines.push(`🛢 Масло ДВС: ${car.oilSpec}`);
    if (car.tires) lines.push(`🛞 Шины / Давление: ${car.tires}`);
    lines.push(`──────────────────────────`);

    if (logs.length > 0) {
      lines.push(`📖 ИСТОРИЯ ОБСЛУЖИВАНИЯ И ЗАМЕН (${logs.length}):`);
      logs.forEach(lg => {
        lines.push(`• ${dStr(lg.date)} — ${fmtI(lg.odometer)} км: ${lg.label}${lg.comment ? ' (' + lg.comment + ')' : ''}${lg.cost ? ' — ' + fmtI(lg.cost) + ' ₽' : ''}`);
      });
      lines.push(`──────────────────────────`);
    }

    const kmItems = items.filter(it => !isCondOnly(it) && it.lastServiceOdo > 0);
    if (kmItems.length > 0) {
      lines.push(`🔧 СОСТОЯНИЕ ПО РЕГЛАМЕНТУ ТО:`);
      kmItems.forEach(it => {
        const done = Math.max(0, car.odo - it.lastServiceOdo);
        const rem = Math.max(0, it.km - done);
        lines.push(`• ${it.label}: менялось на ${fmtI(it.lastServiceOdo)} км (запас хода ещё ${fmtI(rem)} км из ${fmtI(it.km)} км)${it.notes ? ' [' + it.notes + ']' : ''}`);
      });
      lines.push(`──────────────────────────`);
    }

    if (parts.length > 0) {
      lines.push(`🔩 ИСПОЛЬЗУЕМЫЕ ЗАПЧАСТИ И АРТИКУЛЫ:`);
      parts.forEach(p => {
        lines.push(`• ${p.name} (${p.cat || 'Авто'}): ${p.brand || ''} ${p.partNo ? 'Арт: ' + p.partNo : ''}${p.note ? ' — ' + p.note : ''}`);
      });
    }

    const fullText = lines.join('\n');

    mc.innerHTML = `
      <div class="card-title">
        <span>📖 Сервисная книжка (Для продажи / отправки)</span>
        <button class="del-btn" id="sb-close">✕</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.45">
        Готовая выписка по автомобилю. Можешь отредактировать текст прямо здесь и скопировать в 1 клик для покупателя, объявления или мастера:
      </div>
      <textarea id="sb-export-txt" style="min-height:230px;font-size:11.5px;font-family:monospace;line-height:1.5">${fullText}</textarea>
      <div class="btn-row">
        <button class="btn c full" id="sb-copy-btn">📋 Скопировать сервисную книжку в буфер</button>
      </div>
    `;
    m.classList.add('show');
    mc.querySelector('#sb-close').onclick = closeModal;
    mc.querySelector('#sb-copy-btn').onclick = async () => {
      const txt = mc.querySelector('#sb-export-txt').value;
      try {
        await navigator.clipboard.writeText(txt);
        showInlineMsg(mc, '✓ Сервисная книжка скопирована в буфер обмена!');
      } catch (_) {
        mc.querySelector('#sb-export-txt').select();
        document.execCommand('copy');
        showInlineMsg(mc, '✓ Скопировано!');
      }
    };
  }

  async _renderCarDetail(c) {
    const car = await this.db.get(S.CARS, this.activeCarId);
    if(!car) { this.activeCarId = null; this._render(true); return; }
    this.garageSubTab = this.garageSubTab || 'maint';

    const odo = car.odo;
    const hist = (await this.db.all(S.ODO)).filter(o => !o.car_id || o.car_id === car.id);
    const items = (await this.db.all(S.SVC)).filter(it => (!it.car_id || it.car_id === car.id) && it.enabled !== false).sort((a,b)=>a.id-b.id);
    const carTasks = (await this.db.all(S.CTASK)).filter(t => !t.car_id || t.car_id === car.id);
    const carParts = (await this.db.all(S.CPARTS)).filter(p => !p.car_id || p.car_id === car.id);
    const logs = (await this.db.all(S.GARAGE)).filter(lg => !lg.car_id || lg.car_id === car.id).sort((a, b) => new Date(b.date) - new Date(a.date));
    const allTxs = await this.db.all(S.TX);

    let avgDay = 25;
    if(hist.length >= 2){
      const s = [...hist].sort((a,b)=>new Date(a.date)-new Date(b.date));
      const span = (new Date(s[s.length-1].date)-new Date(s[0].date))/86400000;
      const delta = s[s.length-1].odometer - s[0].odometer;
      if(span>0 && delta>0) avgDay = delta/span;
    }

    let osagoBadge = '';
    if(car.osagoDate){
      const dLeft = Math.ceil((new Date(car.osagoDate) - new Date()) / 86400000);
      const oCol = dLeft < 14 ? 'var(--red)' : dLeft < 30 ? 'var(--orange)' : 'var(--green)';
      osagoBadge = `<span style="font-size:10px;color:${oCol};font-weight:700">🛡️ ОСАГО: ${dLeft > 0 ? dLeft + ' дн.' : 'ИСТЕКЛО!'}</span>`;
    }

    const oc = this._card(' glow');
    oc.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px">
        <button class="hdr-btn" id="back-btn" style="border-color:rgba(0,240,255,0.35);color:var(--cyan)">‹ Все авто (Сменить / Добавить)</button>
        ${osagoBadge}
        <button class="hdr-btn" id="export-svc-book" style="border-color:rgba(0,255,149,.4);color:var(--green)">📖 Сервисная книжка</button>
      </div>
      <div class="card-title">
        <span>🚗 ${car.name}${car.plate ? ' · ' + car.plate : ''}</span>
        <span style="font-size:9.5px;color:var(--muted);text-transform:none">~${Math.round(avgDay*7)} км/нед</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div class="big">${fmtI(odo)} <span style="font-size:16px;color:rgba(0,240,255,.45)">км</span></div>
        <button class="btn c sm" id="odo-btn">📍 Обновить пробег</button>
      </div>
      <div id="odo-ed"></div>

      <div class="seg-bar" style="margin-top:12px;margin-bottom:0">
        <div class="seg-btn ${this.garageSubTab==='maint'?'active':''}" data-gst="maint">🔧 ТО (${items.length})</div>
        <div class="seg-btn ${this.garageSubTab==='parts'?'active':''}" data-gst="parts">🔩 Запчасти (${carParts.length})</div>
        <div class="seg-btn ${this.garageSubTab==='tasks'?'active':''}" data-gst="tasks">📋 План (${carTasks.filter(x=>!x.done).length})</div>
        <div class="seg-btn ${this.garageSubTab==='fuel'?'active':''}" data-gst="fuel">⛽ Топливо</div>
        <div class="seg-btn ${this.garageSubTab==='info'?'active':''}" data-gst="info">🪪 Паспорт</div>
      </div>
    `;
    c.appendChild(oc);

    oc.querySelector('#back-btn').onclick = () => {
      this._carAutoSelected = true;
      this.activeCarId = null;
      this._render(true);
    };
    oc.querySelector('#export-svc-book').onclick = () => this._openServiceBookExportModal(car, items, logs, carParts);
    oc.querySelectorAll('[data-gst]').forEach(btn => {
      btn.onclick = () => { this.garageSubTab = btn.dataset.gst; this._render(true); };
    });

    oc.querySelector('#odo-btn').onclick=()=>{
      const ed=oc.querySelector('#odo-ed');
      if(ed.innerHTML){ed.innerHTML='';return;}
      ed.innerHTML=`<div class="g2" style="margin-top:12px"><div class="ig"><label class="lbl">Новый пробег (км)</label><input type="text" inputmode="numeric" id="oi" placeholder="${odo}" value="${odo}"></div><div class="ig"><label class="lbl">Дата</label><input type="date" id="od" value="${today()}"></div></div><button class="btn c full" id="os">Сохранить пробег</button>`;
      const oi = ed.querySelector('#oi');
      oi.focus(); oi.select();
      ed.querySelector('#os').onclick=async()=>{
        const v=parseMoney(oi.value);
        const dt=ed.querySelector('#od').value||today();
        if(isNaN(v)||v<=0) return;
        await this.db.set(S.CARS, { ...car, odo: v });
        await this.db.setCfg('currentOdometer', v);
        await this.db.add(S.ODO, { car_id: car.id, odometer: v, date: new Date(dt+'T12:00:00').toISOString() });
        this._render(true);
      };
    };

    const openServiceNodeModal = (nodeToEdit = null) => {
      const m = document.getElementById('global-modal');
      const mc = document.getElementById('global-modal-content');
      const isEdit = Boolean(nodeToEdit);
      const isCond = nodeToEdit ? isCondOnly(nodeToEdit) : false;

      mc.innerHTML = `
        <div class="card-title">
          <span>${isEdit ? '✏️ Настройка узла ТО' : '➕ Добавить узел в регламент'}</span>
          <button class="del-btn" id="sn-x">✕</button>
        </div>
        <div class="ig">
          <label class="lbl">Название узла / расходника</label>
          <input id="sn-lbl" placeholder="Например: Масло ГУР / Ремень генератора" value="${nodeToEdit?.label||''}">
        </div>
        <div class="g2">
          <div class="ig">
            <label class="lbl">Тип контроля</label>
            <select id="sn-type">
              <option value="km" ${!isCond?'selected':''}>По пробегу (интервал в км)</option>
              <option value="cond" ${isCond?'selected':''}>По состоянию (осмотр)</option>
            </select>
          </div>
          <div class="ig">
            <label class="lbl">Важность узла</label>
            <select id="sn-crit">
              <option value="critical" ${(nodeToEdit?.crit||'warning')==='critical'?'selected':''}>🔴 Критично (ДВС/Тормоза)</option>
              <option value="warning" ${(nodeToEdit?.crit||'warning')==='warning'?'selected':''}>🟠 Внимание (Ходовая/Фильтры)</option>
              <option value="info" ${(nodeToEdit?.crit||'warning')==='info'?'selected':''}>🔵 Обычное (Комфорт)</option>
            </select>
          </div>
        </div>
        <div class="g2" id="sn-km-wrap" style="display:${isCond?'none':'grid'}">
          <div class="ig">
            <label class="lbl">Интервал замены (км)</label>
            <input type="text" inputmode="numeric" id="sn-km" placeholder="10000" value="${nodeToEdit?.km||''}">
          </div>
          <div class="ig">
            <label class="lbl">На каком пробеге менялось (км)</label>
            <input type="text" inputmode="numeric" id="sn-last" placeholder="${odo}" value="${nodeToEdit?.lastServiceOdo||''}">
          </div>
        </div>
        <div class="ig">
          <label class="lbl">Заметка / Артикул / Допуск (необязательно)</label>
          <input id="sn-notes" placeholder="Например: Lukoil Genesis 5W-30 · фильтр Mann W712" value="${nodeToEdit?.notes||''}">
        </div>
        <div class="btn-row">
          <button class="btn c full" id="sn-save">${isEdit ? '💾 Сохранить узел' : '➕ Добавить в регламент'}</button>
          ${isEdit ? `<button class="btn r full" id="sn-del" style="margin-top:4px">🗑 Удалить этот узел из списка</button>` : ''}
        </div>
      `;
      m.classList.add('show');
      mc.querySelector('#sn-x').onclick = closeModal;

      const typeSel = mc.querySelector('#sn-type');
      const kmWrap  = mc.querySelector('#sn-km-wrap');
      typeSel.onchange = () => {
        kmWrap.style.display = typeSel.value === 'cond' ? 'none' : 'grid';
      };

      mc.querySelector('#sn-save').onclick = async () => {
        const label = mc.querySelector('#sn-lbl').value.trim();
        if(!label) return;
        const condOnly = typeSel.value === 'cond';
        const crit = mc.querySelector('#sn-crit').value;
        const km = condOnly ? 0 : (parseMoney(mc.querySelector('#sn-km').value) || 10000);
        const lastServiceOdo = condOnly ? 0 : (parseMoney(mc.querySelector('#sn-last').value) || 0);
        const notes = mc.querySelector('#sn-notes').value.trim();

        if(isEdit){
          await this.db.set(S.SVC, {
            ...nodeToEdit,
            label, condOnly, crit, km, lastServiceOdo, notes
          });
        } else {
          await this.db.add(S.SVC, {
            key: 'custom_' + Date.now(),
            label, condOnly, crit, km, lastServiceOdo, notes,
            conditionStatus: 'ok', enabled: true, car_id: car.id
          });

        this._render(true);

      if(isEdit){
        mc.querySelector('#sn-del').onclick = async () => {
          await this.db.del(S.SVC, nodeToEdit.id);

    // ─── GARAGE SUB-TAB 1: MAINTENANCE & SERVICE BOOK ───
    if(this.garageSubTab === 'maint'){
      const wc = this._card();
      wc.innerHTML = `
        <div class="card-title">
          <span>🔧 Регламент и состояние узлов</span>

                  <option value="replace" ${cs === 'replace' ? 'selected' : ''}>Заменить</option>
                  <option value="critical" ${cs === 'critical' ? 'selected' : ''}>Критично!</option>
                </select>
                <button class="btn v sm" data-ednode="${it.id}" style="padding:4px 7px">✏️</button>
              </div>
            </div>
            <div class="wear-bar"><div class="wear-fill" style="width:${pctMap[cs] || 0}%;background:${cCol(cs)}"></div></div>
            ${it.notes ? `<div style="font-size:10px;color:#7d97ab;margin-top:3px">📌 ${it.notes}</div>` : ''}
          `;
          div.querySelector('.cond-sel').onchange = async e => {
            await this.db.set(S.SVC, { ...it, conditionStatus: e.target.value });
            this._render(true);
          };
        } else {
          const done = it.lastServiceOdo > 0 ? Math.max(0, odo - it.lastServiceOdo) : 0;
          const pct = (it.km > 0 && it.lastServiceOdo > 0) ? Math.min(100, (done / it.km) * 100) : 0;
          const rem = it.lastServiceOdo > 0 ? Math.max(0, it.km - done) : it.km;
          const col = it.lastServiceOdo > 0 ? wCol(pct) : 'var(--muted)';
          const eta = (avgDay > 0 && rem > 0 && it.lastServiceOdo > 0) ? dStr(new Date(Date.now() + (rem / avgDay) * 86400000)) : '—';
          div.innerHTML = `
            <div class="wear-lbl">
              <span style="flex:1;min-width:0"><span class="pill ${critClass}">${critLbl}</span><b>${it.label}</b></span>
              <div style="display:flex;gap:5px;align-items:center">
                <span style="color:${col};font-weight:800;font-size:11px">${it.lastServiceOdo > 0 ? pct.toFixed(0) + '%' : 'не задан'}</span>

              <div class="ig"><label class="lbl">Комментарий / Бренд детали</label><input id="qd-comm" placeholder="Например: фильтр Mann + работа" value="${it.notes||''}"></div>
