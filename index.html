<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sentinel OS">
<meta name="theme-color" content="#05060a">
<link rel="manifest" href="manifest.json">
<title>Sentinel OS: Carbon Ultra</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --bg:#05060a;
  --card:rgba(13,15,26,.88);
  --card-hi:rgba(20,24,40,.92);
  --border:rgba(0,240,255,.16);
  --cyan:#00f0ff;
  --violet:#9b4dff;
  --green:#00ff95;
  --red:#ff4d5e;
  --orange:#ffa040;
  --yellow:#ffeb40;
  --text:#e4ecf5;
  --muted:#6c8296;
}
html,body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif;font-size:14px;height:100%;overflow-x:hidden}
body{
  background-image:
    radial-gradient(circle at 10% 0%, rgba(0,240,255,.07) 0%, transparent 45%),
    radial-gradient(circle at 90% 10%, rgba(155,77,255,.07) 0%, transparent 45%);
  padding-bottom:calc(env(safe-area-inset-bottom) + 88px);
}

@keyframes logo-flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.logo{font-size:13px;font-weight:800;letter-spacing:2.5px;background:linear-gradient(90deg,#00f0ff,#9b4dff,#00ff95,#00f0ff);background-size:300%;animation:logo-flow 6s ease infinite;-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}

/* HEADER */
#app-header{
  position:sticky;top:0;z-index:100;
  background:rgba(5,6,10,.82);
  border-bottom:1px solid rgba(0,240,255,.12);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.header-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.header-pills{display:flex;align-items:center;gap:6px;flex:1;justify-content:center;min-width:0}
.hdr-pill{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;
  white-space:nowrap;display:inline-flex;align-items:center;gap:5px;cursor:pointer;
}
.header-acts{display:flex;gap:6px;flex-shrink:0}
.hdr-btn{
  background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.25);
  border-radius:10px;color:var(--cyan);padding:6px 9px;font-size:10px;
  font-weight:700;cursor:pointer;letter-spacing:.4px;line-height:1;
}
.hdr-btn:active{transform:scale(.95);background:rgba(0,240,255,.2)}

/* BOTTOM NAVIGATION (S23 ULTRA ERGONOMIC DOCK) */
#bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(8,10,18,.92);
  border-top:1px solid rgba(0,240,255,.16);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-around;align-items:center;
  box-shadow:0 -8px 30px rgba(0,0,0,.6);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:5px 2px;cursor:pointer;color:var(--muted);
  font-size:9px;font-weight:700;letter-spacing:.3px;transition:all .2s;user-select:none;
  border-radius:12px;
}
.nav-item .nav-ico{font-size:17px;line-height:1;transition:transform .2s}
.nav-item.active{color:var(--cyan);text-shadow:0 0 10px rgba(0,240,255,.4)}
.nav-item.active .nav-ico{transform:translateY(-2px) scale(1.08)}
.nav-fab{
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  color:#05060a;font-size:24px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 18px rgba(0,240,255,.45);
  cursor:pointer;flex-shrink:0;margin:0 4px;border:none;
  transition:transform .15s;
}
.nav-fab:active{transform:scale(.9)}

#app-content{padding:12px 12px 24px;max-width:600px;margin:0 auto}

.page-slide-left{animation:slideL .2s cubic-bezier(.16,1,.3,1) forwards}
.page-slide-right{animation:slideR .2s cubic-bezier(.16,1,.3,1) forwards}
@keyframes slideL{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}

/* CARDS & TYPOGRAPHY */
.card{
  background:var(--card);border:1px solid rgba(0,240,255,.11);
  border-radius:20px;padding:15px;margin-bottom:12px;
  position:relative;overflow:hidden;
  box-shadow:0 6px 24px rgba(0,0,0,.35);
}
.card.danger{border-color:rgba(255,77,94,.45);box-shadow:0 0 20px rgba(255,77,94,.1)}
.card.glow{border-color:rgba(0,240,255,.3);box-shadow:0 0 22px rgba(0,240,255,.08)}
.card-title{
  font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--cyan);border-left:3px solid var(--cyan);padding-left:8px;
  margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;
}

.big{font-size:30px;font-weight:800;color:var(--cyan);letter-spacing:-1px;line-height:1}
.big.ok{color:var(--green)}.big.warn{color:var(--orange)}.big.bad{color:var(--red);text-shadow:0 0 12px rgba(255,77,94,.35)}
.sub{font-size:11px;color:var(--muted);margin-top:5px}
.lbl{display:block;font-size:10px;color:var(--muted);margin-bottom:5px;font-weight:600;letter-spacing:.4px}

/* INPUTS & BUTTONS */
input,select,textarea{
  width:100%;padding:11px 13px;background:rgba(0,0,0,.55);
  border:1px solid rgba(0,240,255,.18);border-radius:13px;
  color:var(--text);font-size:14px;outline:none;font-family:inherit;
  transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(0,240,255,.12)}
select option{background:#0b0d17;color:var(--text)}
textarea{resize:vertical;min-height:80px;line-height:1.55}
.ig{margin-bottom:10px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;font-size:12px;font-weight:700;border-radius:14px;
  cursor:pointer;border:1px solid;font-family:inherit;transition:all .18s;
  white-space:nowrap;letter-spacing:.3px;user-select:none;
}
.btn:active{transform:scale(.97)}
.btn.c{background:rgba(0,240,255,.11);border-color:var(--cyan);color:var(--cyan)}
.btn.v{background:rgba(155,77,255,.14);border-color:var(--violet);color:#c8a6ff}
.btn.g{background:rgba(0,255,149,.1);border-color:rgba(0,255,149,.45);color:var(--green)}
.btn.o{background:rgba(255,160,64,.1);border-color:rgba(255,160,64,.45);color:var(--orange)}
.btn.r{background:rgba(255,77,94,.1);border-color:rgba(255,77,94,.4);color:#ff7a85}
.btn.full{width:100%;margin-top:8px}
.btn.sm{padding:6px 11px;font-size:10px;border-radius:10px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

.stat{background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:11px 8px;text-align:center}
.stat .v{font-size:15px;font-weight:800;color:var(--cyan);margin-bottom:3px}
.stat .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}

/* CHIPS & PRESETS */
.chips-scroll{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}
.chips-scroll::-webkit-scrollbar{display:none}
.q-chip{
  flex:0 0 auto;padding:7px 12px;border-radius:12px;
  background:rgba(255,255,255,.04);border:1px solid rgba(0,240,255,.18);
  color:var(--text);font-size:11px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;transition:all .15s;
}
.q-chip:active,.q-chip.active{background:rgba(0,240,255,.16);border-color:var(--cyan);color:var(--cyan)}
.q-chip.fav{border-color:rgba(255,235,64,.4);background:rgba(255,235,64,.07)}
.q-chip.fav.active{background:rgba(255,235,64,.2);border-color:var(--yellow);color:var(--yellow)}

/* SEGMENTED SWITCHER */
.seg-bar{
  display:flex;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08);
  border-radius:14px;padding:3px;margin-bottom:12px;gap:3px;
}
.seg-btn{
  flex:1;text-align:center;padding:8px 6px;font-size:10px;font-weight:700;
  color:var(--muted);border-radius:11px;cursor:pointer;transition:all .2s;
  white-space:nowrap;user-select:none;
}
.seg-btn.active{background:rgba(0,240,255,.15);color:var(--cyan);box-shadow:0 2px 8px rgba(0,0,0,.4)}

/* PROGRESS & LOGS */
.prog-track{height:7px;background:rgba(255,255,255,.07);border-radius:7px;overflow:hidden;margin:7px 0 5px}
.prog-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .4s}

.log-row{padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between;align-items:center;gap:8px}
.log-row:last-child{border-bottom:none}
.log-meta{font-size:10px;color:var(--muted);margin-top:2px}
.amt{font-size:13px;font-weight:800;white-space:nowrap}
.amt.i{color:var(--green)}.amt.e{color:var(--red)}
.badge{display:inline-block;padding:2px 8px;border-radius:7px;font-size:9px;font-weight:700;background:rgba(0,240,255,.1);color:var(--cyan);letter-spacing:.4px}
.del-btn{background:none;border:1px solid rgba(255,80,80,.22);border-radius:8px;color:rgba(255,80,80,.55);font-size:13px;padding:3px 8px;cursor:pointer;flex-shrink:0;line-height:1}

/* GARAGE */
.wear-row{margin-bottom:13px;padding-bottom:13px;border-bottom:1px solid rgba(255,255,255,.05)}
.wear-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.wear-lbl{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px;color:#b0c0d0;align-items:center;gap:6px}
.wear-bar{height:6px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden}
.wear-fill{height:100%;border-radius:5px;transition:width .5s}
.svc-notes{font-size:10px;color:#627b8c;font-style:italic;margin-top:3px}

.pill{display:inline-block;padding:2px 7px;border-radius:6px;font-size:9px;font-weight:700;letter-spacing:.4px;margin-right:5px;flex-shrink:0}
.pill.crit{background:rgba(255,77,94,.15);color:var(--red);border:1px solid rgba(255,77,94,.3)}
.pill.warn{background:rgba(255,160,64,.12);color:var(--orange);border:1px solid rgba(255,160,64,.25)}
.pill.info{background:rgba(68,170,255,.1);color:#5af;border:1px solid rgba(68,170,255,.2)}

.b-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px}
.b-row:last-child{border-bottom:none}
.b-key{color:#7a90a0;font-size:11px}
.b-val{font-weight:700}

/* HUB & RECIPES */
.recipe{background:rgba(0,0,0,.38);border:1px solid rgba(155,77,255,.18);border-radius:14px;padding:13px;margin-bottom:9px;cursor:pointer}
.recipe-hd{display:flex;justify-content:space-between;align-items:center}
.recipe-name{font-size:12px;font-weight:700}
.recipe-meta{font-size:10px;color:var(--muted);margin-top:3px}
.recipe-body{display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06);font-size:11px;color:#a8c0d0;line-height:1.7}
.recipe-body.open{display:block}
.recipe-body ol,.recipe-body ul{margin:5px 0 0;padding-left:18px}
.rsec{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--cyan);margin:8px 0 4px}

.tip{background:rgba(0,240,255,.04);border:1px solid rgba(0,240,255,.12);border-radius:12px;padding:11px 13px;margin-bottom:8px;font-size:11px;color:#a8c4d8;line-height:1.65}
.reminder{background:rgba(255,160,64,.08);border:1px solid rgba(255,160,64,.3);border-radius:12px;padding:11px;margin-bottom:10px;font-size:12px;color:var(--orange);line-height:1.55}
.reminder.red{background:rgba(255,77,94,.08);border-color:rgba(255,77,94,.35);color:#ff6b78}
.reminder.green{background:rgba(0,255,149,.07);border-color:rgba(0,255,149,.25);color:var(--green)}

/* 3D PRINT PRO STUDIO */
.diff-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.diff-card{
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.08);
  border-radius:13px;padding:10px;cursor:pointer;transition:all .18s;
  display:flex;flex-direction:column;gap:3px;
}
.diff-card.active{border-color:var(--cyan);background:rgba(0,240,255,.1);box-shadow:0 0 14px rgba(0,240,255,.12)}
.diff-card .d-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800}
.diff-card .d-sub{font-size:9.5px;color:var(--muted);line-height:1.35}

.advisor-box{
  border-radius:14px;padding:12px;margin-top:10px;font-size:11px;line-height:1.55;
  border:1px solid;
}
.advisor-box.good{background:rgba(0,255,149,.07);border-color:rgba(0,255,149,.3);color:#b8ffe0}
.advisor-box.low{background:rgba(255,77,94,.08);border-color:rgba(255,77,94,.35);color:#ffb8c0}
.advisor-box.high{background:rgba(255,160,64,.08);border-color:rgba(255,160,64,.35);color:#ffe0b5}

.calc-result{background:rgba(0,0,0,.45);border:1px solid rgba(0,240,255,.16);border-radius:14px;padding:13px;font-size:12px;line-height:1.85}
.calc-total{font-size:20px;font-weight:800;color:var(--cyan);margin-top:8px;border-top:1px solid rgba(0,240,255,.15);padding-top:8px;display:flex;justify-content:space-between;align-items:baseline}

/* COMPACT HORIZONTAL MONTHLY CHART (STATS) */
.h-chart-wrap{
  display:flex;align-items:flex-end;gap:10px;height:150px;
  padding:18px 6px 6px;overflow-x:auto;scrollbar-width:thin;
  background:rgba(0,0,0,.35);border-radius:14px;border:1px solid rgba(255,255,255,.05);
}
.h-col{
  flex:1;min-width:44px;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;
}
.h-bars{display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center;height:105px}
.h-bar{width:13px;border-radius:4px 4px 1px 1px;transition:height .4s;min-height:3px;position:relative}
.h-bar.inc{background:linear-gradient(180deg,var(--green),rgba(0,255,149,.35))}
.h-bar.exp{background:linear-gradient(180deg,var(--red),rgba(255,77,94,.35))}
.h-lbl{font-size:9px;color:var(--muted);margin-top:6px;font-weight:700}
.h-net{font-size:8px;font-weight:700;margin-bottom:3px;white-space:nowrap}

.canvas-wrap{border-radius:14px;overflow:hidden;background:rgba(0,0,0,.3);margin-top:8px}
.canvas-wrap canvas{display:block;width:100%}

details{margin-top:8px}
details summary{font-size:11px;color:#7296ab;cursor:pointer;user-select:none;padding:6px 0;list-style:none;font-weight:600}
details summary::before{content:'›';margin-right:6px;display:inline-block;transition:transform .2s}
details[open] summary::before{transform:rotate(90deg)}

.search-row{display:flex;gap:8px;margin-bottom:12px}
.search-row input{flex:1}
.search-row select{flex:0 0 auto;width:auto;min-width:110px}

.goal-mini{margin-bottom:12px}
.goal-mini-title{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;align-items:center}
.payday-tag{display:inline-block;padding:4px 11px;border-radius:20px;font-size:10px;font-weight:700;background:rgba(155,77,255,.15);border:1px solid rgba(155,77,255,.35);color:#c8a6ff}

.color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .2s;flex-shrink:0}
.color-dot.selected{border-color:white;box-shadow:0 0 8px rgba(255,255,255,.4)}

.hist-list{max-height:200px;overflow-y:auto;scrollbar-width:thin}
.free-cash{margin-top:10px;font-size:11px;color:var(--green);background:rgba(0,255,149,.07);padding:8px 11px;border-radius:10px;border:1px solid rgba(0,255,149,.2)}

.chart-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px}
.chart-legend span{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:#b0c0d0}
.chart-legend .ld{display:inline-block;width:9px;height:9px;border-radius:3px;flex-shrink:0}

.mandatory-row{display:flex;align-items:center;gap:10px;padding:10px 13px;background:rgba(255,160,64,.06);border:1px solid rgba(255,160,64,.22);border-radius:13px;margin-top:8px;cursor:pointer;user-select:none}
.mandatory-row.on{background:rgba(255,160,64,.14);border-color:rgba(255,160,64,.5)}
.mandatory-toggle{position:relative;width:38px;height:20px;flex-shrink:0}
.mandatory-toggle input{opacity:0;width:0;height:0;position:absolute}
.mandatory-knob{position:absolute;inset:0;border-radius:20px;background:rgba(255,255,255,.15);transition:.25s;border:1px solid rgba(255,255,255,.2)}
.mandatory-knob::after{content:'';position:absolute;left:3px;top:2px;width:14px;height:14px;border-radius:50%;background:#6a8090;transition:.25s}
.mandatory-toggle input:checked+.mandatory-knob{background:rgba(255,160,64,.35);border-color:var(--orange)}
.mandatory-toggle input:checked+.mandatory-knob::after{left:18px;background:var(--orange)}
.mandatory-lbl{font-size:11px;font-weight:700;color:var(--orange);flex:1}
.mandatory-sub{font-size:9px;color:var(--muted)}
.mandatory-badge{display:inline-block;padding:1px 6px;border-radius:6px;font-size:8px;font-weight:700;background:rgba(255,160,64,.2);border:1px solid rgba(255,160,64,.35);color:var(--orange);margin-left:4px;vertical-align:middle}

.tx-filter-bar{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.tx-filter-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tx-filter-row select,.tx-filter-row input[type=date]{flex:1;min-width:90px;padding:8px 10px;font-size:11px}
.tx-filter-row input[type=text]{flex:2;min-width:120px}
.filter-label{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);flex-shrink:0}
.tx-sort-btn{padding:6px 11px;border-radius:16px;font-size:10px;font-weight:700;border:1px solid rgba(0,240,255,.2);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.tx-sort-btn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,240,255,.1)}
.tx-page-bar{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.tx-page-btn{padding:8px 16px;border-radius:16px;font-size:11px;font-weight:700;border:1px solid rgba(0,240,255,.25);background:rgba(0,240,255,.06);color:var(--cyan);cursor:pointer}
.tx-count-line{text-align:center;font-size:10px;color:var(--muted);margin-top:6px}

.overlay-modal{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9999;display:flex;align-items:flex-end;justify-content:center;padding:12px;backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .2s}
.overlay-modal.show{opacity:1;pointer-events:auto}
.modal-sheet{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;margin-bottom:env(safe-area-inset-bottom);animation:sheetUp .22s ease}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

.car-card{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.45);border:1px solid rgba(0,240,255,.16);border-radius:15px;padding:14px;margin-bottom:10px;cursor:pointer}
.car-card:active{background:rgba(0,240,255,.1);border-color:var(--cyan)}
.car-card-name{font-size:14px;font-weight:700;color:var(--cyan)}
.car-card-odo{font-size:11px;color:var(--muted);margin-top:4px}

input[type=range]{-webkit-appearance:auto;appearance:auto;padding:0;background:transparent;border:none;accent-color:var(--cyan)}
</style>

class DB {
  constructor(){ this.ready = this._open(); }
  _open(){
    return new Promise((res,rej)=>{
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        const mk = (n,opts,idx=[])=>{
          if (!db.objectStoreNames.contains(n)){
            const st = db.createObjectStore(n,opts);
            idx.forEach(([a,b])=>st.createIndex(a,b));
          }
        };
        mk(S.TX,    {keyPath:'id',autoIncrement:true},[['date','date'],['category','category']]);
        mk(S.GARAGE,{keyPath:'id',autoIncrement:true},[['date','date']]);
        mk(S.ODO,   {keyPath:'id',autoIncrement:true},[['date','date']]);
        mk(S.CFG,   {keyPath:'key'});
        mk(S.SVC,   {keyPath:'id',autoIncrement:true},[['key','key']]);
        mk(S.GOALS, {keyPath:'id',autoIncrement:true});
        mk(S.CARS,  {keyPath:'id',autoIncrement:true});
        mk(S.FIL,   {keyPath:'id',autoIncrement:true});
        mk(S.TPL,   {keyPath:'id',autoIncrement:true});
      };
      req.onsuccess = e => { this.db=e.target.result; this._seed().then(res).catch(rej); };
      req.onerror   = e => rej(e.target.error);
    });
  }
  async _seed(){
    for(const [k,v] of Object.entries(DEFAULTS)){
      if(await this.get(S.CFG,k)===null) await this.set(S.CFG,{key:k,value:v});
    }
    const cars = await this.all(S.CARS);
    if(cars.length === 0) {
      const legacyGlobalOdo = await this.cfg('currentOdometer');
      const carId = await this.add(S.CARS, { name: 'Мой Автомобиль', odo: legacyGlobalOdo || 0 });
      let svcs = await this.all(S.SVC);
      if (svcs.length > 0) {
        for (const s of svcs) { if (!s.car_id) { s.car_id = carId; await this.set(S.SVC, s); } }
      } else {
        for (const it of GENERIC_SVC_ITEMS) {
          await this.add(S.SVC, {...it, lastServiceOdo:0, conditionStatus:'ok', enabled:true, car_id: carId});
        }
      }
      const odos = await this.all(S.ODO);
      for (const o of odos) { if(!o.car_id){ o.car_id = carId; await this.set(S.ODO, o); } }
      const logs = await this.all(S.GARAGE);
      for (const lg of logs) { if(!lg.car_id){ lg.car_id = carId; await this.set(S.GARAGE, lg); } }
    }
    const fils = await this.all(S.FIL);
    if(fils.length === 0){
      for(const f of DEFAULT_FILAMENTS) await this.add(S.FIL, f);
    }
    const tpls = await this.all(S.TPL);
    if(tpls.length === 0){
      for(const t of DEFAULT_TEMPLATES) await this.add(S.TPL, t);
    }
  }
  _st(n,m='readonly'){return this.db.transaction(n,m).objectStore(n);}
  get(s,k){return new Promise((r,e)=>{const q=this._st(s).get(k);q.onsuccess=()=>r(q.result!==undefined?q.result:null);q.onerror=()=>e(q.error);});}
  set(s,o){return new Promise((r,e)=>{const q=this._st(s,'readwrite').put(o);q.onsuccess=()=>r();q.onerror=()=>e(q.error);});}
  add(s,o){return new Promise((r,e)=>{const q=this._st(s,'readwrite').add(o);q.onsuccess=()=>r(q.result);q.onerror=()=>e(q.error);});}
  all(s){return new Promise((r,e)=>{const q=this._st(s).getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>e(q.error);});}
  del(s,k){return new Promise((r,e)=>{const q=this._st(s,'readwrite').delete(k);q.onsuccess=()=>r();q.onerror=()=>e(q.error);});}
  async cfg(k){const r=await this.get(S.CFG,k);return r!==null?r.value:DEFAULTS[k];}
  async setCfg(k,v){await this.set(S.CFG,{key:k,value:v});}
}

// Supports math expressions like "250+180*2" directly in money inputs!
function parseMoney(value) {
  if (value === undefined || value === null) return 0;
  let str = String(value).replace(/,/g, '.').replace(/\s+/g, '').trim();
  if (!str) return 0;
  if (/^[0-9.+\-*/()]+$/.test(str)) {
    try {
      const res = Function('"use strict";return (' + str + ')')();
      if (typeof res === 'number' && isFinite(res)) return Math.round(res * 100) / 100;
    } catch (_) {}
  }
  const num = parseFloat(str);
  return isNaN(num) ? 0 : num;
}

// Smart Sberbank / SMS / Receipt text parser
function parseSberText(raw) {
  if (!raw || typeof raw !== 'string') return null;
  const text = raw.trim();
  // Look for sum patterns like "450р", "1 250.50 ₽", "Сумма: 890", or standalone number
  let amount = 0;
  const sumMatch = text.match(/(\d[\d\s]*[.,]?\d*)\s*(?:₽|р|руб|RUB)/i) || text.match(/(?:покупка|списание|оплата|перевод|сумма)[:\s]*(\d[\d\s]*[.,]?\d*)/i) || text.match(/(\d+[.,]?\d*)/);
  if (sumMatch) {
    amount = parseMoney(sumMatch[1]);
  }
  const low = text.toLowerCase();
  let category = 'Другое';
  let isMandatory = false;
  if (/пятерочка|магнит|перекресток|лента|вкусвилл|кб|красное|продукты|еда|бургер|вкусно|додо|пицца|кафе|кофе|самокат|яндекс лавка/i.test(low)) category = 'Еда';
  else if (/лукойл|роснефть|газпром|азс|бензин|топливо|татнефть/i.test(low)) { category = 'Бензин'; isMandatory = true; }
  else if (/автодок|autodoc|автолайн|екзист|exist|запчаст|шиномонтаж|мойка|авто/i.test(low)) category = 'Авто';
  else if (/озон|ozon|wildberries|вб|яндекс маркет|али|фикс прайс|хоз/i.test(low)) category = 'Быт';
  else if (/пластик|филамент|petg|pla|сопло|3d|принтер|elegoo|creality/i.test(low)) category = '3D-расходники';
  else if (/аптека|врач|клиника|лекарств/i.test(low)) category = 'Здоровье';
  else if (/жкх|квартплата|коммунал|электроэнерг|водоканал|газ/i.test(low)) { category = 'Коммуналка'; isMandatory = true; }
  else if (/мтс|билайн|мегафон|теле2|t2|йота|интернет|ростелеком/i.test(low)) { category = 'Моб. интернет'; isMandatory = true; }

  let comment = text.replace(/\n+/g, ' ').slice(0, 45);
  return { amount, category, isMandatory, comment };
}

// --- PAYDAY SMART LOGIC (KEEPING EXACT FAVOURITE LOGIC) ---
const RU_HOLIDAYS = [
  '01-01','01-02','01-03','01-04','01-05','01-06','01-07','01-08',
  '02-23','03-08','05-01','05-09','06-12','11-04'
];
function isHoliday(date) {
  const mm = String(date.getMonth() + 1).padStart(2, '0');
  const dd = String(date.getDate()).padStart(2, '0');
  return RU_HOLIDAYS.includes(`${mm}-${dd}`);
}
function isWorkingDay(date) {
  const dow = date.getDay();
  if (dow === 0 || dow === 6) return false;
  if (isHoliday(date)) return false;
  return true;
}
function getAdjustedDate(y, m, d) {
  let dt = new Date(y, m, d);
  while (!isWorkingDay(dt)) dt.setDate(dt.getDate() - 1);
  return dt;
}
function getNthWorkingDay(y, m, n) {
  let dt = new Date(y, m, 1);
  let count = 0;
  while (dt.getMonth() === m) {
    if (isWorkingDay(dt)) {
      count++;
      if (count === n) return new Date(dt);
    }
    dt.setDate(dt.getDate() + 1);
  }
  return new Date(y, m, 28);
}

function calcNextPayday(txs) {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const pDates = [
    { date: getAdjustedDate(y, m, 5), label: 'ЗП' },
    { date: getAdjustedDate(y, m, 20), label: 'Аванс' },
    { date: getNthWorkingDay(y, m, 15), label: 'Премия' },
    { date: getAdjustedDate(y, m + 1, 5), label: 'ЗП' },
    { date: getAdjustedDate(y, m + 1, 20), label: 'Аванс' },
    { date: getNthWorkingDay(y, m + 1, 15), label: 'Премия' }
  ].filter(p => {
    const pDayStart = new Date(p.date); pDayStart.setHours(0,0,0,0);
    const todayStart = new Date(now); todayStart.setHours(0,0,0,0);
    return pDayStart >= todayStart;
  }).sort((a, b) => a.date - b.date);

  const cutoff = new Date(now); cutoff.setDate(cutoff.getDate() - 30);
  const recentTxs = (txs || []).filter(t => t.type === 'income' && new Date(t.date) >= cutoff);

  for (const p of pDates) {
    const windowStart = new Date(p.date); windowStart.setDate(windowStart.getDate() - 5);
    const windowEnd = new Date(p.date); windowEnd.setDate(windowEnd.getDate() + 5);
    const alreadyPaid = recentTxs.some(t => {
      const td = new Date(t.date);
      return t.category.includes(p.label) && td >= windowStart && td <= windowEnd;
    });
    if (!alreadyPaid) {
      const days = Math.max(0, Math.ceil((p.date - now) / 86400000));
      return { date: p.date, days, label: p.label, allUpcoming: pDates.slice(0, 3) };
    }
  }
  const fallback = getAdjustedDate(y, m+1, 5);
  return { date: fallback, days: Math.max(1, Math.ceil((fallback - now) / 86400000)), label: 'ЗП', allUpcoming: pDates.slice(0, 3) };
}

function confirmDel(btn,cb){
  if(btn._c){cb();return;}
  btn._c=true; const orig=btn.textContent;
  btn.textContent='✓?'; btn.style.cssText+=';color:#ff4d5e;border-color:#ff4d5e';
  btn.onclick=()=>{btn._ok=true;cb();};
  setTimeout(()=>{if(!btn._ok){btn._c=false;btn.textContent=orig;btn.style.color='';btn.style.borderColor='';btn.onclick=()=>confirmDel(btn,cb);}},3000);
}

// --- PRO 3D CALCULATOR ENGINE WITH 4 TIERS & AI PRICE ADVISOR ---
function calc3DProQuote(params) {
  const {
    weightG, timeHours, spoolPrice, spoolWeight, tierLevel,
    qty, postProcFee, cadFee, isUrgent,
    hourRate, setupFee, minPrice, elecPerHour, amortPerHour, markupMult
  } = params;

  const tier = DIFF_TIERS[tierLevel] || DIFF_TIERS[2];
  const gramCost = (spoolPrice > 0 && spoolWeight > 0) ? (spoolPrice / spoolWeight) : 1.4;

  // 1. Pure Cost (Себестоимость 1 детали и всей партии)
  const rawMaterialCost = weightG * gramCost * (1 + tier.failRisk);
  const machineCost = timeHours * (elecPerHour + amortPerHour);
  const nozzleWearCost = (weightG / 100) * tier.nozzleWear;
  const singleCost = rawMaterialCost + machineCost + nozzleWearCost;
  const totalCost = singleCost * qty;

  // 2. Client Quote Calculation
  // Material with markup + complexity multiplier + machine/work time + setup + extras
  const materialClient = (weightG * gramCost * markupMult) * tier.mult;
  const timeClient = (timeHours * hourRate) * tier.mult;
  
  // Small part boost (<40g) so tiny intricate gears aren't priced for pennies
  let singleWorkPrice = materialClient + timeClient;
  if (weightG > 0 && weightG <= 35) {
    const minSmallRate = tierLevel >= 3 ? 22 : 14;
    singleWorkPrice = Math.max(singleWorkPrice, weightG * minSmallRate);
  }

  let batchSubtotal = (singleWorkPrice * qty) + setupFee + postProcFee + cadFee;
  if (qty >= 5) batchSubtotal *= 0.92; // 8% volume discount hint
  if (isUrgent) batchSubtotal *= 1.30; // +30% rush order

  const minApplied = batchSubtotal < minPrice;
  const recPrice = Math.round(Math.max(batchSubtotal, minPrice) / 10) * 10;

  // Recommended market corridor
  const corridorMin = Math.max(minPrice, Math.round((totalCost * 2.1 + setupFee + postProcFee + cadFee) / 10) * 10);
  const corridorMax = Math.max(corridorMin + 150, Math.round((recPrice * 1.25) / 10) * 10);

  return {
    tier,
    gramCost,
    rawMaterialCost: rawMaterialCost * qty,
    machineCost: (machineCost + nozzleWearCost) * qty,
    totalCost,
    recPrice,
    corridorMin,
    corridorMax,
    minApplied
  };
}

function evaluatePriceHealth(customPrice, quote, weightG, qty, postProcFee, cadFee) {
  const totalWeight = weightG * qty;
  const netProfit = customPrice - quote.totalCost;
  const marginPct = customPrice > 0 ? Math.round((netProfit / customPrice) * 100) : 0;
  const effRubPerGram = totalWeight > 0 ? (customPrice - cadFee - postProcFee) / totalWeight : 0;

  let status = 'good';
  let title = '✅ Оптимальная цена';
  let advice = `Отличный баланс! Чистая прибыль составит ${fmtI(netProfit)} ₽ (маржа ${marginPct}%). Цена полностью покрывает амортизацию, электричество и риск брака (${Math.round(quote.tier.failRisk*100)}%).`;

  if (customPrice < quote.totalCost * 1.35 || netProfit < 200) {
    status = 'low';
    title = '⚠️ Слишком низкая цена (Риск уйти в минус)';
    advice = `Внимание: чистая прибыль всего ${fmtI(netProfit)} ₽. Если деталь сорвёт со стола или потребуется перепечатка, заказ уйдёт в убыток. Рекомендуем поднять минимум до ${fmtI(quote.corridorMin)} ₽.`;
  } else if (customPrice > quote.corridorMax * 1.22 && totalWeight > 50) {
    status = 'high';
    title = '🔥 Выше рынка (Премиум-наценка)';
    advice = `Эффективная ставка ~${effRubPerGram.toFixed(1)} ₽/г для веса ${totalWeight}г выше средней по рынку. Если деталь со сложной геометрией или срочная — цена оправдана, иначе клиент может попросить скидку (оптимальный коридор: ${fmtI(quote.corridorMin)}–${fmtI(quote.corridorMax)} ₽).`;
  }

  return { status, title, advice, netProfit, marginPct, effRubPerGram };
}

    // Bottom dock navigation
    document.querySelectorAll('#bottom-nav .nav-item').forEach(item=>{
      item.addEventListener('click', ()=>{
        const t = item.dataset.tab;
        if(!t || t===this.tab) return;
        const oldIdx=TABS.indexOf(this.tab), newIdx=TABS.indexOf(t);
        this._swipeDir = newIdx>oldIdx ? 'left' : 'right';
        this.tab=t;
        this._syncNavUI();

        this._render();
      });
    });

    document.getElementById('quick-fab').onclick = () => this._openQuickActionModal();

    });

    this._render();
  }

  _syncNavUI(){
    document.querySelectorAll('#bottom-nav .nav-item').forEach(el=>{
      el.classList.toggle('active', el.dataset.tab===this.tab);
    });
  }

  _initSwipe(){
    const el=document.getElementById('app-content');
    let sx=0,sy=0,moved=false;
    el.addEventListener('touchstart',e=>{
      if(e.target.tagName==='INPUT' || e.target.closest('.chips-scroll') || e.target.closest('.h-chart-wrap')) return;
      sx=e.touches[0].clientX; sy=e.touches[0].clientY; moved=false;
    },{passive:true});
    el.addEventListener('touchmove',e=>{
      if(!sx) return;
      const dx=Math.abs(e.touches[0].clientX-sx),dy=Math.abs(e.touches[0].clientY-sy);
      if(dx>dy&&dx>14) moved=true;
    },{passive:true});
    el.addEventListener('touchend',e=>{
      if(!moved||!sx) return;
      const dx=e.changedTouches[0].clientX-sx;
      const dy=e.changedTouches[0].clientY-sy;
      sx=0;
      if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.5) return;
      const cur=TABS.indexOf(this.tab);
      let next=-1;
      if(dx<0&&cur<TABS.length-1) next=cur+1;
      if(dx>0&&cur>0) next=cur-1;
      if(next<0) return;
      this._swipeDir=dx<0?'left':'right';
      this.tab=TABS[next];
      this._syncNavUI();
      window.scrollTo({top:0, behavior:'smooth'});
      this._render();
    },{passive:true});
  }

  /* ═══════ FINANCE ═══════ */
  async _finance(c){
    const balance    = await this.db.cfg('balance');
    const budgetCap  = await this.db.cfg('monthlyBudgetCap');
    const advAmt     = await this.db.cfg('advanceAmount');
    const salAmt     = await this.db.cfg('salaryAmount');
    const txs        = await this.db.all(S.TX);
    const goals      = (await this.db.all(S.GOALS)).filter(g=>g.active);
    const tpls       = await this.db.all(S.TPL);
    const now        = new Date(), todayStr=today();
    const mStart     = new Date(now.getFullYear(),now.getMonth(),1);

    const isGoal = t => t.type==='expense' && (t.category==='Цель'||(t.category==='Цель/Долг'&&goals.some(g=>g.name===t.comment)));

    const mandTxs        = txs.filter(t=>t.type==='expense'&&t.isMandatory&&new Date(t.date)>=mStart);
    const mandatorySpent = mandTxs.reduce((s,t)=>s+t.amount,0);

    const mandAvgMonths=[];
    for(let i=1;i<=3;i++){
      const ms=new Date(now.getFullYear(),now.getMonth()-i,1);
      const me=new Date(now.getFullYear(),now.getMonth()-i+1,1);
      const s=txs.filter(t=>t.type==='expense'&&t.isMandatory&&new Date(t.date)>=ms&&new Date(t.date)<me).reduce((a,t)=>a+t.amount,0);
      if(s>0) mandAvgMonths.push(s);
    }
    const mandForecast = mandAvgMonths.length ? Math.round(mandAvgMonths.reduce((a,v)=>a+v,0)/mandAvgMonths.length) : 0;

    const mandByCat={};
    mandTxs.forEach(t=>{ mandByCat[t.category]=(mandByCat[t.category]||0)+t.amount; });

    const spentMonth = txs.filter(t=>t.type==='expense'&&new Date(t.date)>=mStart&&!isGoal(t)&&!t.isMandatory).reduce((s,t)=>s+t.amount,0);
    const todaySpent = txs.filter(t=>t.type==='expense'&&t.date.startsWith(todayStr)&&!isGoal(t)&&!t.isMandatory).reduce((s,t)=>s+t.amount,0);

    const payday      = calcNextPayday(txs);
    const dInM        = new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
    const dRem        = Math.max(1,dInM-now.getDate()+1);
    const maxBal      = payday.days>0?Math.max(0,(balance-mandatorySpent)/payday.days):0;
    const budRem      = Math.max(0,budgetCap-(spentMonth-todaySpent));
    const dailyBudget = Math.min(budRem/dRem, maxBal);
    const remainToday = dailyBudget - todaySpent;
    const exceeded    = remainToday<0;
    const survRes     = dailyBudget*payday.days;
    const freeCash    = Math.max(0,balance-survRes-1000);

    // 1. HERO BALANCE + QUICK SBER SYNC
    const balCard=this._card(exceeded?' danger':' glow');
    const bCol=balance<=0?'bad':balance<survRes?'warn':'ok';
    balCard.innerHTML=`
      <div class="card-title">
        <span>Текущий баланс</span>
        <span style="font-size:9px;color:var(--muted);text-transform:none;letter-spacing:0">Нажми «Сверка», чтобы выровнять со Сбером</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div class="big ${bCol}">${fmt(balance)} ₽</div>
        <div style="display:flex;gap:6px">
          <button class="btn c sm" id="btn-sync-bal">⚖️ Сверка</button>
          <button class="btn v sm" id="set-bal">✏️</button>
        </div>
      </div>
      ${exceeded?`<div class="reminder red" style="margin-top:10px">⚠ Дневной лимит превышен на ${fmt(Math.abs(remainToday))} ₽</div>`:''}
      ${freeCash>500?`<div class="free-cash">💰 Свободный резерв: <b>${fmt(freeCash)} ₽</b> — можно направить на цели</div>`:''}
      <div id="bal-ed"></div>

      <div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)">
        <div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">⚡ Быстрый расход в 1 тап:</div>
        <div class="chips-scroll" id="fin-quick-chips">
          ${tpls.map(t=>`<div class="q-chip" data-tid="${t.id}">${t.label}</div>`).join('')}
          <div class="q-chip" id="add-tpl-chip" style="border-style:dashed;color:var(--cyan)">+ Шаблон</div>
        </div>
      </div>
    `;
    c.appendChild(balCard);

    balCard.querySelector('#btn-sync-bal').onclick = () => this._openSberSyncModal();
    balCard.querySelector('#set-bal').onclick=()=>{
      const ed=balCard.querySelector('#bal-ed');
      if(ed.innerHTML){ed.innerHTML='';return;}
      ed.innerHTML=`<div style="display:flex;gap:8px;margin-top:12px"><input type="text" inputmode="decimal" id="bi" value="${balance}" style="flex:1"><button class="btn c" id="bs">OK</button></div>`;
      ed.querySelector('#bs').onclick=async()=>{const v=parseMoney(ed.querySelector('#bi').value);if(!isNaN(v)&&v>=0){await this.db.setCfg('balance',v);this._render();}};
    };

    balCard.querySelectorAll('#fin-quick-chips .q-chip[data-tid]').forEach(chip=>{
      chip.onclick = () => {
        const tpl = tpls.find(x=>x.id===Number(chip.dataset.tid));
        if(tpl) this._openQuickActionModal({ type:'expense', category:tpl.category, amount:tpl.amount||'', comment:tpl.label.replace(/^[^\wа-яА-ЯёЁ]+/, '').trim(), isMandatory:tpl.isMandatory });
      };
    });
    balCard.querySelector('#add-tpl-chip').onclick = () => {
      const m = document.getElementById('global-modal');
      const mc = document.getElementById('global-modal-content');
      mc.innerHTML = `
        <div class="card-title"><span>Новый быстрый шаблон</span><button class="del-btn" id="tc-x">✕</button></div>
        <div class="ig"><label class="lbl">Название кнопки (с эмодзи)</label><input id="nt-lbl" placeholder="☕ Кофе"></div>
        <div class="g2">
          <div class="ig"><label class="lbl">Категория</label><select id="nt-cat">${CAT_EXP.map(x=>`<option value="${x}">${x}</option>`).join('')}</select></div>
          <div class="ig"><label class="lbl">Сумма по умолч. (0 = спрашивать)</label><input type="number" id="nt-amt" value="0"></div>
        </div>
        <button class="btn c full" id="nt-save">Сохранить шаблон</button>
      `;
      m.classList.add('show');
      mc.querySelector('#tc-x').onclick = closeModal;
      mc.querySelector('#nt-save').onclick = async () => {
        const lbl = mc.querySelector('#nt-lbl').value.trim();
        if(!lbl) return;
        await this.db.add(S.TPL, { label:lbl, category:mc.querySelector('#nt-cat').value, amount:parseMoney(mc.querySelector('#nt-amt').value), isMandatory:false });
        closeModal();
        this._render();
      };
    };

    // 2. BUDGET & PAYDAYS (WITH 1-TAP CLAIM FOR ZP / ADVANCE / BONUS)
    const dayCol=remainToday<0?'#ff4d5e':remainToday<200?'#ffa040':'#00ff95';
    const budCard=this._card();
    budCard.innerHTML=`<div class="card-title">Бюджет и выплаты (ЗП · Аванс · Премия)</div>
      <div class="b-row">
        <div class="b-key">Ближайшая выплата</div>
        <div class="b-val">
          <span class="payday-tag">${payday.label} · ${dStr(payday.date)}</span>
          <span style="color:var(--violet);margin-left:5px"><b>${payday.days}</b> дн.</span>
        </div>
      </div>
      <div style="display:flex;gap:6px;margin:8px 0 10px;flex-wrap:wrap">
        <button class="btn g sm" id="claim-zp" style="flex:1">+ ЗП (${fmtI(salAmt)})</button>
        <button class="btn g sm" id="claim-adv" style="flex:1">+ Аванс (${fmtI(advAmt)})</button>
        <button class="btn v sm" id="claim-bonus" style="flex:1">+ Премия</button>
      </div>
      <div class="b-row"><div class="b-key">Остаток на сегодня</div><div class="b-val" style="color:${dayCol}">${fmt(remainToday)} ₽ <span style="opacity:.5;font-size:10px">/ ${fmt(dailyBudget)}</span></div></div>
      <div class="b-row"><div class="b-key">Потрачено сегодня</div><div class="b-val">${fmt(todaySpent)} ₽</div></div>
      <div class="b-row"><div class="b-key">Регуляр. расходы за месяц</div><div class="b-val" style="color:${spentMonth>budgetCap?'var(--red)':'var(--orange)'}">${fmt(spentMonth)} / ${fmtI(budgetCap)} ₽</div></div>
      <div class="b-row"><div class="b-key">Обязательные за месяц</div><div class="b-val" style="color:var(--orange)">${fmt(mandatorySpent)} ₽${mandForecast>0?` <span style="font-size:10px;color:var(--muted)">/ ~${fmtI(mandForecast)} прогноз</span>`:''}</div></div>
      <details><summary>⚙ Настройки бюджета и сумм ЗП/Аванса</summary>
        <div class="g3" style="margin-top:8px">
          <div class="ig"><label class="lbl">Лимит на жизнь/мес</label><input type="number" id="budcap" value="${budgetCap}"></div>
          <div class="ig"><label class="lbl">Стандарт ЗП (5-е)</label><input type="number" id="cfg-sal" value="${salAmt}"></div>
          <div class="ig"><label class="lbl">Стандарт Аванс (20-е)</label><input type="number" id="cfg-adv" value="${advAmt}"></div>
        </div>
        <button class="btn c full" id="bud-save">Сохранить параметры</button>
      </details>`;
    c.appendChild(budCard);

    budCard.querySelector('#claim-zp').onclick = () => this._openQuickActionModal({ type:'income', category:'ЗП', amount:salAmt, comment:'Зарплата (5 число)' });
    budCard.querySelector('#claim-adv').onclick = () => this._openQuickActionModal({ type:'income', category:'Аванс', amount:advAmt, comment:'Аванс (20 число)' });
    budCard.querySelector('#claim-bonus').onclick = () => this._openQuickActionModal({ type:'income', category:'Премия', amount:'', comment:'Премия (15 раб. день)' });

    budCard.querySelector('#bud-save').onclick=async()=>{
      const cap=parseMoney(budCard.querySelector('#budcap').value);
      const sVal=parseMoney(budCard.querySelector('#cfg-sal').value);
      const aVal=parseMoney(budCard.querySelector('#cfg-adv').value);
      if(cap>0) await this.db.setCfg('monthlyBudgetCap',cap);
      if(sVal>0) await this.db.setCfg('salaryAmount',sVal);
      if(aVal>0) await this.db.setCfg('advanceAmount',aVal);
      this._render();
    };

    // 3. MANDATORY PAYMENTS
    {
      const mandCard=this._card();
      const catEntries=Object.entries(mandByCat).sort((a,b)=>b[1]-a[1]);
      const forecastNote=mandForecast>0?`<div style="display:flex;justify-content:space-between;font-size:10px;margin-top:4px"><span style="color:var(--muted)">Прогноз след. месяца</span><span style="color:var(--orange);font-weight:700">~${fmt(mandForecast)} ₽</span></div>`:'';
      const trendDir=mandAvgMonths.length>=2?(mandatorySpent>mandAvgMonths[0]?'↑ растут':'↓ ниже среднего'):'';
      mandCard.innerHTML=`<div class="card-title">Обязательные платежи</div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
          <div style="font-size:20px;font-weight:800;color:var(--orange)">${fmt(mandatorySpent)} ₽</div>
          <div style="font-size:10px;color:var(--muted)">${trendDir}</div>
        </div>
        ${forecastNote}
        ${catEntries.length?`<div style="margin-top:10px">
          ${catEntries.map(([cat,amt])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11px">
            <span style="color:#9ab8cc">${cat}</span>
            <span style="color:var(--orange);font-weight:700">${fmt(amt)} ₽</span>
          </div>`).join('')}
        </div>`:
        `<div style="font-size:11px;color:var(--muted);text-align:center;padding:8px 0">Нет обязательных платежей в этом месяце</div>`}
        ${mandTxs.length?`<details style="margin-top:8px"><summary style="font-size:10px;color:var(--muted)">📋 Все транзакции (${mandTxs.length})</summary>
          <div style="margin-top:6px">
            ${[...mandTxs].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(t=>`
              <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:10px">
                <span style="color:#8090a0">${dStr(t.date)} · ${t.category}${t.comment?' · '+t.comment:''}</span>
                <span style="color:var(--orange);font-weight:700;flex-shrink:0;margin-left:8px">−${fmt(t.amount)} ₽</span>
              </div>`).join('')}
          </div>
        </details>`:''}`;
      c.appendChild(mandCard);
    }

    // 4. MINI GOALS
    if(goals.length){
      const gCard=this._card();
      gCard.innerHTML='<div class="card-title">Активные цели</div>';
      goals.sort((a,b)=>a.priority-b.priority).forEach(goal=>{
        const saved=txs.filter(t=>t.type==='expense'&&((t.category==='Цель'&&t.comment===goal.name)||(t.category==='Цель/Долг'&&t.comment===goal.name))).reduce((s,t)=>s+t.amount,0);
        const pct=Math.min(100,(saved/goal.targetAmount)*100);
        const left=Math.max(0,goal.targetAmount-saved);
        const dLeft=Math.ceil((new Date(goal.deadline)-now)/86400000);
        const col=goal.color||'#00f0ff';
        gCard.insertAdjacentHTML('beforeend',`<div class="goal-mini">
          <div class="goal-mini-title"><span style="color:${col};font-weight:700">${goal.name}</span><span style="font-size:10px;color:var(--muted)">${pct.toFixed(0)}% · ост. ${fmt(left)} ₽ · ${dLeft>0?dLeft+' дн.':'⏰'}</span></div>
          <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${col}"></div></div>
        </div>`);
      });
      c.appendChild(gCard);
    }

    // 5. INLINE NEW TRANSACTION CARD (WITH EXPRESSIONS & CLIPBOARD PARSER)
    const txCard=this._card();
    const allGoals=(await this.db.all(S.GOALS)).filter(g=>g.active);
    txCard.innerHTML=`
      <div class="card-title">
        <span>Новая транзакция</span>
        <button class="btn c sm" id="tx-paste-btn">📋 Из буфера Сбера</button>
      </div>
      <div class="ig"><label class="lbl">Тип</label><select id="tx-type"><option value="expense">Расход</option><option value="income">Доход</option></select></div>
      <div class="g2">
        <div class="ig"><label class="lbl">Сумма (можно 300+150)</label><input type="text" inputmode="decimal" id="tx-amt" placeholder="0.00"></div>
        <div class="ig"><label class="lbl">Категория</label><select id="tx-cat"></select></div>
      </div>
      <div class="g2">
        <div class="ig"><label class="lbl">Дата</label><input type="date" id="tx-date" value="${todayStr}"></div>
        <div class="ig"><label class="lbl">Комментарий</label><input type="text" id="tx-comment" placeholder="Необязательно"></div>
      </div>
      <div id="mandatory-wrap" style="display:none">
        <label class="mandatory-row" id="mand-row">
          <div class="mandatory-toggle"><input type="checkbox" id="tx-mandatory"><span class="mandatory-knob"></span></div>
          <div>
            <div class="mandatory-lbl">Обязательный платёж</div>
            <div class="mandatory-sub">Идёт в отдельный трекер, не влияет на дневной лимит</div>
          </div>
        </label>
      </div>
      <button class="btn c full" id="tx-add">Добавить транзакцию</button>`;
    c.appendChild(txCard);

    const typeEl=txCard.querySelector('#tx-type');
    const catEl=txCard.querySelector('#tx-cat');
    const mandWrap=txCard.querySelector('#mandatory-wrap');
    const mandRow=txCard.querySelector('#mand-row');
    const mandCb=txCard.querySelector('#tx-mandatory');

    const fillCats=()=>{
      const isExp=typeEl.value==='expense';
      mandWrap.style.display=isExp?'block':'none';
      if(!isExp){mandCb.checked=false;mandRow.classList.remove('on');}
      if(isExp){
        let html=CAT_EXP.map(x=>`<option value="${x}">${x}${MANDATORY_CATS_HINT.has(x)?' ★':''}</option>`).join('');
        if(allGoals.length){html+='<option disabled>── Цели ──</option>';allGoals.forEach(g=>{html+=`<option value="ЦЕЛЬ:${g.name}">🎯 ${g.name}</option>`;});}
        catEl.innerHTML=html;
      } else {
        catEl.innerHTML=CAT_INC.map(x=>`<option value="${x}">${x}</option>`).join('');
      }
    };
    fillCats();
    typeEl.onchange=fillCats;
    mandCb.onchange=()=>mandRow.classList.toggle('on',mandCb.checked);

    txCard.querySelector('#tx-paste-btn').onclick = async () => {
      try {
        const clip = await navigator.clipboard.readText();
        const parsed = parseSberText(clip);
        if(parsed && parsed.amount > 0){
          txCard.querySelector('#tx-amt').value = parsed.amount;
          typeEl.value = 'expense'; fillCats();
          catEl.value = parsed.category;
          txCard.querySelector('#tx-comment').value = parsed.comment;
          mandCb.checked = !!parsed.isMandatory;
          mandRow.classList.toggle('on', mandCb.checked);
          showInlineMsg(txCard, `✓ Распознано: ${parsed.amount} ₽ → ${parsed.category}`);
        } else {
          this._openQuickActionModal();
        }
      } catch (_) {
        this._openQuickActionModal();
      }
    };

    txCard.querySelector('#tx-add').onclick=async()=>{
      const amt=parseMoney(txCard.querySelector('#tx-amt').value);
      if(!amt||amt<=0) return;
      const type=typeEl.value;
      let cat=catEl.value, comment=txCard.querySelector('#tx-comment').value.trim();
      const dt=txCard.querySelector('#tx-date').value||todayStr;
      const isMandatory=type==='expense'&&mandCb.checked;
      if(cat.startsWith('ЦЕЛЬ:')){comment=cat.substring(5);cat='Цель';}
      await this.db.add(S.TX,{amount:amt,type,category:cat,comment,date:new Date(dt+'T12:00:00').toISOString(),isMandatory:isMandatory||false});
      let bal=await this.db.cfg('balance');
      await this.db.setCfg('balance',type==='income'?bal+amt:bal-amt);
      this._render();
    };

    await this._renderTxHistory(c, txs, goals);
  }

  async _renderTxHistory(c, txs, goals){
    const histCard=this._card();
    const allCats=[...new Set([...CAT_EXP,...CAT_INC,'Цель'])];

    histCard.innerHTML=`<div class="card-title">История операций</div>
      <div class="tx-filter-bar">
        <div class="tx-filter-row">
          <input type="text" id="tx-q" placeholder="🔍 Поиск по категории или комментарию..." style="flex:1">
        </div>
        <div class="tx-filter-row">
          <select id="tx-fc" style="flex:1">
            <option value="">Все категории</option>
            ${allCats.map(x=>`<option value="${x}">${x}</option>`).join('')}
          </select>
          <select id="tx-ft" style="flex:0 0 auto;min-width:100px">
            <option value="">Все</option>
            <option value="income">Доходы</option>
            <option value="expense">Расходы</option>
            <option value="mandatory">Обязательные</option>
          </select>
        </div>
        <div class="tx-filter-row">
          <span class="filter-label">С</span>
          <input type="date" id="tx-from" style="flex:1;min-width:90px">
          <span class="filter-label">До</span>
          <input type="date" id="tx-to" style="flex:1;min-width:90px" value="${today()}">
        </div>
        <div class="tx-filter-row">
          <span class="filter-label" style="margin-right:4px">Сорт:</span>
          <button class="tx-sort-btn ${this._txSort==='date_desc'?'active':''}" data-s="date_desc">↓ Дата</button>
          <button class="tx-sort-btn ${this._txSort==='date_asc'?'active':''}" data-s="date_asc">↑ Дата</button>
          <button class="tx-sort-btn ${this._txSort==='amt_desc'?'active':''}" data-s="amt_desc">↓ Сумма</button>
          <button class="tx-sort-btn ${this._txSort==='amt_asc'?'active':''}" data-s="amt_asc">↑ Сумма</button>
        </div>
      </div>
      <div id="tx-stats-row" style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap"></div>
      <div id="tx-list"></div>
      <div id="tx-page-bar" class="tx-page-bar"></div>
      <div id="tx-count-line" class="tx-count-line"></div>`;
    c.appendChild(histCard);

    const qEl=histCard.querySelector('#tx-q');
    const fcEl=histCard.querySelector('#tx-fc');
    const ftEl=histCard.querySelector('#tx-ft');
    const fromEl=histCard.querySelector('#tx-from');
    const toEl=histCard.querySelector('#tx-to');
    qEl.value=this._txSearch||'';
    fcEl.value=this._txCat||'';
    ftEl.value=this._txType||'';
    fromEl.value=this._txDateFrom||'';
    toEl.value=this._txDateTo||today();

    const getFiltered=()=>{
      let fil=[...txs];
      const q=(this._txSearch||'').toLowerCase();
      if(q) fil=fil.filter(t=>(t.comment||'').toLowerCase().includes(q)||t.category.toLowerCase().includes(q));
      if(this._txCat) fil=fil.filter(t=>t.category===this._txCat);
      if(this._txType==='income') fil=fil.filter(t=>t.type==='income');
      else if(this._txType==='expense') fil=fil.filter(t=>t.type==='expense'&&!t.isMandatory);
      else if(this._txType==='mandatory') fil=fil.filter(t=>t.isMandatory);
      if(this._txDateFrom){const d=new Date(this._txDateFrom+'T00:00:00');fil=fil.filter(t=>new Date(t.date)>=d);}
      if(this._txDateTo){const d=new Date(this._txDateTo+'T23:59:59');fil=fil.filter(t=>new Date(t.date)<=d);}
      if(this._txSort==='date_desc') fil.sort((a,b)=>new Date(b.date)-new Date(a.date));
      else if(this._txSort==='date_asc') fil.sort((a,b)=>new Date(a.date)-new Date(b.date));
      else if(this._txSort==='amt_desc') fil.sort((a,b)=>b.amount-a.amount);
      else if(this._txSort==='amt_asc') fil.sort((a,b)=>a.amount-b.amount);
      return fil;
    };

    const renderList=()=>{
      const fil=getFiltered();
      const listEl=histCard.querySelector('#tx-list');
      const pageBar=histCard.querySelector('#tx-page-bar');
      const countLine=histCard.querySelector('#tx-count-line');
      const statsRow=histCard.querySelector('#tx-stats-row');
      listEl.innerHTML=''; pageBar.innerHTML=''; countLine.textContent=''; statsRow.innerHTML='';

      if(!fil.length){listEl.innerHTML='<div style="color:var(--muted);text-align:center;padding:16px">Нет операций</div>';return;}

      const fInc=fil.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
      const fExp=fil.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
      statsRow.innerHTML=`
        <span style="font-size:10px;color:var(--green)">+${fmt(fInc)} ₽ доходов</span>
        <span style="font-size:10px;color:var(--red)">−${fmt(fExp)} ₽ расходов</span>
        <span style="font-size:10px;color:var(--muted)">${fil.length} опер.</span>`;

      const shown=fil.slice(0,this._txShown);
      shown.forEach(tx=>{
        const row=document.createElement('div'); row.className='log-row';
        const del=document.createElement('button'); del.className='del-btn'; del.textContent='×';
        const mandBadge=tx.isMandatory?'<span class="mandatory-badge">ОБЯЗ</span>':'';
        row.innerHTML=`<div style="min-width:0;flex:1">
          <span class="badge">${tx.category}</span>${mandBadge}
          <div class="log-meta">${dStr(tx.date)}${tx.comment?' · '+tx.comment:''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <span class="amt ${tx.type==='income'?'i':'e'}">${tx.type==='income'?'+':'−'}${fmt(tx.amount)} ₽</span>
        </div>`;
        row.querySelector('div:last-child').appendChild(del);
        del.onclick=()=>confirmDel(del,async()=>{
          del._ok=true;
          await this.db.del(S.TX,tx.id);
          let bal=await this.db.cfg('balance');
          await this.db.setCfg('balance',tx.type==='income'?bal-tx.amount:bal+tx.amount);
          this._render();
        });
        listEl.appendChild(row);
      });

      countLine.textContent=`Показано ${Math.min(this._txShown,fil.length)} из ${fil.length}`;
      if(fil.length>this._txShown){
        const rem=fil.length-this._txShown;
        const next30=Math.min(30,rem);
        const btnMore=document.createElement('button');
        btnMore.className='tx-page-btn';
        btnMore.textContent=`↓ Ещё ${next30}`;
        btnMore.onclick=()=>{this._txShown+=30;renderList();};
        pageBar.appendChild(btnMore);
      } else if(this._txShown>15){
        const btnCollapse=document.createElement('button');
        btnCollapse.className='tx-page-btn';
        btnCollapse.textContent='↑ Свернуть';
