<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sentinel OS">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Sentinel OS: Carbon AMOLED v9</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  color-scheme:dark;
  --bg:#000000;
  --card:rgba(12,15,24,.94);
  --card-hi:rgba(18,23,36,.96);
  --border:rgba(0,240,255,.16);
  --cyan:#00f0ff;
  --violet:#9b4dff;
  --green:#00ff95;
  --red:#ff4d5e;
  --orange:#ffa040;
  --yellow:#ffeb40;
  --text:#eaf2fa;
  --muted:#7890a5;
}
html,body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif;font-size:14px;min-height:100%;overflow-x:hidden}
body{
  background-image:
    radial-gradient(circle at 10% 0%, rgba(0,240,255,.06) 0%, transparent 40%),
    radial-gradient(circle at 90% 10%, rgba(155,77,255,.06) 0%, transparent 40%);
  padding-bottom:calc(env(safe-area-inset-bottom) + 92px);
}

@keyframes logo-flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.logo{font-size:13px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#00f0ff,#9b4dff,#00ff95,#00f0ff);background-size:300%;animation:logo-flow 6s ease infinite;-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}

/* HEADER — TWO-ROW NON-OVERLAPPING LAYOUT */
#app-header{
  position:sticky;top:0;z-index:100;
  background:rgba(0,0,0,.9);
  border-bottom:1px solid rgba(0,240,255,.14);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:8px 12px 9px;
  padding-top:calc(8px + env(safe-area-inset-top));
}
.header-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}
.header-acts{display:flex;gap:6px;flex-shrink:0;align-items:center}
.hdr-btn{
  background:rgba(0,240,255,.1);border:1px solid rgba(0,240,255,.28);
  border-radius:10px;color:var(--cyan);padding:6px 10px;font-size:11px;
  font-weight:700;cursor:pointer;letter-spacing:.2px;line-height:1.1;
  display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
}
.hdr-btn:active{transform:scale(.96);background:rgba(0,240,255,.22)}
.header-pills{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;
}
.hdr-pill{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
  border-radius:11px;padding:5px 8px;font-size:10.5px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;
  user-select:none;
}
.hdr-pill:active{background:rgba(0,240,255,.12);border-color:var(--cyan)}

/* BOTTOM NAVIGATION */
#bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(4,6,12,.95);
  border-top:1px solid rgba(0,240,255,.16);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-around;align-items:center;
  box-shadow:0 -8px 30px rgba(0,0,0,.8);
}
.nav-item{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:4px 1px;cursor:pointer;color:var(--muted);
  font-size:8.5px;font-weight:700;letter-spacing:0;transition:color .18s;user-select:none;
  border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nav-item .nav-ico{font-size:16px;line-height:1;transition:transform .18s}
.nav-item.active{color:var(--cyan);text-shadow:0 0 10px rgba(0,240,255,.4)}
.nav-item.active .nav-ico{transform:translateY(-2px) scale(1.08)}
.nav-fab{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  color:#000;font-size:22px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 18px rgba(0,240,255,.45);
  cursor:pointer;flex-shrink:0;margin:0 2px;border:none;
}
/* AI Advisor & Token Chips */
.ai-score-ring{
  width:58px;height:58px;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-weight:900;flex-shrink:0;
  border:3px solid var(--cyan);box-shadow:0 0 16px rgba(0,240,255,.25);
  background:rgba(0,240,255,.06);
}
.ai-insight{
  background:rgba(255,255,255,.03);border-left:3px solid var(--cyan);
  border-radius:0 11px 11px 0;padding:9px 11px;margin-bottom:7px;font-size:11px;line-height:1.45;
}
.ai-insight.warn{border-left-color:var(--orange);background:rgba(255,160,64,.06)}
.ai-insight.bad{border-left-color:var(--red);background:rgba(255,77,94,.06)}
.ai-insight.ok{border-left-color:var(--green);background:rgba(0,255,149,.06)}
.sms-token{
  display:inline-block;padding:5px 9px;margin:3px;border-radius:9px;
  background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.25);
  color:var(--text);font-size:11.5px;font-weight:700;cursor:pointer;user-select:none;
}
.sms-token.sel{background:var(--cyan);color:#000;border-color:var(--cyan);box-shadow:0 0 10px rgba(0,240,255,.4)}
.nav-fab:active{transform:scale(.92)}

#app-content{padding:12px 12px 28px;max-width:600px;margin:0 auto}

.page-slide-left{animation:slideL .18s cubic-bezier(.16,1,.3,1)}
.page-slide-right{animation:slideR .18s cubic-bezier(.16,1,.3,1)}
@keyframes slideL{from{opacity:.4;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.4;transform:translateX(-16px)}to{opacity:1;transform:none}}

/* CARDS & TYPOGRAPHY */
.card{
  background:var(--card);border:1px solid rgba(0,240,255,.12);
  border-radius:18px;padding:14px;margin-bottom:12px;
  position:relative;overflow:hidden;
  box-shadow:0 6px 24px rgba(0,0,0,.5);
}
.card.danger{border-color:rgba(255,77,94,.45);box-shadow:0 0 20px rgba(255,77,94,.1)}
.card.glow{border-color:rgba(0,240,255,.28);box-shadow:0 0 22px rgba(0,240,255,.07)}
.card-title{
  font-size:10.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--cyan);border-left:3px solid var(--cyan);padding-left:8px;
  margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
}

.big{font-size:28px;font-weight:900;color:var(--cyan);letter-spacing:-.8px;line-height:1.1}
.big.ok{color:var(--green)}.big.warn{color:var(--orange)}.big.bad{color:var(--red)}
.sub{font-size:11px;color:var(--muted);margin-top:4px}
.lbl{display:block;font-size:10.5px;color:var(--muted);margin-bottom:5px;font-weight:600;letter-spacing:.3px}

/* INPUTS & DATE PICKER FIXES */
input:not([type=checkbox]):not([type=range]),select,textarea{
  width:100%;padding:11px 12px;background:#070910;
  border:1px solid rgba(0,240,255,.22);border-radius:12px;
  color:var(--text);font-size:14px;outline:none;font-family:inherit;
  transition:border-color .18s,box-shadow .18s;
}
input[type=date]{
  -webkit-appearance:auto;appearance:auto;
  color-scheme:dark;cursor:pointer;min-height:42px;
}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--cyan) 50%),linear-gradient(135deg,var(--cyan) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(0,240,255,.15)}
select option{background:#0b0d17;color:var(--text)}
textarea{resize:vertical;min-height:76px;line-height:1.5}
.ig{margin-bottom:10px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 14px;font-size:12px;font-weight:700;border-radius:12px;
  cursor:pointer;border:1px solid;font-family:inherit;transition:all .15s;
  white-space:nowrap;letter-spacing:.2px;user-select:none;
}
.btn:active{transform:scale(.97)}
.btn.c{background:rgba(0,240,255,.12);border-color:var(--cyan);color:var(--cyan)}
.btn.v{background:rgba(155,77,255,.15);border-color:var(--violet);color:#d2b8ff}
.btn.g{background:rgba(0,255,149,.12);border-color:rgba(0,255,149,.45);color:var(--green)}
.btn.o{background:rgba(255,160,64,.12);border-color:rgba(255,160,64,.45);color:var(--orange)}
.btn.r{background:rgba(255,77,94,.12);border-color:rgba(255,77,94,.4);color:#ff7a85}
.btn.full{width:100%;margin-top:8px}
.btn.sm{padding:6px 10px;font-size:10.5px;border-radius:9px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media (max-width:360px){
  .g3{grid-template-columns:1fr 1fr}
}

.stat{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:10px 8px;text-align:center}
.stat .v{font-size:14px;font-weight:800;color:var(--cyan);margin-bottom:3px}
.stat .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* DUAL ACCOUNT BOXES */
.acc-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.acc-box{
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);
  border-radius:14px;padding:11px 12px;cursor:pointer;transition:border-color .15s;
}
.acc-box:active{border-color:var(--cyan);background:rgba(0,240,255,.06)}
.acc-box.sav{border-color:rgba(155,77,255,.3);background:rgba(155,77,255,.05)}
.acc-box.crd{border-color:rgba(0,240,255,.25);background:rgba(0,240,255,.04)}
.acc-lbl{font-size:10px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.acc-val{font-size:17px;font-weight:900;margin-top:4px;letter-spacing:-.3px}

/* CHIPS & PRESETS */
.chips-scroll{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}
.chips-scroll::-webkit-scrollbar{display:none}
.q-chip{
  flex:0 0 auto;padding:7px 11px;border-radius:11px;
  background:rgba(255,255,255,.04);border:1px solid rgba(0,240,255,.2);
  color:var(--text);font-size:11px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;user-select:none;
}
.q-chip:active,.q-chip.active{background:rgba(0,240,255,.18);border-color:var(--cyan);color:var(--cyan)}
.q-chip.fav{border-color:rgba(255,235,64,.4);background:rgba(255,235,64,.07)}
.q-chip.fav.active{background:rgba(255,235,64,.22);border-color:var(--yellow);color:var(--yellow)}

/* DATE QUICK PILLS & AMOUNT HELPER PILLS */
.mini-pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.mini-pill{
  padding:4px 9px;border-radius:8px;font-size:10px;font-weight:700;
  background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.2);
  color:var(--cyan);cursor:pointer;user-select:none;
}
.mini-pill:active{background:rgba(0,240,255,.22)}

/* SEGMENTED SWITCHER */
.seg-bar{
  display:flex;background:#070910;border:1px solid rgba(255,255,255,.09);
  border-radius:13px;padding:3px;margin-bottom:12px;gap:3px;overflow-x:auto;
}
.seg-btn{
  flex:1;text-align:center;padding:8px 6px;font-size:10.5px;font-weight:700;
  color:var(--muted);border-radius:10px;cursor:pointer;transition:all .15s;
  white-space:nowrap;user-select:none;
}
.seg-btn.active{background:rgba(0,240,255,.16);color:var(--cyan);box-shadow:0 2px 8px rgba(0,0,0,.5)}

/* PROGRESS & LOGS */
.prog-track{height:7px;background:rgba(255,255,255,.08);border-radius:7px;overflow:hidden;margin:7px 0 5px}
.prog-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .35s}

.log-row{padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center;gap:8px}
.log-row:last-child{border-bottom:none}
.log-meta{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.amt{font-size:13px;font-weight:800;white-space:nowrap}
.amt.i{color:var(--green)}.amt.e{color:var(--red)}.amt.t{color:#b99aff}
.badge{display:inline-block;padding:2px 8px;border-radius:7px;font-size:9.5px;font-weight:700;background:rgba(0,240,255,.11);color:var(--cyan);letter-spacing:.3px}
.badge.tr{background:rgba(155,77,255,.16);color:#d0b3ff}
.del-btn{background:none;border:1px solid rgba(255,80,80,.28);border-radius:8px;color:#ff6b78;font-size:13px;padding:4px 8px;cursor:pointer;flex-shrink:0;line-height:1}

/* GARAGE */
.wear-row{margin-bottom:13px;padding-bottom:13px;border-bottom:1px solid rgba(255,255,255,.06)}
.wear-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.wear-lbl{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px;color:#c2d2e0;align-items:center;gap:6px}
.wear-bar{height:6px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden}
.wear-fill{height:100%;border-radius:5px;transition:width .4s}

.pill{display:inline-block;padding:2px 7px;border-radius:6px;font-size:9px;font-weight:700;letter-spacing:.4px;margin-right:5px;flex-shrink:0}
.pill.crit{background:rgba(255,77,94,.15);color:var(--red);border:1px solid rgba(255,77,94,.3)}
.pill.warn{background:rgba(255,160,64,.12);color:var(--orange);border:1px solid rgba(255,160,64,.25)}
.pill.info{background:rgba(68,170,255,.1);color:#5af;border:1px solid rgba(68,170,255,.2)}

.b-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px;gap:8px}
.b-row:last-child{border-bottom:none}
.b-key{color:#8aa0b2;font-size:11px}
.b-val{font-weight:700;text-align:right}

/* HUB & RECIPES */
.recipe{background:rgba(255,255,255,.03);border:1px solid rgba(155,77,255,.2);border-radius:14px;padding:13px;margin-bottom:9px;cursor:pointer}
.recipe-hd{display:flex;justify-content:space-between;align-items:center}
.recipe-name{font-size:12px;font-weight:700}
.recipe-meta{font-size:10px;color:var(--muted);margin-top:3px}
.recipe-body{display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06);font-size:11px;color:#b8d0e0;line-height:1.7}
.recipe-body.open{display:block}
.recipe-body ol,.recipe-body ul{margin:5px 0 0;padding-left:18px}
.rsec{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--cyan);margin:8px 0 4px}

.tip{background:rgba(0,240,255,.05);border:1px solid rgba(0,240,255,.14);border-radius:12px;padding:11px 13px;margin-bottom:8px;font-size:11px;color:#b8d4e8;line-height:1.6}
.reminder{background:rgba(255,160,64,.09);border:1px solid rgba(255,160,64,.32);border-radius:12px;padding:11px;margin-bottom:10px;font-size:11.5px;color:var(--orange);line-height:1.5}
.reminder.red{background:rgba(255,77,94,.09);border-color:rgba(255,77,94,.35);color:#ff7b86}
.reminder.green{background:rgba(0,255,149,.08);border-color:rgba(0,255,149,.28);color:var(--green)}

/* 3D PRINT PRO STUDIO — STEP-BY-STEP & SPOOL CARDS */
.step-badge{
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(0,240,255,.15);color:var(--cyan);border:1px solid rgba(0,240,255,.35);
  border-radius:8px;padding:2px 8px;font-size:10px;font-weight:800;margin-right:6px;
}
.spool-card{
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);
  border-radius:14px;padding:12px;margin-bottom:9px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
}
.spool-card.active{border-color:var(--cyan);background:rgba(0,240,255,.07)}
.diff-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.diff-card{
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);
  border-radius:12px;padding:10px;cursor:pointer;transition:all .15s;
  display:flex;flex-direction:column;gap:3px;user-select:none;
}
.diff-card.active{border-color:var(--cyan);background:rgba(0,240,255,.12);box-shadow:0 0 14px rgba(0,240,255,.12)}
.diff-card .d-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800}
.diff-card .d-sub{font-size:9.5px;color:var(--muted);line-height:1.35}

.advisor-box{border-radius:14px;padding:12px;margin-top:10px;font-size:11px;line-height:1.55;border:1px solid}
.advisor-box.good{background:rgba(0,255,149,.07);border-color:rgba(0,255,149,.3);color:#b8ffe0}
.advisor-box.low{background:rgba(255,77,94,.08);border-color:rgba(255,77,94,.35);color:#ffb8c0}
.advisor-box.high{background:rgba(255,160,64,.08);border-color:rgba(255,160,64,.35);color:#ffe0b5}

.calc-result{background:#060810;border:1px solid rgba(0,240,255,.2);border-radius:14px;padding:13px;font-size:12px;line-height:1.8}
.calc-total{font-size:20px;font-weight:900;color:var(--cyan);margin-top:8px;border-top:1px solid rgba(0,240,255,.15);padding-top:8px;display:flex;justify-content:space-between;align-items:baseline}

/* COMPACT HORIZONTAL MONTHLY CHART (STATS) */
.h-chart-wrap{
  display:flex;align-items:flex-end;gap:10px;height:150px;
  padding:18px 6px 6px;overflow-x:auto;scrollbar-width:thin;
  background:rgba(255,255,255,.02);border-radius:14px;border:1px solid rgba(255,255,255,.06);
}
.h-col{flex:1;min-width:44px;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;cursor:pointer}
.h-bars{display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center;height:105px}
.h-bar{width:13px;border-radius:4px 4px 1px 1px;transition:height .35s;min-height:3px}
.h-bar.inc{background:linear-gradient(180deg,var(--green),rgba(0,255,149,.35))}
.h-bar.exp{background:linear-gradient(180deg,var(--red),rgba(255,77,94,.35))}
.h-lbl{font-size:9px;color:var(--muted);margin-top:6px;font-weight:700}
.h-net{font-size:8px;font-weight:700;margin-bottom:3px;white-space:nowrap}

.canvas-wrap{border-radius:14px;overflow:hidden;background:rgba(255,255,255,.02);margin-top:8px}
.canvas-wrap canvas{display:block;width:100%}

details{margin-top:8px}
details summary{font-size:11px;color:#82a6bb;cursor:pointer;user-select:none;padding:6px 0;list-style:none;font-weight:600}
details summary::before{content:'›';margin-right:6px;display:inline-block;transition:transform .2s}
details[open] summary::before{transform:rotate(90deg)}

.search-row{display:flex;gap:8px;margin-bottom:12px}
.search-row input{flex:1}
.search-row select{flex:0 0 auto;width:auto;min-width:110px}

.goal-mini{margin-bottom:12px}
.goal-mini-title{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;align-items:center}
.payday-tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;background:rgba(155,77,255,.16);border:1px solid rgba(155,77,255,.38);color:#d2b8ff}

.color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .2s;flex-shrink:0}
.color-dot.selected{border-color:white;box-shadow:0 0 8px rgba(255,255,255,.4)}

.hist-list{max-height:220px;overflow-y:auto;scrollbar-width:thin}

class DB {
  constructor(){ this.ready = this._open(); }
  _open(){
    return new Promise((res,rej)=>{
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        const mk = (n,opts,idx=[])=>{
          if (!db.objectStoreNames.contains(n)){
            const st = db.createObjectStore(n,opts);
            idx.forEach(([a,b])=>st.createIndex(a,b));
          }
        };
        mk(S.TX,    {keyPath:'id',autoIncrement:true},[['date','date'],['category','category']]);
        mk(S.GARAGE,{keyPath:'id',autoIncrement:true},[['date','date']]);
        mk(S.ODO,   {keyPath:'id',autoIncrement:true},[['date','date']]);
        mk(S.CFG,   {keyPath:'key'});
        mk(S.SVC,   {keyPath:'id',autoIncrement:true},[['key','key']]);
        mk(S.GOALS, {keyPath:'id',autoIncrement:true});
        mk(S.CARS,  {keyPath:'id',autoIncrement:true});
        mk(S.FIL,   {keyPath:'id',autoIncrement:true});
        mk(S.TPL,   {keyPath:'id',autoIncrement:true});
        mk(S.REC,    {keyPath:'id',autoIncrement:true});
        mk(S.CTASK,  {keyPath:'id',autoIncrement:true});
        mk(S.CPARTS, {keyPath:'id',autoIncrement:true});
        mk(S.LOANS,  {keyPath:'id',autoIncrement:true});
        mk(S.RULES,  {keyPath:'id',autoIncrement:true});
      };
      req.onsuccess = e => { this.db=e.target.result; this._seed().then(res).catch(rej); };
      req.onerror   = e => rej(e.target.error);
    });
  }
  async _seed(){
    for(const [k,v] of Object.entries(DEFAULTS)){
      if(await this.get(S.CFG,k)===null) await this.set(S.CFG,{key:k,value:v});
    }

    const cars = await this.all(S.CARS);
    if(cars.length === 0) {
      const legacyGlobalOdo = await this.cfg('currentOdometer');
      const carId = await this.add(S.CARS, { name: 'Мой Автомобиль', odo: legacyGlobalOdo || 247915 });
      let svcs = await this.all(S.SVC);
      if (svcs.length > 0) {
        for (const s of svcs) { if (!s.car_id) { s.car_id = carId; await this.set(S.SVC, s); } }
      } else {
        for (const it of GENERIC_SVC_ITEMS) {
          await this.add(S.SVC, {...it, lastServiceOdo:0, conditionStatus:'ok', enabled:true, car_id: carId});
        }
      }
      const odos = await this.all(S.ODO);
      for (const o of odos) { if(!o.car_id){ o.car_id = carId; await this.set(S.ODO, o); } }
      const logs = await this.all(S.GARAGE);
      for (const lg of logs) { if(!lg.car_id){ lg.car_id = carId; await this.set(S.GARAGE, lg); } }
    }
    const fils = await this.all(S.FIL);
    if(fils.length === 0){
      for(const f of DEFAULT_FILAMENTS) await this.add(S.FIL, f);
    }
    const tpls = await this.all(S.TPL);
    if(tpls.length === 0){
      for(const t of DEFAULT_TEMPLATES) await this.add(S.TPL, t);
    }
    const recs = await this.all(S.REC);
    if(recs.length === 0){
      for(const r of RECIPES) await this.add(S.REC, r);
    }
  }
  _st(n,m='readonly'){return this.db.transaction(n,m).objectStore(n);}
  get(s,k){return new Promise((r,e)=>{const q=this._st(s).get(k);q.onsuccess=()=>r(q.result!==undefined?q.result:null);q.onerror=()=>e(q.error);});}
  set(s,o){return new Promise((r,e)=>{const q=this._st(s,'readwrite').put(o);q.onsuccess=()=>r();q.onerror=()=>e(q.error);});}
  add(s,o){return new Promise((r,e)=>{const q=this._st(s,'readwrite').add(o);q.onsuccess=()=>r(q.result);q.onerror=()=>e(q.error);});}
  all(s){return new Promise((r,e)=>{const q=this._st(s).getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>e(q.error);});}
  del(s,k){return new Promise((r,e)=>{const q=this._st(s,'readwrite').delete(k);q.onsuccess=()=>r();q.onerror=()=>e(q.error);});}
  async cfg(k){const r=await this.get(S.CFG,k);return r!==null?r.value:DEFAULTS[k];}
  async setCfg(k,v){await this.set(S.CFG,{key:k,value:v});}

  async adjustAccountBalance(type, amount, account='card', transferDir='', reverse=false){
    let bal = Number(await this.cfg('balance')) || 0;
    const sign = reverse ? -1 : 1;
    const amt = Number(amount) || 0;
    if(type === 'income') bal = +(bal + sign * amt).toFixed(2);
    else if(type === 'expense') bal = +(bal - sign * amt).toFixed(2);
    await this.setCfg('balance', bal);
    return { total: bal };
  }

  async getCats(type = 'expense') {
    const key = type === 'income' ? 'customCatsInc' : 'customCatsExp';
    const base = type === 'income' ? CAT_INC : CAT_EXP;
    const saved = await this.get(S.CFG, key);
    if (saved && Array.isArray(saved.value) && saved.value.length > 0) {
      return saved.value;
    }
    return [...base];
  }

  async saveCats(type, list) {
    const key = type === 'income' ? 'customCatsInc' : 'customCatsExp';
    await this.setCfg(key, list);
  }

  async getSortedCatsWithFreq(type = 'expense', txs = null) {
    const cats = await this.getCats(type);
    const allTxs = txs || await this.all(S.TX);
    const counts = {};
    allTxs.forEach(t => {
      if (t.type === type && t.category) {
        counts[t.category] = (counts[t.category] || 0) + 1;
      }
    });
    const sorted = [...cats].sort((a, b) => (counts[b] || 0) - (counts[a] || 0));
    return { sorted, counts, raw: cats };
  }
}

  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const dateOffsetStr = (daysOffset) => {
  const d = new Date();
  d.setDate(d.getDate() + daysOffset);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const wCol  = p => p<60?'#00f0ff':p<85?'#ffa040':'#ff4d5e';
const cCol  = c => ({ok:'#00ff95',watch:'#ffa040',replace:'#ff8040',critical:'#ff4d5e'}[c]||'#00ff95');
const isCondOnly = it => !!(it.condOnly || it.conditionOnly);

function parseMoney(value) {
  if (value === undefined || value === null) return 0;
  let str = String(value).replace(/,/g, '.').replace(/\s+/g, '').trim();
  if (!str) return 0;
  if (/^[0-9.+\-*/()]+$/.test(str)) {
    try {
      const res = Function('"use strict";return (' + str + ')')();
      if (typeof res === 'number' && isFinite(res)) return Math.round(res * 100) / 100;
    } catch (_) {}
  }
  const num = parseFloat(str);
  return isNaN(num) ? 0 : num;
}

// Upgraded Smart Sberbank SMS / Push / Statement Parser
function parseSberText(raw, userRules = []) {
  if (!raw || typeof raw !== 'string') return null;
  let text = raw.trim();
  if (!text) return null;

  // Extract date if present (e.g. 17.10.2026 or 17.10.26)
  let dateISO = today();
  const dateMatch = text.match(/\b(\d{2})\.(\d{2})\.(20\d{2}|\d{2})\b/);
  if (dateMatch) {
    const dd = dateMatch[1], mm = dateMatch[2];
    const yyyy = dateMatch[3].length === 2 ? '20' + dateMatch[3] : dateMatch[3];
    dateISO = `${yyyy}-${mm}-${dd}`;
  }

  // Clean noise that confuses sum extraction: card masks (****8609, MIR-8609, •• 8609), dates, times (13:43), balance tail, 6-digit auth codes
  let cleanForSum = text
    .replace(/(?:остаток|баланс|доступно)[:\s]*[\d\s]+[.,]?\d*\s*(?:₽|р\.?|руб\.?|RUB)?/gi, ' ')
    .replace(/(?:накопительный\s+сч[её]т|сч[её]т|карта|mir|мир|visa|mc|сберкарта)[\s*•\-№]*\d{4}/gi, ' ')
    .replace(/[*•]+\s*\d{4}\b/g, ' ')
    .replace(/\b\d{2}\.\d{2}\.(?:20\d{2}|\d{2})\b/g, ' ')
    .replace(/\b\d{2}:\d{2}(?::\d{2})?\b/g, ' ')
    .replace(/\b\d{6}\b/g, ' ');

  let amount = 0;
  const sumRub = cleanForSum.match(/([+-]?\s*\d[\d\s]*[.,]\d{2}|\d[\d\s]*)\s*(?:₽|р\.?|руб\.?|RUB)/i)
              || cleanForSum.match(/(?:покупка|списание|оплата|перевод|сумма|зачисление|внесение)[:\s]*([+-]?\s*\d[\d\s]*[.,]?\d*)/i)
              || cleanForSum.match(/([+-]?\d[\d\s]*[.,]\d{2})\b/)
              || cleanForSum.match(/\b(\d+(?:[.,]\d+)?)\b/);
  if (sumRub) {
    amount = Math.abs(parseMoney(sumRub[1]));
  }

  const low = text.toLowerCase();
  let type = 'expense';
  let category = 'Другое';
  let isMandatory = false;
  let transferDir = 'savings_to_card';
  let comment = '';

  // 1. Check user-defined custom SMS rules first!
  let matchedCustomRule = null;
  if (Array.isArray(userRules) && userRules.length > 0) {
    for (const r of userRules) {
      if (r.keyword && low.includes(r.keyword.toLowerCase())) {
        matchedCustomRule = r;
        break;
      }
    }
  }
  if (matchedCustomRule) {
    type = matchedCustomRule.type || 'expense';
    category = matchedCustomRule.category || 'Другое';
    isMandatory = !!matchedCustomRule.isMandatory;
    comment = matchedCustomRule.comment || matchedCustomRule.keyword;
  } else if (/выплатили проценты|начисление процентов|проценты по сч|проценты по вкладу|капитализация/i.test(low)) {
    type = 'income';
    category = 'Проценты по вкладу';
    comment = 'Проценты по накопительному счёту';
  } else if (/заработная плата|зарплата/i.test(low)) {
    type = 'income';
    category = 'ЗП';
    comment = 'Заработная плата';
  } else if (/аванс/i.test(low)) {
    type = 'income';
    category = 'Аванс';
    comment = 'Аванс';
  } else if (/внесение наличных|банкомат.*\+/i.test(low)) {
    type = 'income';
    category = 'Пополнение наличными';
    comment = 'Внесение наличных через банкомат';
  } else if (/перевод на карту|входящий перевод|зачисление|\+\s*\d/i.test(low) && !/ozon|озон/i.test(low)) {
    type = 'income';
    category = 'Переводы';
    comment = /т-банк|тинькофф/i.test(low) ? 'Перевод СБП из Т-Банка' : 'Входящий перевод';
  } else if (/озон|ozon|wildberries|вб|wb|яндекс маркет|yandex market|aliexpress|алиэкспресс/i.test(low)) {
    category = 'Маркетплейсы';

  } else if (/rostics|ростикс|russkij appetit|русский аппетит|babashov|бабашов|pasta|паста|rest sovetskaya|рест советская|formula kofe|формула кофе|burger king|бургер кинг|vkusnoitochka|вкусно и точка|shaurma|шаурма|пекарня|кафе|ресторан|кофе|пицца|додо|хинкал|akvarel|vending/i.test(low)) {

    else if (/babashov|бабашов/i.test(low)) comment = 'ИП Бабашов (Шаурма / Кафе)';
    else if (/pasta|паста/i.test(low)) comment = 'Паста Тамбов';
    else if (/sovetskaya|советская/i.test(low)) comment = 'Рест Советская';
    else if (/formula kofe|формула кофе/i.test(low)) comment = 'Формула Кофе';
  } else if (/пятерочка|пятёрочка|pyaterochka|магнит|magnit|кб|красное\s*и?\s*белое|krasnoe&beloe|krasnoe|auchan|ашан|перекресток|лента|вкусвилл|begemot|бегемот|sladkiu|супермаркет|продукты/i.test(low)) {
    category = 'Еда';
    if (/krasnoe|красное/i.test(low)) comment = 'Красное & Белое';
    else if (/pyaterochka|пятерочка|пятёрочка/i.test(low)) comment = 'Пятёрочка';
    else if (/magnit|магнит/i.test(low)) comment = 'Магнит';
    else if (/auchan|ашан/i.test(low)) comment = 'Ашан';
  } else if (/rnazk|vnp|лукойл|роснефть|газпром|азс|бензин|топливо|татнефть/i.test(low)) {
    category = 'Бензин';
    isMandatory = true;
    comment = 'Заправка АЗС';
  } else if (/lukyanov|лукьянов|автодок|autodoc|автолайн|екзист|exist|dvizhok|движок|шиномонтаж|мойка|автозапчаст|ym auto/i.test(low)) {
    category = 'Авто';
    if (/lukyanov|лукьянов/i.test(low)) comment = 'ИП Лукьянов В.В. (Мойка / Авто)';
    else if (/autodoc|автодок/i.test(low)) comment = 'Autodoc (Запчасти)';
  } else if (/1000 melochej|1000 мелочей|kraski i krepe|краски и крепе|fixprice|фикс прайс|kemistroj|кемистрой|strojgrad|стройград|хоз|все для дома/i.test(low)) {
    category = 'Быт';
    if (/1000 melochej|1000 мелочей/i.test(low)) comment = '1000 Мелочей';
    else if (/kraski|краски/i.test(low)) comment = 'Магазин Краски и Крепёж';
  } else if (/new yorker|kari|кари|одежда|обувь/i.test(low)) {
    category = 'Одежда и обувь';
  } else if (/gosuslugi|госуслуги|штраф|гибдд|налог/i.test(low)) {
    category = 'Госуслуги и штрафы';
    comment = 'Госуслуги / Пошлина';
  } else if (/mapp_sberbank_onl@in_pay|mts|мтс|билайн|мегафон|теле2|t2|йота|ростелеком|связь|интернет/i.test(low)) {
    category = 'Моб. интернет';
    isMandatory = true;
    comment = 'Оплата связи / интернета';
  } else if (/аптека|apteka|врач|клиника|лекарств|здоровье/i.test(low)) {
    category = 'Здоровье';
    comment = 'Аптека';
  } else if (/жкх|квартплата|коммунал|электроэнерг|водоканал|газ/i.test(low)) {
    category = 'Коммуналка';
    isMandatory = true;
  } else if (/пластик|филамент|petg|pla|сопло|3d|принтер|elegoo|creality/i.test(low)) {
    category = '3D-расходники';
  } else if (/sbol|перевод с карты|перевод по сбп|перевод сбп/i.test(low)) {
    category = 'Переводы';
    comment = 'Перевод с карты (СберОнлайн)';
  }

  if (!comment) {
    comment = text.replace(/\s+/g, ' ').slice(0, 48);
  }
  return { amount, type, category, isMandatory, comment, dateISO, transferDir };
}

// --- PAYDAY SMART LOGIC ---
const RU_HOLIDAYS = [
  '01-01','01-02','01-03','01-04','01-05','01-06','01-07','01-08',
  '02-23','03-08','05-01','05-09','06-12','11-04'
];
function isHoliday(date) {
  const mm = String(date.getMonth() + 1).padStart(2, '0');
  const dd = String(date.getDate()).padStart(2, '0');
  return RU_HOLIDAYS.includes(`${mm}-${dd}`);
}
function isWorkingDay(date) {
  const dow = date.getDay();
  if (dow === 0 || dow === 6) return false;
  if (isHoliday(date)) return false;
  return true;
}
function getAdjustedDate(y, m, d) {
  let dt = new Date(y, m, d);
  while (!isWorkingDay(dt)) dt.setDate(dt.getDate() - 1);
  return dt;
}
function getNthWorkingDay(y, m, n) {
  let dt = new Date(y, m, 1);
  let count = 0;
  while (dt.getMonth() === m) {
    if (isWorkingDay(dt)) {
      count++;
      if (count === n) return new Date(dt);
    }
    dt.setDate(dt.getDate() + 1);
  }
  return new Date(y, m, 28);
}

function calcNextPayday(txs) {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const pDates = [
    { date: getAdjustedDate(y, m, 5), label: 'ЗП' },
    { date: getAdjustedDate(y, m, 20), label: 'Аванс' },
    { date: getNthWorkingDay(y, m, 15), label: 'Премия' },
    { date: getAdjustedDate(y, m + 1, 5), label: 'ЗП' },
    { date: getAdjustedDate(y, m + 1, 20), label: 'Аванс' },
    { date: getNthWorkingDay(y, m + 1, 15), label: 'Премия' }
  ].filter(p => {
    const pDayStart = new Date(p.date); pDayStart.setHours(0,0,0,0);
    const todayStart = new Date(now); todayStart.setHours(0,0,0,0);
    return pDayStart >= todayStart;
  }).sort((a, b) => a.date - b.date);

  const cutoff = new Date(now); cutoff.setDate(cutoff.getDate() - 30);
  const recentTxs = (txs || []).filter(t => t.type === 'income' && new Date(t.date) >= cutoff);

  for (const p of pDates) {
    const windowStart = new Date(p.date); windowStart.setDate(windowStart.getDate() - 4);
    const windowEnd = new Date(p.date); windowEnd.setDate(windowEnd.getDate() + 4);
    const alreadyPaid = recentTxs.some(t => {
      const td = new Date(t.date);
      return t.category.includes(p.label) && td >= windowStart && td <= windowEnd;
    });
    if (!alreadyPaid) {
      const days = Math.max(0, Math.ceil((p.date - now) / 86400000));
      return { date: p.date, days, label: p.label, allUpcoming: pDates.slice(0, 3) };
    }
  }
  const fallback = getAdjustedDate(y, m+1, 5);
  return { date: fallback, days: Math.max(1, Math.ceil((fallback - now) / 86400000)), label: 'ЗП', allUpcoming: pDates.slice(0, 3) };
}

function confirmDel(btn,cb){
  if(btn._c){cb();return;}
  btn._c=true; const orig=btn.textContent;
  btn.textContent='✓?'; btn.style.cssText+=';color:#ff4d5e;border-color:#ff4d5e';
  btn.onclick=()=>{btn._ok=true;cb();};
  setTimeout(()=>{if(!btn._ok){btn._c=false;btn.textContent=orig;btn.style.color='';btn.style.borderColor='';btn.onclick=()=>confirmDel(btn,cb);}},3000);
}

// --- PRO 3D CALCULATOR ENGINE ---
function calc3DProQuote(params) {
  const {
    weightG, timeHours, spoolPrice, spoolWeight, tierLevel,
    qty, batchMode, postProcFee, cadFee, scanFee = 0, isUrgent,
    hourRate, setupFee, minPrice, elecPerHour, amortPerHour, markupMult
  } = params;

  const tier = DIFF_TIERS[tierLevel] || DIFF_TIERS[2];
  const gramCost = (spoolPrice > 0 && spoolWeight > 0) ? (spoolPrice / spoolWeight) : 1.4;

  // If batchMode === 'batch', weightG and timeHours are ALREADY the total for the whole build plate!
  // If batchMode === 'single', weightG and timeHours are for 1 piece, so multiply by qty.
  const multQty = (batchMode === 'batch') ? 1 : Math.max(1, qty);
  const totalWeightG = weightG * multQty;
  const totalTimeHours = timeHours * multQty;
  const perPartWeightG = qty > 0 ? (totalWeightG / qty) : totalWeightG;

  const rawMaterialCost = totalWeightG * gramCost * (1 + tier.failRisk);
  const machineCost = totalTimeHours * (elecPerHour + amortPerHour);
  const nozzleWearCost = (totalWeightG / 100) * tier.nozzleWear;
  const totalCost = rawMaterialCost + machineCost + nozzleWearCost;

  const materialClient = (totalWeightG * gramCost * markupMult) * tier.mult;
  const timeClient = (totalTimeHours * hourRate) * tier.mult;

  let printWorkPrice = materialClient + timeClient;
  // Small part boost if each individual part is tiny (<35g)
  if (perPartWeightG > 0 && perPartWeightG <= 35) {
    const minSmallRate = tierLevel >= 3 ? 22 : 14;
    printWorkPrice = Math.max(printWorkPrice, totalWeightG * minSmallRate);
  }

  const extrasTotal = (postProcFee || 0) + (cadFee || 0) + (scanFee || 0);
  let batchSubtotal = printWorkPrice + setupFee + extrasTotal;
  if (qty >= 5) batchSubtotal *= 0.92;
  if (isUrgent) batchSubtotal *= 1.30;

  const minApplied = batchSubtotal < minPrice;
  const recPrice = Math.round(Math.max(batchSubtotal, minPrice) / 10) * 10;

  const corridorMin = Math.max(minPrice, Math.round((totalCost * 2.1 + setupFee + extrasTotal) / 10) * 10);
  const corridorMax = Math.max(corridorMin + 150, Math.round((recPrice * 1.25) / 10) * 10);

  return {
    tier,
    gramCost,
    totalWeightG,
    totalTimeHours,
    perPartWeightG,
    rawMaterialCost,
    machineCost: machineCost + nozzleWearCost,
    totalCost,
    extrasTotal,
    recPrice,
    corridorMin,
    corridorMax,
    minApplied
  };
}

function evaluatePriceHealth(customPrice, quote, totalWeightG, extrasTotal) {
  const netProfit = customPrice - quote.totalCost;
  const marginPct = customPrice > 0 ? Math.round((netProfit / customPrice) * 100) : 0;
  const printOnlyPrice = Math.max(0, customPrice - (extrasTotal || 0));
  const effRubPerGram = totalWeightG > 0 ? (printOnlyPrice / totalWeightG) : 0;

  let status = 'good';
  let title = '✅ Оптимальная цена';
  let advice = `Отличный баланс! Чистая прибыль составит ${fmtI(netProfit)} ₽ (маржа ${marginPct}%). Цена полностью покрывает амортизацию, свет и риск брака (${Math.round(quote.tier.failRisk*100)}%).`;

  if (customPrice < quote.totalCost * 1.35 || netProfit < 150) {
    status = 'low';
    title = '⚠️ Слишком низкая цена (Риск уйти в минус)';
    advice = `Внимание: чистая прибыль всего ${fmtI(netProfit)} ₽. Если деталь сорвёт со стола или потребуется перепечатка, заказ уйдёт в убыток. Рекомендуем минимум ${fmtI(quote.corridorMin)} ₽.`;
  } else if (customPrice > quote.corridorMax * 1.25 && totalWeightG > 50) {
    status = 'high';
    title = '🔥 Выше рынка (Премиум-наценка)';
    advice = `Ставка ~${effRubPerGram.toFixed(1)} ₽/г для веса ${Math.round(totalWeightG)}г выше средней. Если деталь сложная или срочная — цена оправдана, иначе оптимальный коридор: ${fmtI(quote.corridorMin)}–${fmtI(quote.corridorMax)} ₽.`;
  }

  return { status, title, advice, netProfit, marginPct, effRubPerGram };
}


// --- SENTINEL INTELLIGENCE ENGINE (DEEP FINANCIAL ANALYZER & ADVISOR) ---
function buildFinancialIntelligence(data) {
  const { balance, budgetCap, txs, goals, loans = [], svcItems = [], carOdo = 0 } = data;
  const now = new Date();
  const curY = now.getFullYear(), curM = now.getMonth();
  const mStart = new Date(curY, curM, 1);
  const daysInMonth = new Date(curY, curM + 1, 0).getDate();
  const dayOfMonth = Math.max(1, now.getDate());
  const daysLeftMonth = Math.max(1, daysInMonth - dayOfMonth + 1);

  const realTxs = (txs || []).filter(t => t.type === 'expense' || t.type === 'income');

  // 1. Current month metrics
  const mInc = realTxs.filter(t => t.type === 'income' && new Date(t.date) >= mStart).reduce((s, t) => s + t.amount, 0);
  const mExpAll = realTxs.filter(t => t.type === 'expense' && new Date(t.date) >= mStart && t.category !== 'Цель').reduce((s, t) => s + t.amount, 0);
  const mMand = realTxs.filter(t => t.type === 'expense' && t.isMandatory && new Date(t.date) >= mStart).reduce((s, t) => s + t.amount, 0);
  const mLifeExp = Math.max(0, mExpAll - mMand);

  // 2. Historical 90-day averages
  const d90 = new Date(now); d90.setDate(d90.getDate() - 90);
  const tx90 = realTxs.filter(t => new Date(t.date) >= d90 && t.category !== 'Цель');
  const inc90 = tx90.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  const exp90 = tx90.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);

  const avgMonthlyInc = inc90 > 0 ? (inc90 / 3) : 58000;
  const avgMonthlyExp = exp90 > 0 ? (exp90 / 3) : 25000;
  const activeLoansMonthly = loans.filter(l => !l.closed).reduce((s, l) => s + (Number(l.monthlyPayment) || 0), 0);

  // 3. Burn rate & Runway
  const currentDailyBurn = mLifeExp / dayOfMonth;
  const targetDailyBurn = budgetCap / daysInMonth;
  const projectedMonthLifeExp = currentDailyBurn * daysInMonth;
  const totalMonthlyOutflow = avgMonthlyExp + activeLoansMonthly;
  const runwayMonths = totalMonthlyOutflow > 0 ? (balance / totalMonthlyOutflow) : 12;

  // 4. Savings rate & DTI (Debt-to-Income)
  const netMonthlySurplus = avgMonthlyInc - totalMonthlyOutflow;
  const savingsRatePct = avgMonthlyInc > 0 ? Math.round((netMonthlySurplus / avgMonthlyInc) * 100) : 0;
  const dtiPct = avgMonthlyInc > 0 ? Math.round(((activeLoansMonthly + mMand) / avgMonthlyInc) * 100) : 0;

  // 5. Category anomaly & leak detection (Last 30 days vs previous 60 days)
  const d30 = new Date(now); d30.setDate(d30.getDate() - 30);
  const cat30 = {}, catCount30 = {}, catPrev60 = {};
  tx90.filter(t => t.type === 'expense').forEach(t => {
    const dt = new Date(t.date);
    if (dt >= d30) {
      cat30[t.category] = (cat30[t.category] || 0) + t.amount;
      catCount30[t.category] = (catCount30[t.category] || 0) + 1;
    } else {
      catPrev60[t.category] = (catPrev60[t.category] || 0) + t.amount;
    }
  });

  const anomalies = [];
  Object.keys(cat30).forEach(cat => {
    const curSum = cat30[cat];
    const prevAvg = (catPrev60[cat] || 0) / 2;
    if (prevAvg > 500 && curSum > prevAvg * 1.25) {
      const diffPct = Math.round(((curSum - prevAvg) / prevAvg) * 100);
      anomalies.push({ cat, curSum, prevAvg, diffPct, count: catCount30[cat] || 1 });
    }
  });
  anomalies.sort((a, b) => (b.curSum - b.prevAvg) - (a.curSum - a.prevAvg));

  // Small frequent purchases ("Эффект мелких чеков")
  const smallFreqTxs = tx90.filter(t => t.type === 'expense' && new Date(t.date) >= d30 && t.amount <= 450);
  const smallFreqSum = smallFreqTxs.reduce((s, t) => s + t.amount, 0);

  // 6. Upcoming car maintenance alert
  const urgentCarNodes = (svcItems || []).filter(it => {
    if (it.condOnly || it.conditionOnly) return it.conditionStatus === 'replace' || it.conditionStatus === 'critical';
    if (!it.km || !it.lastServiceOdo) return false;
    const done = Math.max(0, carOdo - it.lastServiceOdo);
    return (done / it.km) >= 0.85;
  });

  // 7. Compute Financial Health Score (0 - 100)
  let score = 50;
  // Runway contribution (up to +25)
  if (runwayMonths >= 6) score += 25;
  else if (runwayMonths >= 3) score += 18;
  else if (runwayMonths >= 1.5) score += 10;
  else score -= 10;

  // Savings rate contribution (up to +20)
  if (savingsRatePct >= 35) score += 20;
  else if (savingsRatePct >= 20) score += 14;
  else if (savingsRatePct >= 10) score += 6;
  else if (savingsRatePct < 0) score -= 15;

  // Daily burn discipline (up to +15)
  if (currentDailyBurn <= targetDailyBurn * 0.95) score += 15;
  else if (currentDailyBurn <= targetDailyBurn * 1.1) score += 8;
  else score -= 8;

  // DTI penalty
  if (dtiPct > 45) score -= 15;
  else if (dtiPct > 30) score -= 6;
  else score += 5;

  score = Math.max(5, Math.min(99, Math.round(score)));

  // 8. Build actionable insights list
  const insights = [];

  if (projectedMonthLifeExp > budgetCap * 1.08) {
    const over = Math.round(projectedMonthLifeExp - budgetCap);
    const safeDaily = Math.max(0, Math.round((budgetCap - mLifeExp) / daysLeftMonth));
    insights.push({
      level: 'warn',
      title: `⚡ Темп трат выше лимита (${fmtI(currentDailyBurn)} ₽/день вместо ${fmtI(targetDailyBurn)} ₽)`,
      text: `Если тратить в том же темпе, к концу месяца набежит ~${fmtI(projectedMonthLifeExp)} ₽ (перерасход +${fmtI(over)} ₽). Чтобы уложиться в лимит ${fmtI(budgetCap)} ₽, держи планку не более <b>${fmtI(safeDaily)} ₽/день</b> в оставшиеся ${daysLeftMonth} дн.`
    });
  } else {
    insights.push({
      level: 'ok',
      title: `✅ Отличная дисциплина бюджета (${fmtI(currentDailyBurn)} ₽/день)`,
      text: `Твой текущий темп повседневных расходов прогнозирует ~${fmtI(projectedMonthLifeExp)} ₽ за месяц — ты уверенно идёшь внутри лимита ${fmtI(budgetCap)} ₽ и сохраняешь профицит.`
    });
  }

  if (anomalies.length > 0) {
    const topA = anomalies[0];
    insights.push({
      level: 'warn',
      title: `📈 Скачок в категории «${topA.cat}» (+${topA.diffPct}% к среднему)`,
      text: `За последние 30 дней на «${topA.cat}» ушло <b>${fmtI(topA.curSum)} ₽</b> (${topA.count} чеков) против обычных ~${fmtI(topA.prevAvg)} ₽/мес. Сокращение этой статьи на 25% сбережёт тебе <b>+${fmtI(topA.curSum * 0.25 * 12)} ₽ в год</b>.`
    });
  }

  if (smallFreqTxs.length >= 12) {
    insights.push({
      level: 'info',
      title: `☕ «Эффект мелких чеков»: ${smallFreqTxs.length} покупок до 450 ₽`,
      text: `Незаметные мелкие траты за 30 дней сложились в <b>${fmtI(smallFreqSum)} ₽/мес</b> (~${fmtI(smallFreqSum * 12)} ₽/год). Оптимизация спонтанных заездов в магазин/кафе даст до +${fmtI(smallFreqSum * 0.35)} ₽ свободных денег ежемесячно.`
    });
  }

  if (urgentCarNodes.length > 0) {
    insights.push({
      level: 'warn',
      title: `🚗 Гараж: подходит срок ТО (${urgentCarNodes.slice(0,2).map(x=>x.label).join(', ')})`,
      text: `Рекомендуем зарезервировать в бюджете этого месяца средства на обслуживание авто, чтобы замена расходников не ударила по дневному лимиту.`
    });
  }

  const maxSafeLoanPayment = Math.max(0, Math.round(avgMonthlyInc * 0.30 - activeLoansMonthly));
  insights.push({
    level: netMonthlySurplus > 10000 ? 'ok' : 'info',
    title: `🏦 Кредитный потенциал и подушка безопасности`,
    text: `Твой средний чистый поток: <b>${netMonthlySurplus>=0?'+':''}${fmtI(netMonthlySurplus)} ₽/мес</b> (норма сбережений ${savingsRatePct}%). Запас прочности баланса: <b>${runwayMonths.toFixed(1)} мес.</b> Комфортный платёж по новому кредиту (ПДН до 30%): до <b>${fmtI(maxSafeLoanPayment)} ₽/мес</b>.`
  });

  return {
    score,
    avgMonthlyInc,
    avgMonthlyExp,
    totalMonthlyOutflow,
    netMonthlySurplus,
    savingsRatePct,
    runwayMonths,
    currentDailyBurn,
    targetDailyBurn,
    projectedMonthLifeExp,
    dtiPct,
    activeLoansMonthly,
    maxSafeLoanPayment,
    anomalies,
    smallFreqCount: smallFreqTxs.length,
    smallFreqSum,
    insights,
    forecast30: Math.round(balance + netMonthlySurplus),
    forecast90: Math.round(balance + netMonthlySurplus * 3),
    forecast180: Math.round(balance + netMonthlySurplus * 6)
  };
}

const TABS = ['finance','loans','print','stats','goals','garage','hub'];

class App {
  constructor(){
    this.db=new DB();
    this.tab='finance';
    this.statsStart=null; this.statsEnd=null;
    this.statsView='all';
    this.statsMonthRange=6;
    this._swipeDir=null;
    this._txShown=20; this._txSort="date_desc"; this._txType="";
    this._txDateFrom=""; this._txDateTo=""; this._txSearch=""; this._txCat="";
    this._hideTransfers=false;
    this.activeCarId = null;

    // 3D Print state
    this.printSubTab = 'calc'; // 'calc' | 'spools' | 'rates' | 'history'
    this._selFilId = null;
    this._selTier = 2;
    this._batchMode = 'batch'; // 'batch' (weight/time for whole plate) | 'single' (per 1 piece)
    this._carAutoSelected = false;
    this.loanSubTab = 'sim'; // 'sim' | 'active'

    this.db.ready.then(()=>this._init()).catch(e=>console.error('[Sentinel]',e));
  }

  _init(){
    document.querySelectorAll('#bottom-nav .nav-item').forEach(item=>{
      item.addEventListener('click', ()=>{
        const t = item.dataset.tab;
        if(!t || t===this.tab) return;
        const oldIdx=TABS.indexOf(this.tab), newIdx=TABS.indexOf(t);
        this._swipeDir = newIdx>oldIdx ? 'left' : 'right';
        this.tab=t;
        this._syncNavUI();
        this._render(false); // Scroll to top ONLY on tab change
      });
    });

    document.getElementById('quick-fab').onclick = () => this._openQuickActionModal();
    document.getElementById('sber-sync-top').onclick = () => this._openSberSyncModal();

    document.getElementById('exp-btn').onclick=()=>this._export();
    document.getElementById('imp-btn-trigger').onclick = () => document.getElementById('imp-file').click();
    document.getElementById('imp-file').onchange=e=>this._import(e.target.files[0]);

    document.getElementById('global-modal').addEventListener('click', e => {
      if(e.target.id === 'global-modal') closeModal();
    });

    this._initSwipe();
    this._render(false);
  }

  _syncNavUI(){
    document.querySelectorAll('#bottom-nav .nav-item').forEach(el=>{
      el.classList.toggle('active', el.dataset.tab===this.tab);
    });
  }

  _initSwipe(){
    const el=document.getElementById('app-content');
    let sx=0,sy=0,moved=false;
    const isInteractive = target => {
      if(!target || !target.closest) return false;
      return Boolean(target.closest('input, select, textarea, button, label, summary, details, .chips-scroll, .h-chart-wrap, .seg-bar, .diff-grid, .acc-grid'));
    };
    el.addEventListener('touchstart',e=>{
      if(isInteractive(e.target)) { sx=0; return; }
      sx=e.touches[0].clientX; sy=e.touches[0].clientY; moved=false;
    },{passive:true});
    el.addEventListener('touchmove',e=>{
      if(!sx) return;
      const dx=Math.abs(e.touches[0].clientX-sx),dy=Math.abs(e.touches[0].clientY-sy);
      if(dx>dy&&dx>18) moved=true;
    },{passive:true});
    el.addEventListener('touchend',e=>{
      if(!moved||!sx) { sx=0; return; }
      const dx=e.changedTouches[0].clientX-sx;
      const dy=e.changedTouches[0].clientY-sy;
      sx=0;
      if(Math.abs(dx)<75||Math.abs(dx)<Math.abs(dy)*1.8) return;
      const cur=TABS.indexOf(this.tab);
      let next=-1;
      if(dx<0&&cur<TABS.length-1) next=cur+1;
      if(dx>0&&cur>0) next=cur-1;
      if(next<0) return;
      this._swipeDir=dx<0?'left':'right';
      this.tab=TABS[next];
      this._syncNavUI();
      this._render(false);
    },{passive:true});
  }

                <select id="et-c-${id}">${expCats.map(x=>`<option value="${x}" ${x===tp.category?'selected':''}>${x}</option>`).join('')}</select>
                <input type="text" inputmode="decimal" id="et-a-${id}" placeholder="Сумма" value="${tp.amount||''}">
              </div>
              <button class="btn g sm full" id="et-s-${id}">Сохранить плашку</button>
            `;
            box.querySelector(`#et-s-${id}`).onclick = async () => {
              tp.label = box.querySelector(`#et-l-${id}`).value.trim() || tp.label;
              tp.category = box.querySelector(`#et-c-${id}`).value;
              tp.amount = parseMoney(box.querySelector(`#et-a-${id}`).value);
              await this.db.set(S.TPL, tp);
              renderTab('tpl');
              this._render(true);
            };
          };
        });

        body.querySelectorAll('[data-deltpl]').forEach(btn => {
          btn.onclick = () => confirmDel(btn, async () => {
            const id = Number(btn.dataset.deltpl);
            await this.db.del(S.TPL, id);
            const idx = tpls.findIndex(x => x.id === id);
            if (idx >= 0) tpls.splice(idx, 1);
            renderTab('tpl');
            this._render(true);
          });
        });
      }
    };

    c.querySelectorAll('[data-cmt]').forEach(b => {
      b.onclick = () => renderTab(b.dataset.cmt);
    });
    renderTab(initTab);
  }

  /* ═══════ SCROLL-PRESERVING RENDER ENGINE ═══════ */
  async _render(preserveScroll = true){
    const savedScrollY = preserveScroll ? window.scrollY : 0;
    const c = document.getElementById('app-content');
    if(preserveScroll && c.offsetHeight > 0){
      c.style.minHeight = c.offsetHeight + 'px';
    }

    await this._updateHeaderPills();

    const wrap = document.createElement('div');
    if(!preserveScroll && this._swipeDir === 'left') wrap.className = 'page-slide-left';
    else if(!preserveScroll && this._swipeDir === 'right') wrap.className = 'page-slide-right';
    this._swipeDir = null;

    const map = {
      finance: () => this._finance(wrap),
      loans:   () => this._loans(wrap),
      goals:   () => this._goals(wrap),
      garage:  () => this._garage(wrap),
      print:   () => this._print(wrap),
      hub:     () => this._hub(wrap),
      stats:   () => this._stats(wrap)
    };

    await (map[this.tab] || map.finance)();
    c.replaceChildren(wrap);
    c.style.minHeight = '';

    if(preserveScroll){
      window.scrollTo(0, savedScrollY);
    } else {
      window.scrollTo({ top: 0, behavior: 'instant' });
    }
  }

  _card(extra=''){const el=document.createElement('div');el.className='card'+extra;return el;}

  /* ═══════ FINANCE (UNIFIED BALANCE + AI ADVISOR + EDITABLE CATEGORIES) ═══════ */
  async _finance(c){
    const balance    = await this.db.cfg('balance');
    const budgetCap  = await this.db.cfg('monthlyBudgetCap');
    const advAmt     = await this.db.cfg('advanceAmount');
    const salAmt     = await this.db.cfg('salaryAmount');
    const txs        = (await this.db.all(S.TX)).filter(t=>t.type==='expense'||t.type==='income');
    const goals      = (await this.db.all(S.GOALS)).filter(g=>g.active);
    const tpls       = await this.db.all(S.TPL);
    const loans      = await this.db.all(S.LOANS);
    const cars       = await this.db.all(S.CARS);
    const svcItems   = await this.db.all(S.SVC);
    const smsRules   = await this.db.all(S.RULES);
    const expCatInfo = await this.db.getSortedCatsWithFreq('expense', txs);
    const incCatInfo = await this.db.getSortedCatsWithFreq('income', txs);

    const now        = new Date(), todayStr=today();
    const mStart     = new Date(now.getFullYear(),now.getMonth(),1);

    const isGoal = t => t.type==='expense' && (t.category==='Цель'||(t.category==='Цель/Долг'&&goals.some(g=>g.name===t.comment)));

    const mandTxs        = txs.filter(t=>t.type==='expense'&&t.isMandatory&&new Date(t.date)>=mStart);
    const mandatorySpent = mandTxs.reduce((s,t)=>s+t.amount,0);

    const mandAvgMonths=[];
    for(let i=1;i<=3;i++){
      const ms=new Date(now.getFullYear(),now.getMonth()-i,1);
      const me=new Date(now.getFullYear(),now.getMonth()-i+1,1);
      const s=txs.filter(t=>t.type==='expense'&&t.isMandatory&&new Date(t.date)>=ms&&new Date(t.date)<me).reduce((a,t)=>a+t.amount,0);
      if(s>0) mandAvgMonths.push(s);
    }
    const mandForecast = mandAvgMonths.length ? Math.round(mandAvgMonths.reduce((a,v)=>a+v,0)/mandAvgMonths.length) : 0;

    const mandByCat={};
    mandTxs.forEach(t=>{ mandByCat[t.category]=(mandByCat[t.category]||0)+t.amount; });

    const spentMonth = txs.filter(t=>t.type==='expense'&&new Date(t.date)>=mStart&&!isGoal(t)&&!t.isMandatory).reduce((s,t)=>s+t.amount,0);

    const dInM        = new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
    const dRem        = Math.max(1,dInM-now.getDate()+1);

      ${exceeded?`<div class="reminder red" style="margin-top:10px">⚠ Дневной лимит превышен на ${fmt(Math.abs(remainToday))} ₽</div>`:''}
      ${freeCash>500?`<div class="free-cash">💰 Свободный резерв: <b>${fmt(freeCash)} ₽</b> (сверх лимита до выплаты)</div>`:''}

          ${tpls.map(t=>`<div class="q-chip" data-tid="${t.id}">${t.label}</div>`).join('')}

        </div>
      </div>
    `;
    c.appendChild(balCard);

    balCard.querySelector('#btn-sync-bal').onclick = () => this._openSberSyncModal();
    balCard.querySelector('#btn-manage-cats').onclick = () => this._openCategoryManagerModal('exp');
    balCard.querySelector('#add-tpl-chip').onclick = () => this._openCategoryManagerModal('tpl');
    balCard.querySelector('#set-bal').onclick = () => {
      const ed = balCard.querySelector('#bal-ed');
      if(ed.innerHTML){ ed.innerHTML=''; return; }
      ed.innerHTML = `<div style="display:flex;gap:8px;margin-top:10px"><input type="text" inputmode="decimal" id="bi" placeholder="${balance}" value="${balance}" style="flex:1"><button class="btn c" id="bs">Сохранить</button></div>`;
      const bi = ed.querySelector('#bi');
      bi.focus(); bi.select();
      ed.querySelector('#bs').onclick = async () => {
        const v = parseMoney(bi.value);
        if(!isNaN(v) && v >= 0){ await this.db.setCfg('balance', v); this._render(true); }
      };
    };

    balCard.querySelectorAll('#fin-quick-chips .q-chip[data-tid]').forEach(chip=>{
      chip.onclick = () => {
        const tpl = tpls.find(x=>x.id===Number(chip.dataset.tid));
        if(tpl) this._openQuickActionModal({ type:'expense', category:tpl.category, amount:tpl.amount||'', comment:tpl.label.replace(/^[^\wа-яА-ЯёЁa-zA-Z0-9]+/, '').trim(), isMandatory:tpl.isMandatory });
      };
    });

    // 2. SENTINEL AI FINANCIAL ADVISOR WIDGET
    {
      const intel = buildFinancialIntelligence({
        balance, budgetCap, txs, goals, loans, svcItems, carOdo: cars[0]?.odo || 0
      });
      const sCol = intel.score >= 75 ? 'var(--green)' : intel.score >= 50 ? 'var(--cyan)' : 'var(--orange)';
      const topInsight = intel.insights[0];
      const aiCard = this._card();
      aiCard.innerHTML = `
        <div class="card-title">
          <span>🧠 AI-Советник Sentinel (Индекс: ${intel.score}/100)</span>
          <button class="btn c sm" id="btn-open-ai" style="padding:4px 9px">Аудит и Симулятор ›</button>
        </div>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
          <div class="ai-score-ring" style="width:48px;height:48px;border-color:${sCol};color:${sCol}">
            <span style="font-size:16px">${intel.score}</span>
          </div>
          <div style="flex:1;min-width:0;font-size:11px;line-height:1.45">
            <div style="font-weight:800;color:var(--text)">Запас прочности: <span style="color:${sCol}">${intel.runwayMonths.toFixed(1)} мес.</span> · Прогноз 30д: <span style="color:var(--cyan)">${fmtI(intel.forecast30)} ₽</span></div>
            <div style="color:var(--muted);margin-top:2px">Комфортный лимит кредита: до <b>${fmtI(intel.maxSafeLoanPayment)} ₽/мес</b></div>
          </div>
        </div>
        ${topInsight ? `<div class="ai-insight ${topInsight.level}" style="margin-bottom:0"><b>${topInsight.title}</b><br>${topInsight.text}</div>` : ''}
      `;
      c.appendChild(aiCard);
      aiCard.querySelector('#btn-open-ai').onclick = () => this._openAiAdvisorModal();
    }

    // 3. BUDGET & PAYDAYS
    const dayCol=remainToday<0?'#ff4d5e':remainToday<200?'#ffa040':'#00ff95';
    const budCard=this._card();
    budCard.innerHTML=`<div class="card-title">Бюджет и выплаты (ЗП · Аванс · Премия)</div>
      <div class="b-row">
        <div class="b-key">Ближайшая выплата</div>
        <div class="b-val">
          <span class="payday-tag">${payday.label} · ${dStr(payday.date)}</span>
          <span style="color:var(--violet);margin-left:5px"><b>${payday.days}</b> дн.</span>

      </div>
      <div style="display:flex;gap:6px;margin:8px 0 10px;flex-wrap:wrap">

    budCard.querySelector('#claim-adv').onclick = () => this._openQuickActionModal({ type:'income', category:'Аванс', amount:advAmt, comment:'Аванс' });
    budCard.querySelector('#claim-bonus').onclick = () => this._openQuickActionModal({ type:'income', category:'Премия', amount:'', comment:'Премия' });

    budCard.querySelector('#bud-save').onclick=async()=>{

    // 4. INLINE NEW TRANSACTION CARD (WITH FREQUENT CATEGORY CHIPS & EDITABLE CATEGORIES)
    const txCard=this._card();

        <span>✍️ Записать транзакцию</span>
        <div style="display:flex;gap:5px">
          <button class="btn c sm" id="tx-paste-btn">📋 Из Сбера</button>

      <div class="seg-bar">
        <div class="seg-btn active" data-it="expense">➖ Расход</div>
        <div class="seg-btn" data-it="income">➕ Доход</div>
      </div>
      <div style="margin-bottom:8px">
        <div style="font-size:9.5px;color:var(--muted);font-weight:700;margin-bottom:4px">🔥 ЧАСТО ИСПОЛЬЗУЕМЫЕ КАТЕГОРИИ:</div>
        <div class="chips-scroll" id="inline-freq-cats"></div>
      </div>
      <div class="g2">
        <div class="ig">
          <label class="lbl">Сумма (можно 300+150)</label>
          <input type="text" inputmode="decimal" autocomplete="off" id="tx-amt" placeholder="Сумма ₽" style="font-weight:800;color:var(--cyan)">
          <div class="mini-pills">
            <span class="mini-pill" data-tadd="100">+100</span>
            <span class="mini-pill" data-tadd="250">+250</span>
            <span class="mini-pill" data-tadd="500">+500</span>
            <span class="mini-pill" data-tadd="1000">+1к</span>
          </div>
        </div>
        <div class="ig">
          <label class="lbl">Все категории</label>
          <select id="tx-cat"></select>
        </div>
      </div>
      <div class="g2">
        <div class="ig">
          <label class="lbl">Дата (нажми для календаря)</label>
          <input type="date" id="tx-date" value="${todayStr}">
          <div class="mini-pills">
            <span class="mini-pill" data-tdt="0">Сегодня</span>
            <span class="mini-pill" data-tdt="-1">Вчера</span>
            <span class="mini-pill" data-tdt="-2">−2 дня</span>
          </div>
        </div>
        <div class="ig">
          <label class="lbl">Комментарий</label>
          <input type="text" id="tx-comment" placeholder="Например: Ozon / Пятёрочка">
        </div>
      </div>
      <div id="mandatory-wrap">
        <label class="mandatory-row" id="mand-row">
          <div class="mandatory-toggle"><input type="checkbox" id="tx-mandatory"><span class="mandatory-knob"></span></div>
          <div>
            <div class="mandatory-lbl">Обязательный платёж</div>
            <div class="mandatory-sub">Бензин, связь, ЖКХ — не уменьшает дневной лимит на жизнь</div>
          </div>
        </label>
      </div>
      <button class="btn c full" id="tx-add" style="margin-top:10px;padding:12px">Добавить запись</button>`;
    c.appendChild(txCard);

    let inlineType = 'expense';
    const catEl=txCard.querySelector('#tx-cat');
    const inlineFreqBar=txCard.querySelector('#inline-freq-cats');
    const mandWrap=txCard.querySelector('#mandatory-wrap');
    const mandRow=txCard.querySelector('#mand-row');
    const mandCb=txCard.querySelector('#tx-mandatory');
    const txAmtEl=txCard.querySelector('#tx-amt');
    const txDateEl=txCard.querySelector('#tx-date');

    txCard.querySelector('#tx-edit-cats').onclick = () => this._openCategoryManagerModal(inlineType === 'income' ? 'inc' : 'exp');

    const fillCats=()=>{
      txCard.querySelectorAll('[data-it]').forEach(b=>b.classList.toggle('active', b.dataset.it===inlineType));
      const info = inlineType === 'expense' ? expCatInfo : incCatInfo;
      const list = info.sorted;
      if(inlineType==='expense'){
        mandWrap.style.display='block';
        let html=list.map(x=>`<option value="${x}">${x}${MANDATORY_CATS_HINT.has(x)?' ★':''}${info.counts[x]?` (${info.counts[x]})`:''}</option>`).join('');
        if(allGoals.length){html+='<option disabled>── Цели ──</option>';allGoals.forEach(g=>{html+=`<option value="ЦЕЛЬ:${g.name}">🎯 ${g.name}</option>`;});}
        catEl.innerHTML=html;
      } else {
        mandWrap.style.display='none';
        mandCb.checked=false;mandRow.classList.remove('on');
        catEl.innerHTML=list.map(x=>`<option value="${x}">${x}${info.counts[x]?` (${info.counts[x]})`:''}</option>`).join('');
      }
      inlineFreqBar.innerHTML = list.slice(0, 8).map(cat => `
        <div class="q-chip ${catEl.value===cat?'active':''}" data-ifcat="${cat}">${cat}</div>
      `).join('');
      inlineFreqBar.querySelectorAll('[data-ifcat]').forEach(ch => {
        ch.onclick = () => {
          catEl.value = ch.dataset.ifcat;
          inlineFreqBar.querySelectorAll('[data-ifcat]').forEach(x => x.classList.toggle('active', x.dataset.ifcat === catEl.value));
          if(inlineType==='expense' && MANDATORY_CATS_HINT.has(catEl.value)){
            mandCb.checked=true; mandRow.classList.add('on');
          }
        };
      });
    };
    fillCats();

    txCard.querySelectorAll('[data-it]').forEach(btn=>{
      btn.onclick=()=>{ inlineType=btn.dataset.it; fillCats(); };
    });
    catEl.onchange=()=>{
      inlineFreqBar.querySelectorAll('[data-ifcat]').forEach(x => x.classList.toggle('active', x.dataset.ifcat === catEl.value));
      if(inlineType==='expense' && MANDATORY_CATS_HINT.has(catEl.value)){
        mandCb.checked=true; mandRow.classList.add('on');

    };
    mandCb.onchange=()=>mandRow.classList.toggle('on',mandCb.checked);

    txCard.querySelectorAll('[data-tadd]').forEach(pill=>{

      inlineType = parsed.type === 'income' ? 'income' : 'expense';

      if(parsed.amount > 0) txAmtEl.value = parsed.amount;
      catEl.value = parsed.category;
      inlineFreqBar.querySelectorAll('[data-ifcat]').forEach(x => x.classList.toggle('active', x.dataset.ifcat === catEl.value));
      if(parsed.dateISO) txDateEl.value = parsed.dateISO;
      txCard.querySelector('#tx-comment').value = parsed.comment;
      mandCb.checked = !!parsed.isMandatory;
      mandRow.classList.toggle('on', mandCb.checked);
    };

          const clip = await navigator.clipboard.readText();

            inlineSberBox.style.display = 'block';
            inlineSberTxt.value = clip.trim();
            applyInlineParsed(clip);
            showInlineMsg(txCard, `✓ Распознано из буфера!`);

          }

      } catch (_) {}
      inlineSberBox.style.display = inlineSberBox.style.display === 'none' ? 'block' : 'none';
      inlineSberTxt.focus();
    };
    inlineSberTxt.oninput = () => applyInlineParsed(inlineSberTxt.value);

    txCard.querySelector('#tx-add').onclick=async()=>{

      const isMandatory=inlineType==='expense'&&mandCb.checked;
      if(cat.startsWith('ЦЕЛЬ:')){comment=cat.substring(5);cat='Цель';}
      await this.db.add(S.TX,{amount:amt,type:inlineType,category:cat,comment,date:dateFull,isMandatory:isMandatory||false});
      await this.db.adjustAccountBalance(inlineType,amt);
      this._render(true);
    };

    // 5. MANDATORY PAYMENTS SUMMARY
    {
      const mandCard=this._card();
      const catEntries=Object.entries(mandByCat).sort((a,b)=>b[1]-a[1]);
      mandCard.innerHTML=`<div class="card-title">Обязательные платежи (текущий месяц)</div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
          <div style="font-size:20px;font-weight:800;color:var(--orange)">${fmt(mandatorySpent)} ₽</div>
          <div style="font-size:10px;color:var(--muted)">Не режут дневной лимит</div>
        </div>
        ${catEntries.length?`<div style="margin-top:6px">
          ${catEntries.map(([cat,amt])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11px">

            <span style="color:var(--orange);font-weight:700">${fmt(amt)} ₽</span>
          </div>`).join('')}

      c.appendChild(mandCard);
    }

    await this._renderTxHistory(c, txs, goals);
  }

  async _renderTxHistory(c, txs, goals){
    const histCard=this._card();
    const customExp = await this.db.getCats('expense');
    const customInc = await this.db.getCats('income');
    const allCats=[...new Set([...customExp,...customInc,...CAT_EXP,...CAT_INC,'Кредиты и рассрочки','Цель'])];

    histCard.innerHTML=`
      <div class="card-title">
        <span>История операций (${txs.length})</span>
      </div>
      <div class="tx-filter-bar">

          <span class="filter-label" style="margin-right:4px">Сорт:</span>
          <button class="tx-sort-btn ${this._txSort==='date_desc'?'active':''}" data-s="date_desc">↓ Новые</button>
          <button class="tx-sort-btn ${this._txSort==='date_asc'?'active':''}" data-s="date_asc">↑ Старые</button>
          <button class="tx-sort-btn ${this._txSort==='amt_desc'?'active':''}" data-s="amt_desc">↓ Сумма</button>
          <button class="tx-sort-btn ${this._txSort==='amt_asc'?'active':''}" data-s="amt_asc">↑ Сумма</button>
        </div>
      </div>
      <div id="tx-stats-row" style="display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap"></div>
      <div id="tx-list"></div>
      <div id="tx-page-bar" class="tx-page-bar"></div>

    fromEl.value=this._txDateFrom||'';

    const getFiltered=()=>{
      let fil=[...txs];
      const q=(this._txSearch||'').toLowerCase();
      if(q) fil=fil.filter(t=>(t.comment||'').toLowerCase().includes(q)||(t.category||'').toLowerCase().includes(q));
      if(this._txCat) fil=fil.filter(t=>t.category===this._txCat);
      if(this._txType==='income') fil=fil.filter(t=>t.type==='income');
      else if(this._txType==='expense') fil=fil.filter(t=>t.type==='expense');
      else if(this._txType==='mandatory') fil=fil.filter(t=>t.isMandatory);
      if(this._txDateFrom){const d=new Date(this._txDateFrom+'T00:00:00');fil=fil.filter(t=>new Date(t.date)>=d);}
      if(this._txDateTo){const d=new Date(this._txDateTo+'T23:59:59');fil=fil.filter(t=>new Date(t.date)<=d);}
      if(this._txSort==='date_desc') fil.sort((a,b)=>new Date(b.date)-new Date(a.date) || (b.id||0)-(a.id||0));
      else if(this._txSort==='date_asc') fil.sort((a,b)=>new Date(a.date)-new Date(b.date) || (a.id||0)-(b.id||0));
      else if(this._txSort==='amt_desc') fil.sort((a,b)=>b.amount-a.amount);
      else if(this._txSort==='amt_asc') fil.sort((a,b)=>a.amount-b.amount);

    const renderList=()=>{
      const fil=getFiltered();
      const listEl=histCard.querySelector('#tx-list');

      const fInc=fil.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);

      statsRow.innerHTML=`
        <span style="font-size:10.5px;color:var(--green)">Доходы: <b>+${fmt(fInc)} ₽</b></span>

      const shown=fil.slice(0,this._txShown);
      shown.forEach(tx=>{

        const del=document.createElement('button'); del.className='del-btn'; del.textContent='×';

        row.innerHTML=`<div style="min-width:0;flex:1">

        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <span class="amt ${amtCls}">${prefix}${fmt(tx.amount)} ₽</span>
        </div>`;
        row.querySelector('div:last-child').appendChild(del);
        del.onclick=()=>confirmDel(del,async()=>{
          del._ok=true;
          await this.db.del(S.TX,tx.id);
          await this.db.adjustAccountBalance(tx.type, tx.amount, 'card', '', true);
          this._render(true);
        });
        listEl.appendChild(row);
      });

      countLine.textContent=`Показано ${Math.min(this._txShown,fil.length)} из ${fil.length}`;
      if(fil.length>this._txShown){
        const rem=fil.length-this._txShown;
        const next30=Math.min(30,rem);
        const btnMore=document.createElement('button');
        btnMore.className='tx-page-btn';
        btnMore.textContent=`↓ Показать ещё ${next30}`;
        btnMore.onclick=()=>{this._txShown+=30;renderList();};
        pageBar.appendChild(btnMore);
      } else if(this._txShown>20){
        const btnCollapse=document.createElement('button');
        btnCollapse.className='tx-page-btn';
        btnCollapse.textContent='↑ Свернуть список';
        btnCollapse.onclick=()=>{this._txShown=20;renderList();};
        pageBar.appendChild(btnCollapse);
      }
    };

    let debTimer;
    const save=()=>{
      this._txSearch=qEl.value;
      this._txCat=fcEl.value;
      this._txType=ftEl.value;
      this._txDateFrom=fromEl.value;
      this._txDateTo=toEl.value;
      this._txShown=20;
      renderList();
    };

    qEl.oninput=()=>{clearTimeout(debTimer);debTimer=setTimeout(save,200);};
    fcEl.onchange=ftEl.onchange=fromEl.onchange=toEl.onchange=save;

    histCard.querySelectorAll('.tx-sort-btn').forEach(btn=>{
      btn.onclick=()=>{
        histCard.querySelectorAll('.tx-sort-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        this._txSort=btn.dataset.s;
        this._txShown=20;
        renderList();
      };
    });

    this._txShown=this._txShown||20;
    renderList();
  }

  /* ═══════ LOANS & INSTALLMENTS CENTER (UNIVERSAL CALCULATOR + AI STRESS-TEST + TRACKER) ═══════ */
  async _loans(c) {

      const priceInp = simCard.querySelector('#ln-price');

          } else if (p === 'zero') {

            if (!priceInp.value) priceInp.value = 60000;

            rateInp.value = 0;
            termInp.value = 12;
          } else if (p === 'cash') {
            nameInp.value = 'Потребительский кредит';
            if (!priceInp.value) priceInp.value = 250000;

            rateInp.value = 22;

      simCard.querySelector('#ln-calc-btn').onclick = () => {
        const totalPrice = parseMoney(priceInp.value);

        const principal = Math.max(0, totalPrice - downPay) + insFee;
        if (principal <= 0) {

          return;
        }

        const r = (annualRate / 100) / 12;
        let baseMonthly = 0;
        let firstMonthly = 0;
        let lastMonthly = 0;
        let totalInterest = 0;
        const schedule = [];

        if (payType === 'annuity') {
          if (r <= 0) {
            baseMonthly = principal / termMonths;
          } else {
            const pow = Math.pow(1 + r, termMonths);
            baseMonthly = principal * ((r * pow) / (pow - 1));
          }
          firstMonthly = baseMonthly;
          lastMonthly = baseMonthly;
          totalInterest = (baseMonthly * termMonths) - principal;
        } else {
          // Differentiated
          const bodyPart = principal / termMonths;
          let rem = principal;
          for (let m = 1; m <= termMonths; m++) {
            const intPart = rem * r;
            const p = bodyPart + intPart;
            if (m === 1) firstMonthly = p;
            if (m === termMonths) lastMonthly = p;
            totalInterest += intPart;
            rem -= bodyPart;
          }
          baseMonthly = firstMonthly;
        }

        // Simulate actual schedule with extraMonthly (early payoff)
        let remDebt = principal;
        let actualMonths = 0;

          let bodyPay = totalPayThisMonth - intMonth;
          if (bodyPay <= 0) bodyPay = remDebt / termMonths;
          if (bodyPay >= remDebt) {
            bodyPay = remDebt;
            totalPayThisMonth = bodyPay + intMonth;
          }
          remDebt = Math.max(0, remDebt - bodyPay);
          schedule.push({

            body: bodyPay,

            rem: remDebt

            <div class="b-row"><span class="b-key">Тело кредита (за вычетом взноса):</span><span class="b-val" style="color:var(--cyan)">${fmtI(principal)} ₽</span></div>

            <div class="b-row"><span class="b-key">Переплата по процентам:</span><span class="b-val" style="color:var(--orange)">${fmtI(actualInterest)} ₽ (${overpayPct}%)</span></div>
            <div class="b-row"><span class="b-key">Полная стоимость кредита (с взносом):</span><span class="b-val">${fmtI(downPay + principal + actualInterest)} ₽</span></div>

                ⚡ <b>Эффект досрочки (+${fmtI(extraMonthly)} ₽/мес):</b> закроешь за <b>${actualMonths} мес.</b> вместо ${termMonths} мес. (быстрее на <b>${savedMonths} мес.</b>) и сэкономишь <b>+${fmtI(savedInterest)} ₽</b> на процентах!

              ${schedule.map(row => `

        await this.db.add(S.LOANS, {
          name, totalAmount: rem, remainingDebt: rem, rate,
          monthlyPayment: pay || Math.round(rem / 12),

      } else {
        loans.forEach(ln => {
          const paid = Math.max(0, (ln.totalAmount || ln.remainingDebt) - ln.remainingDebt);
          const pct = ln.totalAmount > 0 ? Math.min(100, (paid / ln.totalAmount) * 100) : 0;
          const mLeft = ln.monthlyPayment > 0 ? Math.ceil(ln.remainingDebt / ln.monthlyPayment) : 0;
          const lc = this._card();
          lc.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">

              </div>
              <button class="del-btn" data-delln="${ln.id}">×</button>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px">
              <span>Выплачено: <b>${fmtI(paid)} ₽</b> (${pct.toFixed(0)}%)</span>
              <span style="color:var(--orange);font-weight:700">Остаток: ${fmt(ln.remainingDebt)} ₽</span>
            </div>
            <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
            <div class="btn-row" style="margin-top:10px">
              <button class="btn g sm" data-payln="${ln.id}" style="flex:1">✓ Внести платёж (${fmtI(ln.monthlyPayment)} ₽)</button>
              <button class="btn c sm" data-extraln="${ln.id}" style="flex:1">⚡ Досрочно</button>
            </div>
            <div id="ln-extra-box-${ln.id}" style="display:none;margin-top:8px"></div>
          `;
          c.appendChild(lc);

          lc.querySelector(`[data-delln="${ln.id}"]`).onclick = () => confirmDel(lc.querySelector(`[data-delln="${ln.id}"]`), async () => {
            await this.db.del(S.LOANS, ln.id);
            this._render(true);
          });

          lc.querySelector(`[data-payln="${ln.id}"]`).onclick = async () => {
            const payAmt = Math.min(ln.remainingDebt, ln.monthlyPayment);
            if (payAmt <= 0) return;
            const monthInterest = (ln.remainingDebt * ((ln.rate || 0) / 100)) / 12;
            const principalPart = Math.max(0, payAmt - monthInterest);
            ln.remainingDebt = Math.max(0, +(ln.remainingDebt - (principalPart > 0 ? principalPart : payAmt)).toFixed(2));
            if (ln.remainingDebt <= 1) ln.closed = true;
            await this.db.set(S.LOANS, ln);
            await this.db.add(S.TX, {
              amount: payAmt, type: 'expense', category: 'Кредиты и рассрочки',
              comment: `Платёж по кредиту: ${ln.name}`, date: new Date().toISOString(), isMandatory: true
            });
            await this.db.adjustAccountBalance('expense', payAmt);
            this._render(true);
          };

          lc.querySelector(`[data-extraln="${ln.id}"]`).onclick = () => {
            const box = lc.querySelector(`#ln-extra-box-${ln.id}`);
            if (box.style.display === 'block') { box.style.display = 'none'; return; }
            box.style.display = 'block';
            box.innerHTML = `
              <div style="display:flex;gap:6px">
                <input type="text" inputmode="decimal" id="lne-inp-${ln.id}" placeholder="Сумма досрочного погашения ₽" style="flex:1">
                <button class="btn g sm" id="lne-ok-${ln.id}">Погасить</button>
              </div>
            `;
            box.querySelector(`#lne-ok-${ln.id}`).onclick = async () => {
              const amt = parseMoney(box.querySelector(`#lne-inp-${ln.id}`).value);
              if (!amt || amt <= 0) return;
              ln.remainingDebt = Math.max(0, +(ln.remainingDebt - amt).toFixed(2));
              if (ln.remainingDebt <= 1) ln.closed = true;
              await this.db.set(S.LOANS, ln);
              await this.db.add(S.TX, {
                amount: amt, type: 'expense', category: 'Кредиты и рассрочки',
                comment: `Досрочное погашение: ${ln.name}`, date: new Date().toISOString(), isMandatory: false
              });
              await this.db.adjustAccountBalance('expense', amt);
              this._render(true);
            };
          };
        });
      }
    }
  }
